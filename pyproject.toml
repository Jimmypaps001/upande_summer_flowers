[project]
name = "upande_summer_flowers"
authors = [
    { name = "James Kiruga", email = "james@upande.com"}
]
description = "Summer flower demand, production planning, motherstock and TC scheduling"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=16.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# Every dependency declaration is commented out, on request.
#
# requires-python above and the empty `dependencies` list are the only constraints
# left, and neither names another app: required_apps in hooks.py is commented out
# too, so nothing stops this app being installed on a bench that lacks the apps it
# actually reads from.
#
# What it really needs at runtime, regardless of what is declared here:
#   frappe and erpnext          -- Item, Warehouse, Company, Workflow, accounts
#   upande_agriculture          -- Crop Protocol, and the native fields this app
#                                  extends with custom_sf_* and derives into
#   upande_propagation          -- Block and Bed, which are the unit of space
# Install it without those and it will install cleanly and then fail on first use
# with missing doctypes rather than a readable message.
#
# The Frappe major line this app is built against. bench and Frappe Cloud read this
# to decide whether the app can be installed on a given bench; with it commented
# out they may instead report "Could not find compatible Frappe version in
# pyproject.toml file", so if a deploy fails on that, this is the block to restore.
# [tool.bench.frappe-dependencies]
# frappe = ">=16.0.0,<17.0.0"

# These dependencies are only installed when developer mode is enabled
# [tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
# [deploy.dependencies.apt]
# packages = []

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
    "UP037", # quoted annotations
    "UP040", # Use type aliases instead of type annotations
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
