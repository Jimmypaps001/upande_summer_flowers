<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Upande · Summer Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,900&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Shades of black — from the Upande logo */
  --ink:#0a0a0a; --ink-1:#1a1a18; --ink-2:#2a2a26; --ink-3:#3a3a34;
  --ink-4:#5a5a52; --ink-mute:#8a8780; --ink-faint:#b8b6ae;

  /* Surfaces */
  --bg:#f4f3ef; --surface:#fafaf6; --surface-2:#ffffff;
  --hairline:rgba(10,10,10,0.06);
  --shadow-card:0 1px 0 rgba(10,10,10,0.04), 0 8px 32px -16px rgba(10,10,10,0.10);
  --shadow-hover:0 1px 0 rgba(10,10,10,0.06), 0 24px 48px -24px rgba(10,10,10,0.18);
  --shadow-float:0 2px 4px rgba(10,10,10,.06), 0 18px 48px -18px rgba(10,10,10,.30);
  --shadow-pop:0 4px 12px rgba(10,10,10,.10), 0 32px 64px -20px rgba(10,10,10,.40);

  /* Rose ramp — this page's data accent */
  --rose-100:#f9e4e6; --rose-300:#e79aa2; --rose-500:#c8515f;
  --rose-600:#a83a48; --rose-700:#872b37;
  --signal:var(--rose-600);

  /* Data series */
  --s-budget:#8a8780; --s-forecast:#2a6f8f; --s-revised:#d9962e; --s-actual:#3f8f4f;
  --warn:#d9962e; --neg:#c4302b; --pos:#3f8f4f;

  --grad-ink:linear-gradient(135deg,#0a0a0a 0%,#3a3a34 100%);
  --grid:'Inter',-apple-system,'Segoe UI',sans-serif;
  --meta:'DM Sans',-apple-system,'Segoe UI',sans-serif;
  --sans:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --display:'Fraunces',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --sbw:214px;
  --idx:26px; --gh:96px; --lbl:126px; --spark:104px; --grade:46px; --cell:74px;
  --froze:calc(var(--idx) + var(--gh) + var(--lbl) + var(--spark) + var(--grade));
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--sans);font-size:14px;color:var(--ink-3);background:var(--bg);
  line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden;
  padding-left:calc(var(--sbw) + 26px)}
body.sb-collapsed{--sbw:64px}
::-webkit-scrollbar{height:7px;width:7px}
::-webkit-scrollbar-thumb{background:rgba(10,10,10,.18);border-radius:99px;
  border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(10,10,10,.30);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
.sidebar__nav::-webkit-scrollbar{width:4px}
.sidebar__nav::-webkit-scrollbar-thumb{background:rgba(10,10,10,.14);border:0}
.sidebar__nav{scrollbar-width:thin;scrollbar-color:rgba(10,10,10,.14) transparent}

/* ── Floating sidebar (SCP style: card, radius, shadow, collapse) ── */
.sidebar{position:fixed;left:16px;top:16px;bottom:16px;width:var(--sbw);background:var(--surface-2);
  border-radius:6px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;
  padding:14px 9px;z-index:50;transition:width .15s}
.sidebar__logo{display:flex;align-items:center;gap:9px;padding:4px 9px;margin-bottom:12px;text-decoration:none}
.sidebar__logo img{height:22px;width:auto;max-width:100%}
.sidebar__nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:hidden}
.snav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;
  font:500 11.5px var(--sans);color:var(--ink-4);cursor:pointer;border:0;background:transparent;
  text-align:left;white-space:nowrap;width:100%;text-decoration:none}
.snav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.snav:hover{background:rgba(10,10,10,0.05);color:var(--ink)}
.snav.on{background:var(--grad-ink);color:#fafaf6}
.sb-collapsed .snav span{display:none}
.sb-collapsed .sidebar{padding:18px 8px}
.sidebar__foot{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--hairline);padding-top:10px}
.sidebar__user{display:flex;align-items:center;gap:9px;padding:7px 10px;font:500 10.5px var(--sans);
  color:var(--ink-4);white-space:nowrap;overflow:hidden}
.sb-collapsed .sidebar__user span{display:none}
.avatar{width:22px;height:22px;border-radius:50%;background:var(--grad-ink);color:#fafaf6;
  display:grid;place-items:center;font-weight:600;font-size:9px;flex:none}

/* Greenhouse tree — the part of the rail that is specific to this page */
.sb-sec{padding:12px 10px 5px;font:500 8px var(--sans);letter-spacing:1.3px;
  text-transform:uppercase;color:var(--ink-mute)}
.sb-collapsed .sb-sec,.sb-collapsed .tree,.sb-collapsed .yearpick,.sb-collapsed .sb-sel{display:none}
.yearpick{margin:0 2px;display:flex;align-items:center;justify-content:space-between;
  padding:7px 11px;border-radius:6px;background:var(--surface);cursor:pointer}
.yearpick b{font:600 11.5px var(--sans);color:var(--ink)}
.yearpick small{font:400 9px var(--sans);color:var(--ink-mute)}
.tree{padding:2px 0 4px}
.tw{display:flex;align-items:center;gap:8px;padding:4px 9px;border-radius:6px;cursor:pointer;
  transition:.15s;white-space:nowrap}
.tw:hover{background:rgba(10,10,10,.045)}
.tw--v{padding-left:22px}
.cb{width:11px;height:11px;flex:none;border-radius:4px;border:1.5px solid #cfccc4;
  display:grid;place-items:center;transition:.15s}
.cb.on{background:var(--signal);border-color:var(--signal)}
.cb.on::after{content:"";width:5px;height:2.5px;border-left:1.6px solid #fff;
  border-bottom:1.6px solid #fff;transform:rotate(-45deg) translate(0,-1px)}
.tw__n{font:500 10.5px var(--sans);color:var(--ink-2);flex:1;overflow:hidden;text-overflow:ellipsis}
.tw--v .tw__n{font-weight:400;color:var(--ink-4)}
.tw__m{font:400 8.5px var(--meta);color:#a8a59d;flex:none;letter-spacing:.15px}
.sb-sel{margin:6px 2px 0;padding:9px 11px;border-radius:6px;background:var(--surface)}
.sb-sel small{display:block;font:500 8px var(--sans);letter-spacing:1.2px;
  text-transform:uppercase;color:var(--ink-mute)}
.sb-sel b{display:block;font:600 14px var(--sans);color:var(--ink);letter-spacing:-.4px;margin-top:2px}
.sb-sel span{display:block;font:400 9px var(--sans);color:var(--ink-mute)}

/* ── Page ─────────────────────────────────────────────────────── */
/* Excel-shaped: the frame is the viewport, the grid owns the scrolling. */
.page{max-width:none;margin:0;padding:18px 18px 0 0;height:100vh;
  display:flex;flex-direction:column;gap:12px;min-height:0}
.page > .card{margin-bottom:0}
#v-grid.on{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
#v-dashboard.on{flex:1;min-height:0;overflow:auto;padding-right:4px}
#gridcard{flex:1;min-height:0;display:flex;flex-direction:column}
#gridcard .scroller{flex:1;min-height:0;overflow:auto}
/* Blank rows below the data keep the sheet ruled to the bottom of the pane. */
.grid tr.fill td{height:24px;background:var(--surface-2)}
.grid tr.fill td.lbl,.grid tr.fill td.grd{background:var(--surface-2)}
#gridcard .scroller > table{background:var(--surface-2)}
/* The frozen column keeps its ruling too, so the eye follows across. */
#gridcard .scroller::after{content:"";position:sticky;left:0;display:block;
  width:var(--froze);height:0;
  box-shadow:0 0 0 100vh var(--surface-2);clip-path:inset(0 -100vw 0 0);
  pointer-events:none;z-index:0}
.pagehead{display:flex;align-items:flex-end;gap:22px;flex:none}
.pagehead__l{flex:1;min-width:0}
.pagehead__eyebrow{font:500 9.5px var(--sans);text-transform:uppercase;letter-spacing:2px;
  color:var(--ink-mute);margin-bottom:5px;display:inline-flex;align-items:center;gap:10px}
.pagehead__eyebrow::before{content:"";width:18px;height:1px;background:var(--ink-3)}
.pagehead__title{font:600 27px/1.05 var(--sans);color:var(--ink);letter-spacing:-.9px;margin:0}
.pagehead__tools{display:flex;gap:10px;align-items:center;flex:none}
.pillgroup{display:inline-flex;background:rgba(10,10,10,0.05);border-radius:6px;padding:4px;gap:2px}
.pillgroup button{border:0;background:transparent;font:500 12px var(--sans);color:var(--ink-4);
  padding:8px 16px;cursor:pointer;border-radius:6px;transition:.2s;white-space:nowrap}
.pillgroup button.on{background:var(--ink);color:#fafaf6;box-shadow:0 2px 8px rgba(10,10,10,.15)}
.winnav{display:inline-flex;align-items:center;gap:2px;background:var(--surface-2);
  border-radius:6px;box-shadow:var(--shadow-card);padding:2px}
.wbtn{border:0;background:transparent;width:26px;height:30px;border-radius:6px;cursor:pointer;
  color:var(--ink-4);font-size:15px;line-height:1;transition:.15s}
.wbtn:hover{background:rgba(10,10,10,.06);color:var(--ink)}
.winnav .datepill{box-shadow:none;padding:8px 10px}
.datepill{display:inline-flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:6px;
  padding:10px 16px;font:500 12px var(--sans);color:var(--ink);box-shadow:var(--shadow-card);
  cursor:pointer;border:0;white-space:nowrap}
.btn{border:0;background:var(--grad-ink);color:#fafaf6;font:600 12.5px var(--sans);
  padding:11px 20px;border-radius:6px;cursor:pointer;box-shadow:0 4px 14px rgba(10,10,10,.2);white-space:nowrap}
.btn--ghost{background:var(--surface-2);color:var(--ink);box-shadow:var(--shadow-card)}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px;
  margin-bottom:14px}
/* Each tile carries its own accent so four numbers do not read as one block. */
.kpi{position:relative;overflow:hidden}
.kpi::before{display:none}
.kpi__trend i{background:var(--acc)!important}
.kspark{position:absolute;right:0;bottom:0;width:56%;height:30px;opacity:.5;
  pointer-events:none}

/* ── Dashboard ──────────────────────────────────────────────────── */
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dcard{background:var(--surface-2);border-radius:6px;box-shadow:var(--shadow-card);
  padding:15px 17px 16px;min-width:0}
.dcard--wide{grid-column:1 / -1}
.dcard__h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dcard__h h4{margin:0;font:600 12.5px var(--sans);color:var(--ink);letter-spacing:-.1px}
.dcard__h .grow{flex:1}
.dcard__n{font:400 10px var(--meta);color:var(--ink-faint)}
.dlg{display:inline-flex;align-items:center;gap:5px;font:500 9.5px var(--sans);
  color:var(--ink-faint)}
.dlg i{width:9px;height:3px;border-radius:2px}
.dchart{position:relative;padding-left:46px}
.dchart svg{width:100%;height:132px;display:block}
.dgl{stroke:#efede8;stroke-width:1;vector-effect:non-scaling-stroke}
.dchart__y{position:absolute;left:0;top:0;width:42px;height:132px}
.dchart__y span{position:absolute;right:0;transform:translateY(-50%);
  font:400 9px var(--grid);color:#bfbcb3;font-variant-numeric:tabular-nums}
.dchart__x{display:flex;margin-top:5px}
.dchart__x span{flex:1;text-align:center;font:500 9px var(--grid);color:var(--ink-faint)}
.dchart__x span.on{color:var(--rose-600);font-weight:700}
.dchart__x span.pk{color:var(--warn);font-weight:600}
.dbar{display:flex;height:11px;border-radius:6px;overflow:hidden;margin-bottom:12px;gap:1px}
.dbar i{min-width:2px}
.dlist{display:flex;flex-direction:column}
.drow{display:flex;align-items:center;gap:9px;padding:5.5px 0;
  border-bottom:1px solid rgba(10,10,10,.04)}
.drow:last-child{border-bottom:0}
.drow i{width:8px;height:8px;border-radius:2px;flex:none}
.drow b{font:500 11px var(--grid);color:var(--ink-1);width:96px;flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow span{flex:1;font:400 9.5px var(--meta);color:var(--ink-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow u{text-decoration:none;font:600 10.5px var(--grid);color:var(--ink-4);
  width:32px;text-align:right;flex:none}
.drow em{font-style:normal;font:600 11px var(--grid);color:var(--ink);width:56px;
  text-align:right;flex:none;font-variant-numeric:tabular-nums}
.dhouses{display:flex;flex-direction:column;gap:1px}
.dh{display:flex;align-items:center;gap:10px;padding:4px 0}
.dh__n{width:62px;flex:none;font:500 11px var(--grid);color:var(--ink-1)}
.dh__t{display:flex;height:13px;border-radius:3px;overflow:hidden;gap:1px;min-width:3px}
.dh__t i{min-width:2px}
.dh__v{margin-left:auto;font:600 11px var(--grid);color:var(--ink);
  font-variant-numeric:tabular-nums;flex:none}
.dh__m{width:56px;text-align:right;flex:none;font:400 9.5px var(--meta);color:var(--ink-faint)}
.dgrade{display:flex;flex-direction:column;gap:5px}
.dg{display:flex;align-items:center;gap:9px}
.dg__l{width:44px;flex:none;font:500 10.5px var(--grid);color:var(--ink-2)}
.dg__b{flex:1;height:9px;border-radius:5px;background:var(--bg);overflow:hidden}
.dg__b i{display:block;height:100%;border-radius:5px;
  background:linear-gradient(90deg,#3a6ea8,#2f8f8a)}
.dg__p{width:34px;text-align:right;flex:none;font:600 10.5px var(--grid);color:var(--ink-3)}
@media (max-width:1180px){.dgrid{grid-template-columns:1fr}}
.kpi{background:var(--surface-2);border-radius:6px;padding:24px 26px;box-shadow:var(--shadow-card);
  transition:all .25s;cursor:pointer}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.kpi__label{font:500 11px var(--sans);text-transform:uppercase;letter-spacing:1.8px;
  color:var(--ink-mute);margin-bottom:12px}
.kpi__value{font:600 38px/1 var(--sans);color:var(--ink);letter-spacing:-1.3px;font-feature-settings:"tnum"}
.kpi__value i{font:400 13px var(--sans);color:var(--ink-mute);font-style:normal;margin-left:5px}
.kpi__trend{margin-top:14px;display:inline-flex;align-items:center;gap:7px;font:500 11.5px var(--sans);
  padding:5px 12px;border-radius:6px;background:rgba(10,10,10,0.035);color:var(--ink-4)}
.kpi__trend i{width:6px;height:6px;border-radius:99px;flex:none}

.card{background:var(--surface-2);border-radius:6px;box-shadow:var(--shadow-card);
  margin-bottom:18px;overflow:hidden}
/* The ribbon's tooltips must escape their card, so this one does not clip. */
#toolcard{overflow:visible;position:relative;z-index:20}
.card__head{display:flex;align-items:center;gap:11px;padding:13px 22px 10px;flex:none}
body.focus .pagehead,body.focus .pagefoot{display:none}
body.focus .page{padding-top:12px}
.card__head h3{margin:0;font:600 14px var(--sans);color:var(--ink);letter-spacing:-.25px}
.card__head .crumb{font:500 11px var(--sans);color:var(--ink-faint);padding-left:11px;
  margin-left:2px;border-left:1px solid var(--hairline)}
.card__head .sp{flex:1}
.legend{display:flex;gap:16px}
.legend{display:inline-flex;align-items:center;gap:13px;margin-right:6px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--ink-faint)}
.legend i{width:15px;height:3px;border-radius:2px}
.note{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;border-radius:6px;
  background:var(--bg);font:500 11.5px var(--sans);color:var(--ink-4)}
.note i{width:6px;height:6px;border-radius:99px;flex:none}

/* ── Toolbar ──────────────────────────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:0;padding:7px 16px;flex-wrap:wrap;overflow:visible}
.tgrp{display:flex;align-items:center;gap:1px;padding:0 7px;height:26px;
  border-right:1px solid var(--hairline)}
.tgrp:last-of-type{border-right:0}
.tgrp__row{display:flex;align-items:center;gap:1px}
/* Inline, not stacked — the toolbar keeps its height and gains its labels. */
.tgrp__lbl{order:-1;font:500 8.5px var(--meta);letter-spacing:.5px;text-transform:uppercase;
  color:#c2bfb6;margin-right:6px;white-space:nowrap;user-select:none}
.tbtn{border:0;background:transparent;border-radius:6px;width:26px;height:26px;cursor:pointer;
  color:var(--ink-4);display:inline-flex;align-items:center;justify-content:center;
  line-height:0;transition:.14s;position:relative;padding:0}
.tbtn svg{display:block}
.tbtn:hover{background:rgba(10,10,10,.07);color:var(--ink)}
.tbtn.on{background:var(--grad-ink);color:#fafaf6}
.tbtn:disabled{opacity:.3;cursor:default}
.tbtn:disabled:hover{background:transparent}
.tbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;flex:none}
.tbtn b{font:600 10px var(--sans)}
/* Tooltip — icon-only needs a name on hover */
.tbtn::after{content:attr(data-tip);position:absolute;top:calc(100% + 7px);left:50%;
  transform:translateX(-50%);background:var(--ink);color:#fafaf6;font:500 10.5px var(--sans);
  padding:6px 10px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;
  transition:opacity .14s .25s;z-index:200;box-shadow:0 6px 18px -6px rgba(10,10,10,.5)}
.tbtn::before{content:"";position:absolute;top:calc(100% + 2px);left:50%;transform:translateX(-50%);
  border:5px solid transparent;border-bottom-color:var(--ink);opacity:0;pointer-events:none;
  transition:opacity .14s .25s;z-index:200}
.tbtn:hover::before{opacity:1}
.tbtn:hover::after{opacity:1}
.tbtn:disabled::after{display:none}
.tsep{width:1px;height:20px;background:var(--hairline);margin:0 4px}
.tsearch{display:inline-flex;align-items:center;gap:7px;background:var(--surface);
  border:1px solid var(--hairline);border-radius:6px;padding:0 10px;height:26px;min-width:150px}
.tsearch input{border:0;background:transparent;outline:none;font:500 11px var(--sans);
  color:var(--ink);width:100%}
.tsearch svg{width:12px;height:12px;stroke:var(--ink-mute);fill:none;stroke-width:2;flex:none}
.tcount{font:500 10.5px var(--sans);color:var(--ink-mute);margin-left:auto;white-space:nowrap}

/* Grid density */
.grid.d-compact tr.g td,.grid.d-compact tr.ref td,.grid.d-compact tr.sum td{height:24px}
.grid.d-compact .c{font-size:10.5px}
.grid.d-roomy tr.g td{height:38px}

/* ── Grid ─────────────────────────────────────────────────────── */
.scroller{overflow-x:auto}
.grid{border-collapse:separate;border-spacing:0;width:max-content;
  font-variant-numeric:tabular-nums}
.grid th,.grid td{padding:0;margin:0}
.grid .idx{width:var(--idx);min-width:var(--idx);position:sticky;left:0;z-index:3;
  background:var(--surface-2);text-align:right;padding-right:6px;
  font:400 9.5px var(--grid);color:#c4c1b8;font-variant-numeric:tabular-nums;
  user-select:none}
.grid .gh{width:var(--gh);min-width:var(--gh);position:sticky;left:var(--idx);z-index:3;
  background:var(--surface-2);padding:0 6px 0 13px;text-align:left}
.grid .lbl{width:var(--lbl);min-width:var(--lbl);position:sticky;
  left:calc(var(--idx) + var(--gh));z-index:3;
  background:var(--surface-2);padding:0 8px;text-align:left}
.grid .spk{width:var(--spark);min-width:var(--spark);position:sticky;
  left:calc(var(--idx) + var(--gh) + var(--lbl));z-index:3;
  background:var(--surface-2);padding:0 5px}
.grid .spk svg{display:block;width:100%;height:26px;overflow:visible;cursor:pointer}
.grid tr.main .spk:hover svg path{stroke-width:1.9}
/* Drag handle on the right edge of every header cell. */
.grid thead th{position:relative}
.rsz{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;
  z-index:6;background:transparent}
.rsz:hover{background:linear-gradient(to right,transparent 2px,
  var(--s-forecast) 2px,var(--s-forecast) 4px,transparent 4px)}
.grid .grd{width:var(--grade);min-width:var(--grade);position:sticky;
  left:calc(var(--idx) + var(--gh) + var(--lbl) + var(--spark));z-index:3;
  background:var(--surface-2);font:400 10px var(--grid);color:var(--ink-mute);text-align:left;padding-left:6px}
.grid .c{width:var(--cell);min-width:var(--cell);text-align:right;padding-right:7px;
  font:400 11px var(--grid);font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;letter-spacing:0;color:var(--ink-2)}
/* Every cell bounded on all four sides — the lattice Excel is built on. */
.grid td,.grid th{box-sizing:border-box;
  border-right:1px solid #f1efeb;border-bottom:1px solid #f1efeb}
.grid td:last-child,.grid th:last-child{border-right:0}
.grid thead th{position:sticky;top:0;z-index:4;height:26px;
  font:900 10px var(--meta);color:var(--ink-3);letter-spacing:.1px;
  background:var(--surface-2);border-bottom:1px solid #e5e1d9;border-right:0}
.grid thead th.idx,.grid thead th.gh,.grid thead th.lbl,.grid thead th.spk,
.grid thead th.grd{z-index:5;background:var(--surface-2)}
.grid thead th.gh,.grid thead th.lbl,.grid thead th.spk{
  font:500 10.5px var(--grid);letter-spacing:0;color:var(--ink-faint)}
.grid thead th.c{text-align:right;padding-right:7px}
/* Week number leads; the year rides along at half size so it never competes. */
.grid thead th .yr{font-style:normal;font-size:7.5px;font-weight:700;
  color:var(--ink-mute);margin-left:2px;vertical-align:top;letter-spacing:0}
.grid thead th.now .yr{color:var(--rose-600);opacity:.75}
/* The week's first day, under the number. Kept to "24 Aug" rather than the full
   span because .grid is width:max-content — a wide header widens the column. */
.grid thead th .dt{display:block;font-style:normal;font-size:7px;font-weight:500;
  color:var(--ink-faint);letter-spacing:0;white-space:nowrap;margin-top:1px}
.grid thead th.now .dt{color:var(--rose-600);opacity:.7}
/* No grade rows on screen means no grade column taking up a slot. */
.grid.nogrd .grd{width:0;min-width:0;padding:0;border-right:0;overflow:hidden}
.grid thead th.now{color:var(--rose-600);font-weight:600}
tr.grp td{height:34px;background:var(--surface);border-top:1px solid var(--hairline);
  border-bottom:1px solid var(--hairline)}
tr.grp .lbl,tr.grp .grd{background:var(--surface)}
tr.grp b{font:600 12px var(--sans);color:var(--ink)}
tr.grp em{font:400 10px var(--mono);color:var(--ink-faint);font-style:normal;margin-left:8px}
tr.g td{height:30px;border-bottom:1px solid rgba(10,10,10,.035)}
tr.sum td{height:28px;background:#fbfaf7;border-bottom:1px solid var(--hairline)}
tr.sum .lbl,tr.sum .grd{background:#fbfaf7}
tr.sum .grd{color:var(--ink);font-weight:600}
tr.sum.daily .grd{color:var(--ink-mute);font-weight:500}
tr.ref td{height:28px;border-bottom:1px solid rgba(10,10,10,.035)}
tr.ref .lbl{font:500 11.5px var(--sans)}
tr.ref .lbl em{font:400 10px var(--sans);color:var(--ink-faint);font-style:normal;margin-left:7px}
.grid td.past{background:#faf9f6;color:var(--ink-faint)}
.grid td.now{background:rgba(249,228,230,.4)}
.grid td.edit{color:var(--s-forecast);font-weight:500;cursor:cell}
.grid .grid td.edit:hover{background:rgba(42,111,143,.07);box-shadow:inset 0 0 0 1.5px var(--s-forecast)}
.grid td.rev{background:#fdfaf4;color:var(--s-revised);font-weight:500}
.grid td.act{color:var(--s-actual);font-weight:500}
/* A revised cell is a human judgement, not a model output — say so. */
.grid td.revised{color:var(--s-revised);font-weight:600}
.grid td.revised::after{content:"";position:absolute;top:2px;right:2px;width:0;height:0;
  border-top:4px solid var(--s-revised);border-left:4px solid transparent}
.grid td.revised{position:relative}
.grid td.bud{color:var(--ink-mute)}
.grid td.nil{color:#d5d2c9}
.grid td.pos{color:var(--pos);font-weight:500}
.grid td.neg{color:var(--neg);font-weight:500}
/* Locked periods get a hatch so "you can't type here" is visible, not implied */
.grid .tot{background:var(--surface);font-weight:600;color:var(--ink);
  border-left:1px solid var(--hairline);min-width:96px;width:96px}
thead th.tot{background:var(--surface);color:var(--ink-3);font-weight:600}
/* The default row. Taller, quieter, and the only thing you see until you
   ask for detail. Variance tints it once a period has actually happened. */
.grid tr.main td{height:24px}
.grid tr.main .gh,.grid tr.main .lbl{font:500 11px var(--grid);color:#0a0a0a;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid tr.main .gh{font-weight:600}
.grid tr.main .tw-caret svg{width:9px;height:9px;display:block}
.grid tr.main .tw-caret{display:inline-flex;align-items:center;width:11px;font-size:8px;color:var(--ink-faint);
  transition:transform .15s}
.grid tr.main .lbl s{display:block;font:400 8.5px var(--meta);color:#adaaa2;
  text-decoration:none;margin-top:-1px;line-height:1.3;letter-spacing:.15px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:calc(var(--lbl) - 34px)}
.grid tr.main .lbl s i{font-style:normal;color:#c9c6bd;padding:0 4px}
.grid tr.main .lbl{white-space:nowrap}
.grid tr.main .c{font:500 11px var(--grid);letter-spacing:0;line-height:1.1;padding:0 7px 0 0}
.grid tr.main .c b{font-weight:500}
/* Variance sits beside the number, not under it — keeps rows at 24px. */
.grid tr.main .c u{text-decoration:none;font:400 8.5px var(--grid);
  letter-spacing:0;opacity:.85;padding-left:5px}
/* Faint variance bands — readable at a glance, never shouty */
.grid td.v-up{background:rgba(63,143,79,.10)}   .grid td.v-up u{color:#2f7a3d}
.grid td.v-dn{background:rgba(196,48,43,.09)}   .grid td.v-dn u{color:#b03b36}
.grid td.v-ok{background:rgba(10,10,10,.035)}   .grid td.v-ok u{color:var(--ink-mute)}
/* Current period: a solid marker, not just a tint */
.grid td.nowcol{box-shadow:inset 1px 0 0 rgba(193,60,74,.28)}
.grid tr.main td.nowcol{background:rgba(193,60,74,.045)}
.grid thead th.now{box-shadow:inset 0 -2px 0 var(--signal)}
.grid td.editing{box-shadow:inset 0 0 0 2px var(--signal);
  background:var(--rose-100) !important;position:relative;z-index:2}
.grid td.locked{background-image:repeating-linear-gradient(135deg,transparent,transparent 5px,
  rgba(10,10,10,.014) 5px,rgba(10,10,10,.014) 10px)}
.grid td.sel{box-shadow:inset 0 0 0 1.5px var(--ink-3);background:rgba(10,10,10,.04)}
.grid td.anchor{box-shadow:inset 0 0 0 2px var(--ink)}
tr.hidden{display:none}
tr.grp .lbl{cursor:pointer;user-select:none}
tr.grp .tw-caret{display:inline-block;width:12px;font-size:9px;color:var(--ink-mute);
  transition:transform .15s;margin-right:2px}
tr.grp.closed .tw-caret{transform:rotate(-90deg)}
tr.grp .rowsum{font:500 10px var(--mono);color:var(--ink-4);float:right}
.cellin{width:100%;height:100%;border:0;outline:0;background:#fff;text-align:right;
  padding-right:14px;font:500 11.5px var(--mono);color:var(--s-forecast);
  box-shadow:inset 0 0 0 2px var(--s-forecast)}

/* ── Climate ──────────────────────────────────────────────────── */
.clim{display:flex;width:max-content;min-width:100%}
.clim__pad{width:var(--froze);min-width:var(--froze);
  position:sticky;left:0;background:var(--surface-2);z-index:2}
.cw{width:var(--cell);min-width:var(--cell);padding:9px 0 12px;text-align:center}
.cw.past{background:#faf9f6}
.cw.now{background:var(--rose-100)}
.cw b{display:block;font:500 9px var(--sans);letter-spacing:.8px;color:var(--ink-faint)}
.cw.now b{color:var(--rose-600)}
.cw .ico{font-size:15px;line-height:1.5}
.cw .tmp{font:500 12px var(--mono);color:var(--ink)}
.cw .tmp s{font:400 10px var(--mono);color:var(--ink-mute);text-decoration:none;margin-left:5px}
.cw .bar{width:46px;height:4px;border-radius:2px;background:#edece7;margin:5px auto 0;overflow:hidden}
.cw .bar i{display:block;height:100%;border-radius:2px}

/* ── Cell form ────────────────────────────────────────────────── */
.pop{position:fixed;z-index:300;width:264px;background:var(--surface-2);border-radius:6px;
  box-shadow:var(--shadow-pop);padding:15px 17px 13px}
.pop h4{margin:0 0 2px;font:600 13px var(--sans);color:var(--ink);display:flex;
  align-items:baseline;gap:8px;white-space:nowrap}
.pop h4 small{overflow:hidden;text-overflow:ellipsis}
.pop h4 small{font:400 11px var(--sans);color:var(--ink-mute)}
/* ── Chart modal: the sparkline, opened up ───────────────────────── */
.cwrap{position:fixed;inset:0;z-index:400;display:flex;align-items:center;
  justify-content:center;background:rgba(24,23,20,.30);backdrop-filter:blur(3px)}
.chart{width:min(980px,94vw);height:min(600px,90vh);background:var(--surface-2);
  border-radius:6px;box-shadow:0 2px 4px rgba(10,10,10,.05),0 24px 64px rgba(10,10,10,.18);
  display:flex;flex-direction:column;overflow:hidden}
/* No rule under the header — spacing separates it, the way a modern panel does. */
.chart__hd{display:flex;align-items:flex-start;gap:14px;padding:18px 20px 6px}
.chart__hd h4{margin:0;font:600 16px var(--sans);color:var(--ink);letter-spacing:-.2px}
.chart__hd .csub{margin-top:2px;font:400 11px var(--sans);color:var(--ink-faint)}
.chart__tools{margin-left:auto;display:flex;align-items:center;gap:8px}
/* Segmented control: a light track with the active chip lifted out of it. */
.ctool{height:26px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;
  border:0;border-radius:5px;background:transparent;cursor:pointer;
  font:500 11px var(--sans);color:var(--ink-faint);transition:background .12s,color .12s}
.ctool:hover{color:var(--ink-2)}
.ctool.on{background:var(--surface-2);color:var(--ink);
  box-shadow:0 1px 2px rgba(10,10,10,.10)}
.ctool i{width:14px;height:3px;border-radius:2px;flex:none;opacity:.35}
.ctool.on i{opacity:1}
.ctool.ico{padding:0;width:28px;height:28px;justify-content:center;border-radius:6px}
.ctool.ico:hover{background:var(--bg)}
.ctool.ico.on{background:var(--ink);color:#fff;box-shadow:none}
.ctool svg{width:15px;height:15px;stroke:currentColor;fill:none;
  stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cdiv{display:none}
.chart__bd{flex:1;min-height:0;display:flex;gap:4px;padding:0 8px 8px 4px}
.chart__main{flex:1;min-width:0;display:flex;flex-direction:column}
.chart__plot{flex:1;min-height:0;position:relative;padding:10px 6px 4px 6px}
.cleg{display:flex;flex-wrap:wrap;gap:2px;padding:2px 10px 6px}
.cleg button{display:flex;align-items:center;gap:8px;border:0;background:transparent;
  cursor:pointer;padding:5px 10px;border-radius:6px;font:500 11px var(--sans);
  color:var(--ink-faint);transition:background .12s,color .12s}
.cleg button:hover{background:var(--bg)}
.cleg button.on{color:var(--ink-2)}
.cleg i{width:12px;height:12px;border-radius:3px;flex:none;opacity:.22}
.cleg button.on i{opacity:1}
.cleg b{font:600 11.5px var(--grid);color:var(--ink);font-variant-numeric:tabular-nums}
.cleg button:not(.on) b{color:var(--ink-faint);font-weight:500}
.chart__plot svg{width:100%;height:100%;display:block;overflow:visible}
.chart__plot .gl{stroke:#f0eee9;stroke-width:1}
.chart__plot .axt{font:500 9px var(--grid);fill:#b5b2a9}
.chart__plot .future{fill:rgba(10,10,10,.022)}
.chart__plot .nowline{stroke:var(--signal);stroke-width:1;opacity:.35}
.chart__plot .nowtag{font:600 8.5px var(--grid);fill:var(--rose-600);opacity:.8}
.chart__plot .hover{stroke:var(--ink-4);stroke-width:1;opacity:.35}
.chart__plot .dot{stroke:var(--surface-2);stroke-width:1.5}
.chart__tip{position:absolute;pointer-events:none;background:rgba(20,19,17,.94);
  color:#fff;border-radius:6px;padding:8px 10px;font:400 10.5px var(--grid);
  white-space:nowrap;opacity:0;transition:opacity .1s;z-index:2;line-height:1.65;
  box-shadow:0 6px 20px rgba(10,10,10,.28)}
.chart__tip.on{opacity:1}
.chart__tip b{font-weight:600;font-size:11px;display:block;margin-bottom:3px;
  color:rgba(255,255,255,.62);letter-spacing:.3px}
.chart__tip s{text-decoration:none;display:inline-block;width:10px;height:2.5px;
  border-radius:2px;margin-right:7px;vertical-align:middle}
.chart__tip u{text-decoration:none;float:right;padding-left:18px;font-weight:600}
/* Side rail: whitespace instead of rules, headline figures instead of a list. */
.chart__side{width:252px;flex:none;padding:10px 16px 16px;overflow:auto}
.chart__side h5{margin:0 0 8px;font:900 9px var(--meta);letter-spacing:.6px;
  text-transform:uppercase;color:#bfbcb3}
.cgrp{margin-bottom:20px}
.cbig{display:flex;align-items:center;gap:9px;padding:5px 0}
.cbig em{width:3px;height:26px;border-radius:2px;flex:none;font-style:normal}
.cbig div{min-width:0}
.cbig span{display:block;font:500 9.5px var(--sans);color:var(--ink-faint);
  letter-spacing:.2px}
.cbig b{display:block;font:600 16px var(--grid);color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.2}
.cvar{display:flex;align-items:baseline;gap:7px;padding:4px 0}
.cvar b{font:600 19px var(--grid);letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.cvar b.up{color:var(--s-actual)} .cvar b.dn{color:var(--rose-600)}
.cvar span{font:400 10px var(--sans);color:var(--ink-faint)}
.cstat{display:flex;align-items:baseline;justify-content:space-between;padding:3.5px 0}
.cstat span{font:400 10.5px var(--sans);color:var(--ink-faint)}
.cstat b{font:500 11px var(--grid);color:var(--ink-2);font-variant-numeric:tabular-nums}
.phist{margin:9px 0 2px;border-top:1px solid var(--hairline);padding-top:8px}
.hbtn{display:flex;align-items:center;gap:7px;width:100%;padding:6px 9px;border:0;
  border-radius:6px;background:var(--bg);cursor:pointer;font:500 11px var(--sans);
  color:var(--ink-2);text-align:left}
.hbtn:hover{background:#efede7;color:var(--ink)}
.hbtn svg{width:13px;height:13px;flex:none;color:var(--s-revised)}
.hbtn em{font-style:normal;font:400 10px var(--meta);color:var(--ink-faint)}
.hbtn__go{margin-left:auto;color:var(--ink-faint);font-size:14px;line-height:1}
.hnone{font:400 10px var(--sans);color:var(--ink-faint);padding:2px 0}

/* ── History panel ──────────────────────────────────────────────── */
.hwrap{z-index:500}
.hpanel{width:min(760px,94vw);max-height:84vh;background:var(--surface-2);
  border-radius:6px;box-shadow:0 2px 4px rgba(10,10,10,.05),0 24px 64px rgba(10,10,10,.18);
  display:flex;flex-direction:column;overflow:hidden}
.hpanel__hd{display:flex;align-items:flex-start;gap:12px;padding:16px 18px 10px}
.hpanel__hd h4{margin:0;font:600 15px var(--sans);color:var(--ink);letter-spacing:-.2px}
.hpanel__hd .csub{margin-top:2px;font:400 11px var(--sans);color:var(--ink-faint)}
.hpanel__hd .ctool{margin-left:auto}
.hstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);
  margin:0 18px;border-radius:6px;overflow:hidden}
.hstat{background:var(--surface-2);padding:9px 11px}
.hstat s{display:block;text-decoration:none;font:500 8.5px var(--meta);letter-spacing:.5px;
  text-transform:uppercase;color:#c2bfb6}
.hstat b{font:600 17px var(--grid);color:var(--ink);font-variant-numeric:tabular-nums;
  letter-spacing:-.4px}
.hstat b.up{color:var(--s-actual)} .hstat b.dn{color:var(--rose-600)}
.hstat i{display:block;font-style:normal;font:400 9.5px var(--meta);color:var(--ink-faint);
  margin-top:1px}
.hbody{display:flex;gap:22px;padding:16px 18px 18px;overflow:auto}
.hcol{flex:1;min-width:0}
.hcol h5{margin:0 0 8px;font:900 8.5px var(--meta);letter-spacing:.6px;
  text-transform:uppercase;color:#c2bfb6}
.hrev{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid rgba(10,10,10,.05)}
.hrev:last-child{border-bottom:0}
.hrev__r{flex:none;width:20px;height:18px;border-radius:4px;background:var(--bg);
  color:var(--ink-mute);font:700 9px var(--grid);display:flex;align-items:center;
  justify-content:center}
.hrev.on .hrev__r{background:var(--s-revised);color:#fff}
.hrev__b{flex:1;min-width:0}
.hrev__b b{font:600 13px var(--grid);color:var(--ink);font-variant-numeric:tabular-nums}
.hrev__d{font:500 10px var(--grid);color:var(--ink-faint);margin-left:6px}
.hrev__d.up{color:var(--s-actual)} .hrev__d.dn{color:var(--rose-600)}
.hrev__m{display:block;font:400 9.5px var(--meta);color:var(--ink-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrev__m u{text-decoration:none;display:inline-block;padding:0 5px;border-radius:3px;
  background:var(--bg);color:var(--ink-4);font-weight:500;margin-right:5px}
.hrev__s{flex:none;font:500 9px var(--meta);color:var(--ink-faint);align-self:flex-start}
.hrev.on .hrev__s{color:var(--s-revised)}
.hed{display:flex;align-items:baseline;gap:8px;padding:6px 0;
  border-bottom:1px solid rgba(10,10,10,.04)}
.hed:last-child{border-bottom:0}
.hed__v{font:400 11px var(--grid);color:var(--ink-4);font-variant-numeric:tabular-nums}
.hed__v b{font-weight:600;color:var(--ink-1)}
.hed__d{font:500 9.5px var(--grid)}
.hed__d.up{color:var(--s-actual)} .hed__d.dn{color:var(--rose-600)}
.hed__m{margin-left:auto;font:400 9.5px var(--meta);color:var(--ink-faint)}
.preason{margin:8px 0 2px}
.preason select{width:100%;height:26px;border:1px solid var(--hairline);border-radius:6px;
  background:var(--surface);font:400 11px var(--sans);color:var(--ink-2);padding:0 6px;
  outline:none;cursor:pointer}
.rangepop .rrow{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.rangepop .rrow label{width:36px;font:500 10.5px var(--sans);color:var(--ink-mute)}
.rangepop .rrow select,.rangepop .rrow input{height:26px;border:1px solid var(--hairline);
  border-radius:6px;background:var(--surface);font:500 11.5px var(--grid);color:var(--ink-1);
  padding:0 6px;outline:none}
.rangepop .rrow select{flex:1}
.rangepop .rrow input{width:52px;text-align:right}
.rangepop .rrow .rw{font:500 10px var(--sans);color:var(--ink-faint)}
.datepill .yr{font-style:normal;font-size:8px;color:var(--ink-mute);
  margin-left:1px;vertical-align:top}
.datepill em{font-style:normal;color:var(--ink-faint);margin-left:4px;
  display:inline-flex;vertical-align:middle}
.chev{width:11px;height:11px;display:inline-block;vertical-align:-1px;opacity:.55}
.pop .psub{font-size:10px;color:var(--ink-faint);margin-bottom:10px}

/* layers menu — reuses .pop for the shell and .cb for the ticks */
/* .pop is z-300, which is fine over a table but sits UNDER leaflet's own panes
   (z-400) — the menu would open behind the map tiles. The map's floating panels
   use z-600, the tooltip 900, the boot overlay 1000, so a dropdown belongs at 700. */
.lay{width:210px;padding:13px 12px 9px;z-index:700}
.lay__g{font:600 8.5px var(--meta);letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-faint);margin:10px 0 3px;padding:0 5px}
.lay__g:first-of-type{margin-top:2px}
.lay__r{display:flex;align-items:center;gap:8px;width:100%;padding:4px 5px;border:0;
  background:none;border-radius:4px;cursor:pointer;text-align:left;transition:.15s}
.lay__r:hover{background:rgba(10,10,10,.05)}
.lay__r span{font:500 10.5px var(--sans);color:var(--ink-2);flex:1}
.lay__r em{font:400 8.5px var(--meta);font-style:normal;color:var(--ink-faint)}
.lay__r[data-base] .cb{border-radius:50%}

/* live-operations layer: same op chips as the label, centred like .pinwrap and
   lifted clear of it so both can be on at once */
#v-map .opslayer{background:transparent;border:0}
#v-map .opspin{display:inline-flex;gap:2px;padding:3px 4px;border-radius:5px;
  background:var(--surface-2);box-shadow:var(--shadow-float);
  transform:translate(-50%,calc(-50% - 26px))}
#v-map .opspin.live .pin__op:first-child{animation:oppulse 1.9s ease-in-out infinite}
.sugg{background:var(--bg);border-radius:6px;padding:10px 12px;margin-bottom:11px}
.sugg .r{display:flex;align-items:baseline;justify-content:space-between}
.sugg b{font:600 19px var(--sans);font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.5px}
.sugg .tag{font:500 10px var(--sans);color:var(--s-revised);background:rgba(217,150,46,.14);
  padding:3px 9px;border-radius:6px}
.sugg .why{margin-top:6px;font-size:10px;line-height:1.45;color:var(--ink-4)}
.sugg .why u{text-decoration:none;color:var(--ink);font-weight:500}
.pin{display:flex;gap:7px;align-items:center;margin-bottom:9px}
.pin input{flex:1;min-width:0;border:1px solid #e2e0d9;border-radius:6px;padding:8px 11px;
  font:500 13px var(--sans);font-variant-numeric:tabular-nums;color:var(--ink);outline:none;background:var(--surface-2)}
.pin input:focus{border-color:var(--s-forecast);box-shadow:0 0 0 3px rgba(42,111,143,.12)}
.pin .u{font:400 11px var(--sans);color:var(--ink-mute)}
.pr{display:flex;gap:4px;flex-wrap:nowrap;margin-bottom:10px}
.pr button{flex:1;border:1px solid #eae8e2;background:var(--surface-2);border-radius:6px;padding:4px 6px;
  font:500 9.5px var(--sans);white-space:nowrap;color:var(--ink-4);cursor:pointer;transition:.15s}
.pr button:hover{border-color:var(--ink-3);color:var(--ink)}
.pr button.on{background:var(--ink);border-color:var(--ink);color:#fafaf6}
.pf{display:flex;gap:8px}
.pf button{flex:1;border:0;border-radius:6px;padding:7px 10px;font:500 11px var(--sans);
  cursor:pointer;transition:.18s;white-space:nowrap;line-height:1.4}
.pf .save{background:var(--grad-ink);color:#fafaf6}
.pf .cancel{background:rgba(10,10,10,.05);color:var(--ink-4)}
.prev{margin-top:9px;padding-top:9px;border-top:1px solid var(--hairline);font-size:10px;
  color:var(--ink-faint);display:flex;justify-content:space-between}
.prev a{color:var(--s-forecast);text-decoration:none;font-weight:500;cursor:pointer}

.empty{padding:64px 28px;text-align:center;color:var(--ink-mute)}
.empty b{display:block;font:600 15px var(--sans);color:var(--ink-3);margin-bottom:6px}
.totals{display:flex;align-items:center;gap:20px;padding:11px 24px;
  border-top:1px solid var(--hairline);background:var(--surface);
  font:400 10.5px var(--meta);color:#a8a59d;letter-spacing:.15px}
.totals b{color:var(--ink);font-weight:500;font-size:12px}
.totals .grow{flex:1}
.totals .pillv{padding:3px 8px;border-radius:4px;font-weight:500}
.totals .pillv.up{background:rgba(63,143,79,.13);color:#2f7a3d}
.totals .pillv.dn{background:rgba(196,48,43,.11);color:#b03b36}
.totals .pillv.ok{background:rgba(10,10,10,.05);color:var(--ink-4)}
.pagefoot{display:flex;align-items:center;gap:22px;padding:9px 4px;flex:none;margin:0;
  border-top:0;font:400 10.5px var(--meta);color:#a8a59d;
  flex-wrap:wrap;letter-spacing:.15px}
.pagefoot b{color:var(--ink-3);font-weight:500}
.pagefoot .grow{flex:1}
.pagefoot .eff{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:6px;
  background:var(--surface);color:var(--ink-3)}
.pagefoot .eff i{width:6px;height:6px;border-radius:99px;flex:none}
.view{display:none}.view.on{display:block}
#v-plan{display:none}
#v-plan.on{flex:1;min-height:0;display:block;overflow:auto;padding-right:4px}
#v-map{display:none}
#v-map.on{flex:1;min-height:0;display:block;position:relative;border-radius:6px;
  overflow:hidden;background:#141618;box-shadow:var(--shadow-card)}
#v-map #map{position:absolute;inset:0;background:#141618}
/* Floating glass panels over the map */
#v-map .pane{position:absolute;z-index:600;background:var(--surface-2);
  border-radius:6px;box-shadow:var(--shadow-float)}
#v-map .pane__h{display:flex;align-items:center;gap:8px;padding:11px 13px 7px}
#v-map .pane__h h3{margin:0;font:900 9px var(--meta);letter-spacing:.7px;
  text-transform:uppercase;color:#b4b1a8}
#v-map .pane__h .grow{flex:1}
#v-map .leaflet-container{background:#141618;font-family:var(--sans)}
#v-map .leaflet-tile-pane{filter:saturate(1.15) contrast(1.06) brightness(1.02)}
#v-map .leaflet-control-attribution{font:400 9px var(--grid)!important;
  background:rgba(255,255,255,.62)!important;border-radius:6px 0 0 0;
  padding:1px 6px!important;color:var(--ink-mute)!important}
#v-map .leaflet-control-attribution a{color:var(--ink-4)!important}
/* ── Top bar ─────────────────────────────────────────────────────── */
#v-map #top{left:14px;top:14px;right:14px;display:flex;align-items:center;
  gap:10px;padding:8px 10px;transition:left .18s ease}

#v-map #top h1{margin:0;font:600 15px var(--sans);color:var(--ink);letter-spacing:-.3px;
  white-space:nowrap}
#v-map #top .sub{font:400 10px var(--meta);color:var(--ink-faint);white-space:nowrap;margin-top:-2px}
#v-map .seg{display:flex;gap:2px;background:var(--bg);border-radius:7px;padding:3px;
  box-shadow:inset 0 0 0 1px rgba(10,10,10,.05)}
#v-map .seg::before{content:"Colour by";align-self:center;padding:0 8px 0 4px;
  font:900 8.5px var(--meta);letter-spacing:.6px;text-transform:uppercase;color:#c2bfb6}
#v-map .seg button{height:28px;padding:0 13px;border:0;border-radius:5px;background:transparent;
  cursor:pointer;font:600 11.5px var(--sans);color:var(--ink-mute);white-space:nowrap;
  transition:background .13s,color .13s}
#v-map .seg button:hover{color:var(--ink-1);background:rgba(255,255,255,.6)}
#v-map .seg button.on{background:var(--ink);color:#fff;box-shadow:0 1px 3px rgba(10,10,10,.24)}
#v-map .iconb{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:6px;background:transparent;cursor:pointer;color:var(--ink-mute)}
#v-map .iconb:hover{background:var(--bg);color:var(--ink-2)}
#v-map .iconb.on{background:var(--ink);color:#fff}
#v-map .iconb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
#v-map .kpi{display:flex;align-items:baseline;gap:5px;padding:0 9px}
#v-map .kpi b{font:600 13.5px var(--grid);color:var(--s-forecast);
  font-variant-numeric:tabular-nums;
  letter-spacing:-.3px}
#v-map .kpi span{font:400 9.5px var(--meta);color:var(--ink-faint)}
#v-map .vdiv{width:1px;height:22px;background:var(--hairline)}

/* ── Weather ─────────────────────────────────────────────────────── */
#v-map #wx{right:14px;top:72px;width:262px;padding-bottom:10px}
#v-map .wx__now{display:flex;align-items:flex-start;gap:12px;padding:2px 14px 8px}
#v-map .wx__t{font:600 34px var(--grid);color:var(--ink);letter-spacing:-1.6px;line-height:1}
#v-map .wx__t sup{font-size:15px;font-weight:500;vertical-align:top;letter-spacing:0;top:-.4em}
#v-map .wx__d{flex:1;min-width:0}
#v-map .wx__d b{display:block;font:500 11px var(--sans);color:var(--ink-2)}
#v-map .wx__d span{display:block;font:400 9.5px var(--meta);color:var(--ink-faint)}
#v-map .wx__grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--hairline);
  margin:0 14px;border-radius:6px;overflow:hidden}
#v-map .wxc{background:var(--surface-2);padding:7px 9px}
#v-map .wxc s{display:block;text-decoration:none;font:500 8.5px var(--meta);letter-spacing:.4px;
  text-transform:uppercase;color:#c2bfb6}
#v-map .wxc b{font:600 13px var(--grid);color:var(--ink-1);font-variant-numeric:tabular-nums}
#v-map .wxc b em{font-style:normal;font-size:9px;font-weight:400;color:var(--ink-faint);
  margin-left:2px}
#v-map .compass{width:34px;height:34px;flex:none}
#v-map .compass circle{fill:none;stroke:var(--hairline);stroke-width:1.5}
#v-map .compass path{fill:var(--s-forecast,#2a6f8f)}
#v-map .compass text{font:600 6px var(--grid);fill:#c2bfb6}
#v-map .wx__days{display:flex;gap:2px;padding:9px 12px 0}
#v-map .wxd{flex:1;text-align:center;border-radius:6px;padding:5px 1px}
#v-map .wxd:hover{background:var(--bg)}
#v-map .wxd s{display:block;text-decoration:none;font:500 8.5px var(--meta);color:var(--ink-faint)}
#v-map .wxd u{display:block;text-decoration:none;margin:4px auto 3px;width:4px;
  border-radius:2px;background:linear-gradient(to top,#e8e5dd,#d9962e)}
#v-map .wxd b{display:block;font:600 9.5px var(--grid);color:var(--ink-2);
  font-variant-numeric:tabular-nums}
#v-map .wxd i{display:block;font-style:normal;font:400 8px var(--grid);color:#bdc7d4}

/* ── Surge board ─────────────────────────────────────────────────── */
#v-map #surge{right:14px;width:262px;padding-bottom:8px;max-height:38vh;display:flex;
  flex-direction:column}
#v-map .surge__l{overflow:auto;padding:0 8px 4px}
#v-map .surge__l::-webkit-scrollbar{width:4px}
#v-map .surge__l::-webkit-scrollbar-thumb{background:rgba(10,10,10,.14);border-radius:3px}
#v-map .sg{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:6px;cursor:pointer}
#v-map .sg:hover{background:var(--bg)}
#v-map .sg__r{width:17px;height:17px;flex:none;border-radius:5px;display:flex;
  align-items:center;justify-content:center;font:700 9px var(--grid);
  background:var(--bg);color:var(--ink-mute)}
#v-map .sg:nth-child(1) .sg__r{background:var(--neg);color:#fff}
#v-map .sg:nth-child(2) .sg__r{background:#d9962e;color:#fff}
#v-map .sg:nth-child(3) .sg__r{background:#e0c9a0;color:#7a5a1e}
#v-map .sg__b{flex:1;min-width:0}
#v-map .sg__b b{display:block;font:500 11px var(--grid);color:var(--ink-1)}
#v-map .sg__b span{display:block;font:400 9px var(--meta);color:var(--ink-faint)}
#v-map .sg__t{display:none}
#v-map .sg__v{font:600 12px var(--grid);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
#v-map .sg__v.up{color:var(--neg)} .sg__v.flat{color:var(--ink-faint)}
#v-map .empty-note{padding:8px 14px 12px;font:400 10.5px var(--sans);color:var(--ink-faint)}

/* ── Detail drawer ───────────────────────────────────────────────── */
#v-map #detail{left:14px;bottom:14px;width:390px;max-height:56vh;
  display:none;flex-direction:column;transition:left .18s ease}

#v-map #detail.on{display:flex}
#v-map .dt__h{padding:13px 15px 9px;display:flex;align-items:flex-start;gap:10px}
#v-map .dt__h h2{margin:0;font:600 16px var(--sans);color:var(--ink);letter-spacing:-.3px}
#v-map .dt__h .sub{font:400 10px var(--meta);color:var(--ink-faint);margin-top:1px}
#v-map .dt__b{overflow:auto;padding:0 15px 14px}
#v-map .dt__b::-webkit-scrollbar{width:4px}
#v-map .dt__b::-webkit-scrollbar-thumb{background:rgba(10,10,10,.14);border-radius:3px}
#v-map .dstats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--hairline);
  border-radius:6px;overflow:hidden;margin-bottom:13px}
#v-map .dstat{background:rgba(255,255,255,.92);padding:7px 9px}
#v-map .dstat s{display:block;text-decoration:none;font:500 8.5px var(--meta);letter-spacing:.4px;
  text-transform:uppercase;color:#c2bfb6}
#v-map .dstat b{font:600 13px var(--grid);color:var(--ink);font-variant-numeric:tabular-nums;
  letter-spacing:-.3px}
#v-map .dsec{font:900 8.5px var(--meta);letter-spacing:.7px;text-transform:uppercase;color:#c2bfb6;
  margin:0 0 7px}
#v-map .pl{display:flex;align-items:center;gap:9px;padding:7px 0;border-bottom:1px solid rgba(10,10,10,.04)}
#v-map .pl:last-child{border-bottom:0}
#v-map .pl i{width:3px;height:30px;border-radius:2px;flex:none}
#v-map .pl__n{flex:1;min-width:0}
#v-map .pl__n b{display:block;font:500 11.5px var(--grid);color:var(--ink-1)}
#v-map .pl__n span{display:block;font:400 9.5px var(--meta);color:var(--ink-faint)}
#v-map .pl__v{text-align:right}
#v-map .pl__v b{display:block;font:600 12px var(--grid);color:var(--ink);
  font-variant-numeric:tabular-nums}
#v-map .pl__v span{display:block;font:400 9px var(--meta);color:var(--ink-faint)}
/* .pl__n span sets display:block and outranks a bare .stage — qualify it. */
#v-map .pl__n span.stage,#v-map .stage{display:inline-block;width:auto;
  padding:1px 6px;border-radius:4px;font:500 8.5px var(--meta);letter-spacing:.3px}
#v-map .stage.establishing{background:#eef3f7;color:#4a6b80}
#v-map .stage.bending{background:#fdf3e3;color:#96671a}
#v-map .stage.producing{background:#eaf4ec;color:#2f6b3c}
#v-map .stage.ageing{background:#f7eeee;color:#8d3a3a}
#v-map .stage.unknown{background:var(--bg);color:var(--ink-faint)}
/* Bed ribbon: every bed in the house, width to length, colour to variety. */
#v-map .plan{margin:2px 0 10px}
#v-map .plan__bar{position:relative;display:flex;height:34px;border-radius:5px;
  overflow:hidden;box-shadow:inset 0 0 0 1px rgba(10,10,10,.10)}
#v-map .plan__seg{position:relative;display:flex;align-items:center;
  justify-content:center;min-width:2px}
#v-map .plan__seg span{font:600 9.5px var(--grid);color:#fff;letter-spacing:.2px;
  text-shadow:0 1px 2px rgba(0,0,0,.32)}
#v-map .plan__tick{position:absolute;top:0;bottom:0;width:1px;
  background:rgba(255,255,255,.30)}
#v-map .plan__scale{position:relative;height:11px;margin-top:4px}
#v-map .plan__scale span{position:absolute;transform:translateX(-50%);
  font:400 8.5px var(--grid);color:var(--ink-faint);font-variant-numeric:tabular-nums}
#v-map .plan__scale .l{left:0;transform:none}
#v-map .plan__scale .r{right:0;left:auto;transform:none}
#v-map .plan__row{display:flex;align-items:center;gap:8px;padding:4px 0;
  border-bottom:1px solid rgba(10,10,10,.04)}
#v-map .plan__row:last-of-type{border-bottom:0}
#v-map .plan__row i{width:9px;height:9px;border-radius:2px;flex:none}
#v-map .plan__row b{font:500 11px var(--grid);color:var(--ink-1)}
#v-map .plan__row span{flex:1;font:400 9.5px var(--meta);color:var(--ink-faint)}
#v-map .plan__row u{text-decoration:none;font:600 11px var(--grid);color:var(--ink);
  font-variant-numeric:tabular-nums}
#v-map .rib-note{font:400 9.5px var(--meta);color:var(--ink-faint);margin-top:6px}

/* ── Map furniture ───────────────────────────────────────────────── */
#v-map .ghlabel{background:transparent;border:0}
#v-map .ghlabel div{font:600 10px var(--grid);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85),
  0 0 10px rgba(0,0,0,.5);white-space:nowrap;text-align:center;letter-spacing:.2px}
#v-map .ghlabel div em{display:block;font-style:normal;font-weight:500;font-size:8px;
  opacity:.82;margin-top:-1px}
#v-map .ghlabel div u{display:inline-block;text-decoration:none;font-size:8px;font-weight:600;
  padding:0 3px;border-radius:3px;background:var(--neg);color:#fff;margin-left:3px;
  text-shadow:none;vertical-align:middle}
#v-map #legend{left:14px;bottom:14px;padding:9px 12px;display:flex;
  flex-wrap:wrap;gap:5px 14px;max-width:420px;transition:left .18s ease}

#v-map #detail.on ~ #legend,
#v-map #detail.on ~ #mapcap{display:none}
#v-map .lg{display:inline-flex;align-items:center;gap:6px;font:500 10px var(--grid);
  color:var(--ink-4)}
#v-map .lg i{width:11px;height:11px;border-radius:3px;flex:none}
#v-map .tip{position:fixed;z-index:900;pointer-events:none;background:rgba(20,19,17,.94);color:#fff;
  border-radius:6px;padding:7px 9px;font:400 10.5px var(--grid);white-space:nowrap;opacity:0;
  transition:opacity .1s;box-shadow:0 6px 20px rgba(10,10,10,.3);line-height:1.6}
#v-map .tip.on{opacity:1}
#v-map .tip b{display:block;font-weight:600;font-size:11px;margin-bottom:2px}
#v-map .tip s{text-decoration:none;color:rgba(255,255,255,.6)}
#v-map #boot{position:absolute;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  background:#141618;color:#8a8780;font:500 12px var(--sans);gap:9px}
#v-map #boot.off{display:none}
#v-map .spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.15);border-top-color:#c8515f;
  border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:.30}50%{opacity:.75}}
#v-map .surging{animation:pulse 2.4s ease-in-out infinite}



/* Rounded chips rather than shadowed text — legible over any imagery. */
#v-map .pinwrap{display:inline-block;transform:translate(-50%,-50%)}
#v-map .pin{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 7px;
  border-radius:999px;background:#fff;white-space:nowrap;
  box-shadow:0 2px 8px rgba(10,10,10,.30),0 0 0 1px rgba(10,10,10,.05);
  transition:transform .14s ease,box-shadow .14s ease;cursor:pointer;position:relative}
#v-map .pin:hover{transform:translateZ(0) scale(1.06);
  box-shadow:0 5px 16px rgba(10,10,10,.36),0 0 0 1px rgba(10,10,10,.06)}
#v-map .pin__i{display:flex;flex:none}
#v-map .pin__i svg{width:16px;height:16px;display:block}
#v-map .pin__t b{display:block;font:600 10.5px var(--grid);color:var(--ink);
  line-height:1.15;letter-spacing:-.1px}
#v-map .pin__t s{display:block;text-decoration:none;font:500 8.5px var(--grid);
  color:var(--ink-faint);line-height:1.15;font-variant-numeric:tabular-nums}
#v-map .pin.on{background:var(--ink)}
#v-map .pin.on .pin__t b{color:#fff}
#v-map .pin.on .pin__t s{color:rgba(255,255,255,.62)}
#v-map .pin--empty{padding:2px 8px;background:rgba(18,20,18,.62);
  box-shadow:0 0 0 1px rgba(255,255,255,.24)}
#v-map .pin--empty .pin__t b{font-weight:500;font-size:9px;
  color:rgba(255,255,255,.88);letter-spacing:.2px}
#v-map .pin__ops{display:inline-flex;gap:2px;margin-left:3px;padding-left:5px;
  border-left:1px solid rgba(10,10,10,.10)}
#v-map .pin__op{display:flex;width:15px;height:15px;border-radius:4px;color:#fff;
  align-items:center;justify-content:center;flex:none}
#v-map .pin__opi{width:10px;height:10px}
/* A house with something actually running gets a pulse, not just an icon. */
#v-map .pin__ops.live .pin__op:first-child{animation:oppulse 1.9s ease-in-out infinite}
@keyframes oppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
#v-map .htsum{font:400 10px var(--meta);color:var(--ink-faint);margin-bottom:6px}
#v-map .htsum b{color:var(--ink-2);font-weight:600}
#v-map .htsum u{text-decoration:none;color:var(--neg);font-weight:600}
#v-map .ht{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer;
  border-bottom:1px solid rgba(10,10,10,.04)}
#v-map .ht:last-child{border-bottom:0}
#v-map .ht:hover{background:var(--bg)}
#v-map .ht__b{flex:1;min-width:0}
#v-map .ht__b b{display:block;font:500 10.5px var(--grid);color:var(--ink-1);
  line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#v-map .ht__b s{display:block;text-decoration:none;font:400 9px var(--meta);
  color:var(--ink-faint);line-height:1.3}
#v-map .ht__s{flex:none;font:600 8.5px var(--meta);letter-spacing:.3px;
  text-transform:uppercase;color:var(--ink-faint)}
#v-map .ht.run .ht__s{color:var(--warn)}
#v-map .ht.late .ht__s{color:var(--neg)}
#v-map .ht.done{opacity:.45}
#v-map .ht.done .ht__b b{text-decoration:line-through}
#v-map .ht.skip{opacity:.35}
#v-map .pin__hot{display:inline-flex;margin-left:2px;padding:1px 5px;border-radius:999px;
  background:var(--neg);color:#fff;font:600 8.5px var(--grid);letter-spacing:-.1px}
/* A quiet halo so a surging house reads before you have read anything. */
#v-map .pin.hot::before{content:"";position:absolute;inset:-4px;border-radius:999px;
  border:2px solid var(--neg);opacity:.5;animation:pinpulse 2s ease-in-out infinite}
@keyframes pinpulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.09);opacity:0}}
#v-map #mapcap{position:absolute;left:14px;top:64px;z-index:600;
  padding:4px 9px;border-radius:999px;background:rgba(20,19,17,.78);
  font:500 9px var(--grid);color:rgba(255,255,255,.82);
  letter-spacing:.2px;pointer-events:none}
/* Rounded zoom control to match the panels */
#v-map .leaflet-control-zoom{border:0!important;box-shadow:var(--shadow-float)!important;
  border-radius:6px!important;overflow:hidden}
#v-map .leaflet-control-zoom a{width:30px!important;height:30px!important;
  line-height:30px!important;color:var(--ink-3)!important;
  background:rgba(255,255,255,.95)!important;border:0!important;
  font-size:16px!important;font-weight:400!important}
#v-map .leaflet-control-zoom a:hover{background:#fff!important;color:var(--ink)!important}
#v-map .leaflet-control-zoom a:first-child{border-bottom:1px solid var(--hairline)!important}
#v-map .lgi{display:flex;flex:none}
#v-map .lgi svg{width:15px;height:15px;display:block}
/* ── Weekly plan ────────────────────────────────────────────────── */
.pnav{display:flex;align-items:center;gap:12px;padding:12px 16px;margin-bottom:12px}
.pnav__t{min-width:82px}
.pnav__t b{display:block;font:600 14px var(--sans);color:var(--ink);letter-spacing:-.2px}
.pnav__t s{display:block;text-decoration:none;font:400 9.5px var(--meta);color:var(--ink-faint)}
.pnav .grow{flex:1}
.pnav__p{font:600 11px var(--grid);color:var(--ink-3);width:30px}
.pbar{width:130px;height:6px;border-radius:4px;background:var(--bg);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;
  background:linear-gradient(90deg,#3f8f4f,#2f8f8a)}
.pstat{text-align:center;padding:0 9px;border-left:1px solid var(--hairline)}
.pstat b{display:block;font:600 15px var(--grid);color:var(--ink);
  font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.pstat s{display:block;text-decoration:none;font:500 8.5px var(--meta);
  letter-spacing:.4px;text-transform:uppercase;color:#c2bfb6}
.pstat.run b{color:var(--warn)} .pstat.ok b{color:var(--s-actual)}
.pstat.late b{color:var(--neg)}
.pboard{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:start}
.pday{background:var(--surface-2);border-radius:6px;box-shadow:var(--shadow-card);
  overflow:hidden;min-width:0}
.pday.on{box-shadow:0 0 0 1.5px var(--signal),var(--shadow-card)}
.pday__h{display:flex;align-items:baseline;gap:6px;padding:9px 11px 7px}
.pday__h b{font:600 11px var(--sans);color:var(--ink-2);letter-spacing:.2px}
.pday.on .pday__h b{color:var(--rose-600)}
.pday__h s{text-decoration:none;margin-left:auto;font:500 9.5px var(--grid);
  color:var(--ink-faint)}
.pday__b{padding:0 7px 8px;display:flex;flex-direction:column;gap:3px}
.pday__e{text-align:center;padding:10px 0;color:#d6d3cb;font-size:11px}
.ptask{display:flex;align-items:center;gap:7px;padding:6px 7px;border-radius:5px;
  background:var(--bg);cursor:pointer;transition:background .12s,transform .12s;min-width:0}
.ptask:hover{background:#eceae4;transform:translateX(1px)}
.ptask__i{display:flex;flex:none;width:19px;height:19px;border-radius:5px;
  align-items:center;justify-content:center;color:#fff}
.opi{width:12px;height:12px}
.tone-harvest{background:#3f8f4f} .tone-spray{background:#7a5ea8}
.tone-water{background:#3a6ea8}  .tone-scout{background:#d9962e}
.tone-crop{background:#2f8f8a}   .tone-fix{background:#8a8780}
.tone-other{background:#b8b6ae}
.ptask__b{flex:1;min-width:0}
.ptask__b b{display:block;font:600 10px var(--grid);color:var(--ink-1);line-height:1.25}
.ptask__b s{display:block;text-decoration:none;font:400 9px var(--meta);
  color:var(--ink-faint);line-height:1.25;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.ptask__t{flex:none;font:600 9px var(--grid);color:var(--ink-4)}
.ptask.run{background:#fdf4e6;box-shadow:inset 0 0 0 1px rgba(217,150,46,.35)}
.ptask.done{opacity:.5}
.ptask.done .ptask__b b{text-decoration:line-through}
.ptask.skip{opacity:.38}
.ptask.late{background:#fbeeee;box-shadow:inset 0 0 0 1px rgba(196,48,43,.3)}
@media (max-width:1240px){.pboard{grid-template-columns:repeat(4,1fr)}}

.toast{position:fixed;bottom:24px;right:24px;background:var(--grad-ink);color:#fafaf6;
  padding:14px 22px;border-radius:6px;font:500 13px var(--sans);box-shadow:var(--shadow-hover);
  z-index:99;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}

/* ── Summer Flowers additions ──────────────────────────────────────
   Everything above is the Upande grid stylesheet, copied unchanged so the
   pages cannot drift apart. Only what this page has lives below. */
.view{display:none}
.view.on{display:block}
#v-dashboard.on,#v-plans.on,#v-demand.on,#v-blocks.on,#v-plantings.on,
#v-protocols.on,#v-motherstock.on,#v-scenarios.on{flex:1;min-height:0;overflow:auto;padding-right:4px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}
/* ── The spreadsheet ──────────────────────────────────────────────
   Frozen columns sized for prose: a variety and a farm, not "GH 05". */
:root{--gh:176px;--lbl:140px;--spark:86px;--grade:0px}
.grid tr.main .gh s{display:block;font:400 8.5px var(--meta);color:#adaaa2;
  text-decoration:none;margin-top:-1px;line-height:1.3;letter-spacing:.15px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:calc(var(--gh) - 20px);padding-left:11px}
.grid tr.main .lbl s{max-width:none;overflow:visible}
.grid tr.main td{height:30px}
#v-grid.on{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}
#gridcard{flex:1;min-height:0;display:flex;flex-direction:column;margin-bottom:0}
#gridcard .scroller{flex:1;min-height:0;overflow:auto}
.grid tr.fill td{height:24px;background:var(--surface-2)}
#gridcard .scroller > table{background:var(--surface-2)}
.grid tr.main .gh{font-weight:600}
.grid tr.main .lbl s{max-width:calc(var(--lbl) - 12px)}
.grid tr.ref .lbl,.grid tr.g .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid td.t-actual{color:var(--s-actual);font-weight:500}
.grid td.t-revised{color:var(--s-revised);font-weight:500}
.grid td.t-warn{color:var(--warn);font-weight:600}
.grid td.t-mute{color:var(--ink-mute)}
.grid td.t-pos{color:var(--pos);font-weight:500}
.grid td.t-neg{color:var(--neg);font-weight:600}
/* A firm week is a committed order rather than a guess. It reads as a
   deeper shade of the same input band — no badge, no corner tick. */
.grid tr.t1 td.c.edit.firm{background:rgba(42,111,143,.13)}
.grid tr.t1 td.c.edit.firm.mb{background:rgba(42,111,143,.16)}
.stale{display:inline-flex;align-items:center;gap:5px;font:600 8px var(--meta);
  letter-spacing:.4px;text-transform:uppercase;padding:2px 6px;border-radius:3px;
  background:rgba(217,150,46,.18);color:#8f6110;margin-left:7px;cursor:pointer;
  border:0}
.stale:hover{background:rgba(217,150,46,.3)}
.gmeta{display:inline-flex;gap:5px;margin-left:7px;vertical-align:1px}
.gmeta u{text-decoration:none;font:700 7.5px var(--meta);letter-spacing:.3px;
  padding:1px 4px;border-radius:3px;background:var(--bg);color:var(--ink-mute)}
.gmeta u.bad{background:rgba(196,48,43,.12);color:var(--neg)}
.gmeta u.ok{background:rgba(63,143,79,.13);color:#2f7a3d}
/* ══ The sheet ═════════════════════════════════════════════════════
   The inherited grid boxes every cell on all four sides. A full lattice is
   what makes a table look like a word processor: forty vertical rules
   competing with the numbers they are supposed to be separating.

   So: no cell borders at all. Columns are separated by alignment and by a
   month band; rows by type weight and space. The only rules left are one
   under the header and one under the month strip, because those genuinely
   divide a heading from its data. */
/* Vertical rules only. Thirty-two columns of numbers need a column
   structure; what made it look like a word processor was ruling all four
   sides of every cell, not the verticals themselves. */
.grid td,.grid th{border-bottom:0}
.grid td.c,.grid th.c{border-right:1px solid #f0ede6}
.grid .grd,.grid thead th.grd{border-right:1px solid #e8e4da}
.grid td.c:last-child,.grid th.c:last-child{border-right:0}
.grid tr.gap td{border-right:0}
.grid td.ms,.grid th.ms{border-left:1px solid #dfdad0}
#gridcard .scroller > table{background:#fff}
.grid tr.fill td{background:#fff}
.grid .idx,.grid .gh,.grid .lbl,.grid .spk,.grid .grd{background:var(--surface-2)}
.grid thead tr:last-child th{border-bottom:1px solid var(--hairline)}
.grid .idx{color:#d3d0c7;font-size:9px}

/* ── Tier 1: the row you type into ───────────────────────────── */
.grid tr.t1 td{height:33px}
.grid tr.t1 .c{font:600 13px var(--grid);color:var(--ink);letter-spacing:-.2px}
.grid tr.main td{background:#fcfbf9}
.grid tr.main .gh,.grid tr.main .lbl,.grid tr.main .spk,.grid tr.main .idx,
.grid tr.main .grd{background:#faf9f5}
.grid tr.t1 td.c.edit{background:rgba(42,111,143,.07)}
.grid tr.t1 td.c.edit.mb{background:rgba(42,111,143,.08)}
.grid tr.t1 td.c.edit:hover{background:rgba(42,111,143,.13);
  box-shadow:inset 0 0 0 1.5px var(--s-forecast);cursor:cell}

/* The rail carries a name and nothing else. Coverage, bed counts and the
   rebuild action used to live here and turned four columns into clutter;
   they now sit where there is room for them. */
.grid tr.t1 .gh{font:600 13px var(--sans);color:var(--ink);letter-spacing:-.25px}
.grid tr.main .gh s{display:block;font:500 8px var(--sans);color:var(--ink-faint);
  text-decoration:none;letter-spacing:1.1px;text-transform:uppercase;
  margin-top:1px;padding-left:11px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:calc(var(--gh) - 18px)}
.grid tr.t1 .lbl{font:600 11.5px var(--sans);color:var(--ink)}

/* ── Tier 2: the answer ──────────────────────────────────────── */
.grid tr.t2 td{height:26px}
.grid tr.t2 .c{font:500 11.5px var(--grid);color:var(--ink-2)}
.grid tr.t2 .lbl{font:600 10.5px var(--sans);color:var(--ink-3);padding-left:20px}

/* ── Tier 3: the workings ────────────────────────────────────── */
.grid tr.t3 td{height:23px}
.grid tr.t3 .c{font:400 10.5px var(--grid);color:var(--ink-mute)}
.grid tr.t3 .lbl{font:400 10px var(--sans);color:var(--ink-mute);padding-left:20px}
.grid tr.ref .lbl em{display:none}

/* No per-row hues. Demand is the input and reads darkest and heaviest;
   Production and Variance answer it; the workings sit quietly below. */

.grid td.short{color:var(--neg);font-weight:600}
.grid tr.t2 td.over{color:var(--ink-mute);font-weight:400}

/* ── Group separation: space, not a rule ─────────────────────── */
.grid tr.gap td{height:16px;background:#fff;border:0}
.grid tr.gap .idx,.grid tr.gap .gh,.grid tr.gap .lbl,.grid tr.gap .spk,
.grid tr.gap .grd{background:var(--surface-2)}

/* ── Month rhythm: fill only ─────────────────────────────────── */
.grid td.mb,.grid th.c.mb{background-color:#faf8f3}
.grid thead th.mo{height:20px;text-align:left;padding:0 0 0 8px;
  font:700 8px var(--meta);letter-spacing:1.1px;text-transform:uppercase;
  color:var(--ink-faint);background:var(--surface-2);white-space:nowrap;
  border-bottom:1px solid var(--hairline)}
.grid thead th.mo.mb{background-color:#f7f5ef}
.grid thead th.mo.now{color:var(--rose-600)}
.grid thead tr.morow th{top:0;height:20px}
.grid thead tr:last-child th{top:20px}
.grid thead th.c{font:600 10px var(--meta);color:var(--ink-4)}

/* Follow a row across forty columns without losing it. */
.grid tbody tr.main:hover td,.grid tbody tr.ref:hover td{
  box-shadow:inset 0 0 0 9999px rgba(10,10,10,.018)}

/* ── Now, and the past ───────────────────────────────────────── */
.grid td.nowcol{box-shadow:inset 2px 0 0 rgba(200,81,95,.5)}
.grid thead th.c.now{color:var(--rose-600)}
.grid td.past{background:#fdfcfa}
.grid td.past.mb{background:#faf8f3}
.grid tr.t1 td.past.c{color:var(--ink-3);font-weight:500}
.grid tr.t2 td.past.c,.grid tr.t3 td.past.c{color:var(--ink-mute)}

.scroller.scrolled .grid .grd,.scroller.scrolled .grid thead th.grd{
  box-shadow:10px 0 14px -10px rgba(60,45,20,.28)}

/* ── One place to rebuild ────────────────────────────────────── */
.stalebar{display:flex;align-items:center;gap:10px;padding:9px 18px;flex:none;
  background:rgba(217,150,46,.09);font:500 11px var(--sans);color:#8f6110}
.stalebar b{font-weight:600}
.stalebar .sp{flex:1}
.stalebar button{border:0;cursor:pointer;background:var(--ink);color:#fafaf6;
  font:600 10.5px var(--sans);padding:6px 14px;border-radius:6px}
.stalebar button:hover{background:var(--ink-2)}

.totals{display:flex;align-items:center;gap:20px;padding:9px 18px;flex:none;
  border-top:1px solid var(--hairline);background:var(--surface)}
.totals div{display:flex;align-items:baseline;gap:7px}
.totals small{font:500 8.5px var(--meta);letter-spacing:.7px;text-transform:uppercase;
  color:var(--ink-mute)}
.totals b{font:600 13px var(--grid);color:var(--ink);font-variant-numeric:tabular-nums}
/* ── Live ─────────────────────────────────────────────────────── */
.livepill{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;
  background:var(--surface-2);box-shadow:var(--shadow-card);border-radius:6px;
  padding:8px 13px;font:500 10.5px var(--sans);color:var(--ink-4);
  letter-spacing:.4px;text-transform:uppercase}
.livedot{width:7px;height:7px;border-radius:99px;flex:none;background:var(--pos)}
.livedot.on{animation:pulse 2.4s ease-in-out infinite}
.livedot.paused{background:var(--ink-faint);animation:none}
.livedot.off{background:var(--neg);animation:none}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(63,143,79,.45)}
  50%{opacity:.65;box-shadow:0 0 0 5px rgba(63,143,79,0)}}
.fsel{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);
  box-shadow:var(--shadow-card);border-radius:6px;padding:0 11px;height:35px}
.fsel small{font:500 8.5px var(--meta);letter-spacing:.6px;text-transform:uppercase;
  color:var(--ink-mute)}
.fsel select{border:0;background:transparent;outline:none;font:500 12px var(--sans);
  color:var(--ink);cursor:pointer;max-width:170px}
/* ── Exceptions ───────────────────────────────────────────────── */
.exc{display:flex;gap:11px;padding:11px 14px;border-bottom:1px solid rgba(10,10,10,.05);
  align-items:flex-start}
.exc:last-child{border-bottom:0}
.exc__t{flex:1;min-width:0}
.exc__t b{display:block;font:600 11.5px var(--sans);color:var(--ink);margin-bottom:2px}
.exc__t span{display:block;font:400 10.5px var(--sans);color:var(--ink-4);line-height:1.5}
.exc__go{flex:none;align-self:center;font:500 10px var(--sans);color:var(--ink-4);
  text-decoration:none;padding:5px 10px;border-radius:6px;background:var(--bg);
  white-space:nowrap}
.exc__go:hover{background:#eceae4;color:var(--ink)}
.exc__k{flex:none;font:700 8px var(--meta);letter-spacing:.5px;text-transform:uppercase;
  padding:2px 6px;border-radius:3px;align-self:center}
.exc.blocker .exc__k{background:rgba(196,48,43,.12);color:var(--neg)}
.exc.warn .exc__k{background:rgba(217,150,46,.16);color:#8f6110}
.exc.info .exc__k{background:rgba(42,111,143,.12);color:var(--s-forecast)}
/* ── Act by ───────────────────────────────────────────────────── */
.act{display:flex;align-items:center;gap:11px;padding:6.5px 0;
  border-bottom:1px solid rgba(10,10,10,.04);text-decoration:none}
.act:last-child{border-bottom:0}
.act:hover{background:#fbfaf7}
.act__w{flex:none;width:60px;font:600 10.5px var(--grid);color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.act__w i{font-style:normal;font-size:7.5px;color:var(--ink-faint);margin-left:1px}
.act__v{flex:none;width:88px;font:700 8.5px var(--meta);letter-spacing:.4px;
  text-transform:uppercase;color:var(--ink-3)}
.act__q{flex:none;width:70px;text-align:right;font:600 11.5px var(--grid);color:var(--ink);
  font-variant-numeric:tabular-nums}
.act__u{flex:none;width:62px;font:400 9.5px var(--meta);color:var(--ink-faint)}
.act__n{flex:1;min-width:0;font:500 10.5px var(--grid);color:var(--ink-4);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act__d{flex:none;font:600 9.5px var(--meta);color:var(--ink-faint);
  padding:2px 7px;border-radius:99px;background:var(--bg)}
.act.due .act__d{background:rgba(217,150,46,.18);color:#8f6110}
.act.late .act__d{background:rgba(196,48,43,.12);color:var(--neg)}
.act.late .act__q{color:var(--neg)}
/* ── Tables ───────────────────────────────────────────────────── */
.gtab{width:max-content;min-width:100%;border-collapse:separate;border-spacing:0;
  font-variant-numeric:tabular-nums}
.gtab th{position:sticky;top:0;z-index:2;text-align:left;height:26px;padding:0 12px;
  font:900 9.5px var(--meta);color:var(--ink-3);background:var(--surface-2);
  border-bottom:1px solid #e5e1d9;white-space:nowrap}
.gtab th.n{text-align:right}
.gtab td{height:29px;padding:0 12px;font:400 11px var(--grid);color:var(--ink-2);
  border-bottom:1px solid #f1efeb;white-space:nowrap}
.gtab td.n{text-align:right}
.gtab td b{font-weight:600;color:var(--ink)}
.gtab tbody tr:hover td{background:#fbfaf7}
.gtab td em{font-style:normal;font:400 9.5px var(--meta);color:var(--ink-faint)}
.gtab a{color:var(--s-forecast);text-decoration:none;font-weight:500}
.gtab a:hover{text-decoration:underline}
.wk{display:inline-block;padding:1px 5px;border-radius:3px;background:var(--bg);
  font:600 9.5px var(--grid);color:var(--ink-3);margin-right:3px}
.pill{display:inline-block;padding:2px 7px;border-radius:99px;font:700 8.5px var(--meta);
  letter-spacing:.4px;text-transform:uppercase}
.pill.ok{background:rgba(63,143,79,.13);color:#2f7a3d}
.pill.warn{background:rgba(217,150,46,.18);color:#8f6110}
.pill.bad{background:rgba(196,48,43,.12);color:var(--neg)}
.pill.mute{background:rgba(10,10,10,.055);color:var(--ink-mute)}
.pill.info{background:rgba(42,111,143,.12);color:var(--s-forecast)}
.bar{height:6px;border-radius:4px;background:var(--bg);overflow:hidden;min-width:64px;flex:1}
.bar i{display:block;height:100%;border-radius:4px;background:var(--s-actual)}
.bar i.over{background:var(--warn)}
.bar i.under{background:var(--neg)}
.empty{padding:56px 24px;text-align:center;color:var(--ink-mute);font:400 12px var(--sans)}
.empty b{display:block;font:600 15px var(--sans);color:var(--ink-3);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);z-index:900;
  background:var(--ink);color:#fafaf6;font:500 12px var(--sans);padding:10px 18px;
  border-radius:6px;opacity:0;pointer-events:none;transition:.2s;
  box-shadow:0 10px 30px -8px rgba(10,10,10,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.fld{flex:1}
.fld small{display:block;font:500 8.5px var(--meta);letter-spacing:.6px;
  text-transform:uppercase;color:var(--ink-mute)}
.fld input{width:100%;margin-top:4px;border:1px solid var(--hairline);border-radius:6px;
  padding:7px 9px;font:500 12px var(--grid);color:var(--ink);outline:none;background:var(--surface)}
.fld input:focus{border-color:var(--s-forecast)}
.scwk{border:0;cursor:pointer;border-radius:3px;padding:5px 0;font:600 9px var(--meta);
  background:var(--bg);color:var(--ink-faint)}
.scwk.on{background:rgba(63,143,79,.18);color:#2f7a3d}
.scwk:hover{outline:1px solid var(--s-forecast)}
/* ══ Sidebar filters ═══════════════════════════════════════════════
   Straight from the ufd-modern set: a labelled section per filter, chips
   with counts, and the count itself coloured when it is the thing you
   should be looking at. Filters belong here on every page — not as two
   lonely selects in the header. */
.side__label{font:500 9px var(--sans);text-transform:uppercase;letter-spacing:1.6px;
  color:var(--ink-mute);margin:14px 10px 7px}
.side__chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 8px}
.side__chip{border:0;background:rgba(10,10,10,0.045);font:500 10.5px var(--sans);
  color:var(--ink-4);padding:5px 9px;border-radius:999px;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:all .18s;
  max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side__chip:hover{color:var(--ink);background:rgba(10,10,10,0.075)}
.side__chip.on{background:var(--grad-ink);color:#fafaf6}
.side__chip b{font:600 9px var(--sans);min-width:15px;height:15px;padding:0 4px;
  border-radius:99px;display:inline-grid;place-items:center;
  background:rgba(10,10,10,0.07);color:var(--ink-4)}
.side__chip.on b{background:rgba(255,255,255,0.2);color:#fff}
.side__chip b.hot{background:rgba(196,48,43,.15);color:var(--neg)}
.side__chip b.mod{background:rgba(217,150,46,.2);color:#8f6110}
.side__chip.on b.hot,.side__chip.on b.mod{background:rgba(255,255,255,0.22);color:#fff}
.side__stat{display:flex;justify-content:space-between;align-items:baseline;
  padding:5px 10px;border-bottom:1px solid var(--hairline)}
.side__stat:last-child{border-bottom:0}
.side__stat small{font:500 10.5px var(--sans);color:var(--ink-4)}
.side__stat b{font:600 12.5px var(--sans);color:var(--ink);font-variant-numeric:tabular-nums}
.side__legend{display:flex;flex-direction:column;gap:6px;padding:0 10px}
.side__legend span{display:inline-flex;align-items:center;gap:8px;
  font:500 10.5px var(--sans);color:var(--ink-3)}
.side__legend i{width:9px;height:9px;border-radius:3px;flex:none}
.sb-collapsed .side__label,.sb-collapsed .side__chips,.sb-collapsed .side__stat,
.sb-collapsed .side__legend{display:none}
/* ── Filter bar ──────────────────────────────────────────────────
   Filters sit at the top of every page, where you look first. The rail
   keeps the running totals and the legend — things you read, not set. */
.fbar{display:flex;align-items:center;gap:0;flex-wrap:wrap;flex:none;
  background:var(--surface-2);border-radius:999px;box-shadow:var(--shadow-card);
  padding:8px 10px;margin-bottom:2px}
.fbar .fsel{background:rgba(10,10,10,.04);box-shadow:none;height:38px;padding:0 6px 0 14px;
  gap:9px;cursor:pointer;transition:background .18s}
.fbar .fsel:hover{background:rgba(10,10,10,.07)}
.fbar .fsel small{font:500 9px var(--sans);letter-spacing:1.5px}
.fbar .fsel select{font:500 12.5px var(--sans);max-width:210px;padding:0 6px 0 0}
.fbar__clear{margin-left:auto;border:0;background:transparent;cursor:pointer;
  font:500 11px var(--sans);color:var(--ink-faint);padding:6px 14px;border-radius:999px}
.fbar__clear:hover{background:rgba(10,10,10,.05);color:var(--ink)}
body.focus .fbar{display:none}

/* ══ Inbox ═════════════════════════════════════════════════════════
   The taskwork component, to spec: a tinted rounded icon square carries the
   severity, the name and meta stack in the middle, an age sits right, and
   the action is a pill. No left borders — tone lives in the icon. */
.inbox{display:flex;flex-direction:column}
.inbox__row{display:grid;grid-template-columns:44px 1fr auto auto;gap:16px;
  align-items:center;padding:15px 10px;border-bottom:1px solid var(--hairline);
  border-radius:12px;transition:background .2s;text-decoration:none}
.inbox__row:hover{background:rgba(10,10,10,0.02)}
.inbox__row:last-child{border-bottom:0}
.inbox__icon{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;
