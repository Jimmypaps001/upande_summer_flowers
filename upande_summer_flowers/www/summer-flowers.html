      <th>Coverage</th><th class="n">Deficit wks</th><th class="n">New beds</th>
      <th class="n">Peak stick</th><th>Peak week</th><th>Budget</th>
      </tr></thead><tbody>${rows || emptyRow(13)}</tbody></table>`);
}

/* ══ Motherstock planner ═══════════════════════════════════════════
   Ported from the TC Planner page onto the Summer Flower model. A batch is
   not a static number of plants: it ramps, produces for a fixed life, and
   must be replaced by a generation ordered long before the old one dies. */
let MS = null;

function drawMotherstock() {
  if (!MS) {
    $("#msbody").innerHTML = `<div class="card"><div class="empty">Loading…</div></div>`;
    api("motherstock.overview", { farm: FARM || null, variety: VARIETY || null })
      .then(r => { MS = r; paintMotherstock(); })
      .catch(e => { $("#msbody").innerHTML =
        `<div class="card"><div class="empty">${esc(e.message)}</div></div>`; });
    return;
  }
  paintMotherstock();
}

function paintMotherstock() {
  const t = MS.totals, cur = (BOOT && BOOT.currency) || "";
  let h = `<div class="kpi-grid">
    ${kpi("Mother plants", fmt(t.mothers), "standing", "#3f8f4f",
          fmt(t.pots) + " pots · " + t.bench + " m² bench")}
    ${kpi("Cutting capacity", fmtMU(t.weekly_capacity), "per week", "#2a6f8f",
          "at full production")}
    ${kpi("Renewals due", fmt(t.due_soon), "of " + t.batches, t.due_soon ? "#c4302b" : "#3f8f4f",
          "inside the ordering lead time")}
    ${kpi("Tissue culture", cur + " " + fmt(t.cost), "", "#c8515f",
          fmt(t.tc_plants) + " plantlets")}
  </div>`;

  // Renewal is the thing that bites, so it leads.
  const rows = byStatus(MS.batches, "batch_status").map(b => `<tr data-ms="${esc(b.name)}"
      style="cursor:pointer">
    <td><b>${esc(b.name)}</b></td>
    <td>${esc(b.variety)}</td><td>${esc(b.farm)}</td>
    <td>${statusPill(b.batch_status)}</td>
    <td class="n">${fmt(b.mother_plants)}</td>
    <td class="n">${fmt(b.weekly_capacity)}</td>
    <td class="n">${fmt(b.peak_bench_sqm)}</td>
    <td>${dmy(b.max_pc_date)}</td>
    <td>${dmy(b.expiry_date)}</td>
    <td>${dmy(b.renewal_tc_order_date)}</td>
    <td><span class="pill ${b.urgency.level === "hot" ? "bad"
      : b.urgency.level === "warn" ? "warn" : "ok"}">${esc(b.urgency.label)}</span></td>
    <td class="n">${cur} ${fmt(b.total_cost)}</td></tr>`).join("");

  h += card("Motherstock batches",
    "Sized on the peak sticking week — click a batch for its full lifecycle",
    `<table class="gtab"><thead><tr><th>Batch</th><th>Variety</th><th>Farm</th>
      <th>Status</th><th class="n">Mothers</th><th class="n">Cuts/wk</th>
      <th class="n">Bench m²</th><th>Max PC</th><th>Expires</th><th>Renew by</th>
      <th>Urgency</th><th class="n">Cost</th></tr></thead><tbody>${
      rows || emptyRow(12)}</tbody></table>`);

  $("#msbody").innerHTML = h;
  document.querySelectorAll("[data-ms]").forEach(tr =>
    tr.addEventListener("click", () => openBatch(tr.dataset.ms)));
}

/* One batch, opened up. */
function openBatch(name) {
  api("motherstock.detail", { batch: name }).then(d => {
    const b = d.batch, cur = b.currency || (BOOT && BOOT.currency) || "";
    const step = st => `<div style="flex:1;min-width:112px;opacity:${st.past ? ".5" : "1"}">
      <div style="font:700 8px var(--meta);letter-spacing:1px;text-transform:uppercase;
        color:var(--ink-faint)">${esc(st.label)}</div>
      <div style="font:600 14px var(--grid);color:var(--ink);margin-top:2px">${
        esc(st.week)}</div>
      <div style="font:400 9.5px var(--meta);color:var(--ink-faint)">${esc(st.sub)}</div></div>`;

    // Capacity as a strip: one block per week, shaded by what it is doing.
    const tone = { establishing: "rgba(10,10,10,.08)", ramping: "rgba(217,150,46,.45)",
                   producing: "rgba(63,143,79,.55)", handover: "rgba(42,111,143,.6)",
                   expiring: "rgba(196,48,43,.5)" };
    const strip = d.capacity.map(c => `<i title="${esc(c.label)} · ${esc(c.state)} · ${
      fmt(c.cuttings)} cuttings" style="background:${tone[c.state]};opacity:${
      c.past ? ".45" : "1"}"></i>`).join("");

    modal({
      title: b.variety + " · " + b.farm, wide: true,
      sub: `${b.name} · generation ${b.generation || 1} · ${esc(b.protocol)}`,
      body: `
        ${b.schedule_warning ? `<div class="mwarn">${esc(b.schedule_warning)}</div>` : ""}
        <div class="mstat">
          <div><s>Mother plants</s><b>${fmt(b.mother_plants)}</b></div>
          <div><s>Cuttings / week</s><b>${fmt(b.peak_weekly_cuttings)}</b></div>
          <div><s>Bench at peak</s><b>${fmt(b.peak_bench_sqm)} m²</b></div>
          <div><s>Renewal</s><b class="${d.urgency.level === "hot" ? "neg" : ""}">${
            esc(d.urgency.label)}</b></div>
        </div>
        <div style="font:700 8.5px var(--meta);letter-spacing:1px;text-transform:uppercase;
          color:var(--ink-faint);margin:4px 0 8px">Pipeline</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px">${
          d.pipeline.map(step).join("")}</div>

        <div style="font:700 8.5px var(--meta);letter-spacing:1px;text-transform:uppercase;
          color:var(--ink-faint);margin-bottom:7px">Cutting capacity · 52 weeks</div>
        <div class="msstrip">${strip}</div>
        <div style="display:flex;gap:14px;margin:8px 0 18px;flex-wrap:wrap">${
          Object.entries(tone).map(([k, v]) =>
            `<span style="display:inline-flex;align-items:center;gap:6px;
              font:500 10px var(--sans);color:var(--ink-4)"><i style="width:10px;height:10px;
              border-radius:3px;background:${v}"></i>${k}</span>`).join("")}</div>

        <div style="font:700 8.5px var(--meta);letter-spacing:1px;text-transform:uppercase;
          color:var(--ink-faint);margin-bottom:7px">Renewal chain</div>
        <table class="gtab" style="margin-bottom:18px"><thead><tr>
          <th>Gen</th><th>Order by</th><th class="n">Lead</th><th>Ready</th>
          <th>Expires</th><th class="n">Plantlets</th><th>Urgency</th></tr></thead><tbody>${
          d.renewals.map(r => `<tr>
            <td><b>${r.generation}</b></td><td>${esc(r.order_week)}</td>
            <td class="n">${r.lead_weeks}w</td><td>${dmy(r.ready)}</td>
            <td>${dmy(r.expires)}</td><td class="n">${fmt(r.tc_plants)}</td>
            <td><span class="pill ${r.urgency.level === "hot" ? "bad"
              : r.urgency.level === "warn" ? "warn" : "ok"}">${
              esc(r.urgency.label)}</span></td></tr>`).join("")}</tbody></table>

        ${d.build_up.length ? `<div style="font:700 8.5px var(--meta);letter-spacing:1px;
          text-transform:uppercase;color:var(--ink-faint);margin-bottom:7px">
          Build-up · ${b.build_up_cycles} cycles → ${b.multiplication_factor}×</div>
          <table class="gtab"><thead><tr><th>Step</th><th>Week</th><th>Date</th>
            <th class="n">Mothers</th><th class="n">Pots</th></tr></thead><tbody>${
            d.build_up.map(x => `<tr><td><b>${esc(x.step || "")}</b></td>
              <td>${esc(x.week_label || "")}</td><td>${dmy(x.target_date)}</td>
              <td class="n">${fmt(x.mother_plants)}</td>
              <td class="n">${fmt(x.pots)}</td></tr>`).join("")}</tbody></table>` : ""}

        <div class="mstat" style="margin-top:18px">
          <div><s>TC plantlets</s><b>${fmt(b.tc_plants_required)}</b></div>
          <div><s>Rate</s><b>${cur} ${b.rate_per_plantlet}</b></div>
          <div><s>TC cost</s><b>${cur} ${fmt(b.tc_cost)}</b></div>
          <div><s>Total</s><b>${cur} ${fmt(b.total_cost)}</b></div>
        </div>`,
      actions: `<a class="inbox__btn ghost" href="${
        (BOOT.routes || {})["Summer Flower Motherstock Batch"]}/${
        encodeURIComponent(b.name)}" target="_blank">Open record</a>`,
    });
  }).catch(e => toast(e.message));
}

function drawPlantings() {
  const rows = byStatus(STATE.plantings, "planting_status").map(p => `<tr data-rec="g:${esc(p.name)}">
    <td><b>${link("Summer Flower Planting", p.name, p.block)}</b></td>
    <td>${esc(p.variety)}</td><td>${esc(p.farm)}</td>
    <td>${statusPill(p.planting_status)}</td>
    <td class="n">${fmt(p.beds)}</td><td class="n">${fmt(p.plants)}</td>
    <td class="n">${(p.gross_area_ha || 0).toFixed(3)}</td>
    <td>${dmy(p.planting_date)}</td>
    <td>W${p.first_harvest_week}/${String(p.first_harvest_year).slice(-2)}</td>
    <td>${String(p.harvest_week_family || "").split(/[,\s]+/).filter(Boolean)
      .map(w => `<span class="wk">${esc(w)}</span>`).join("") || "—"}</td>
    <td class="n">${fmt(p.lifetime_stems)}</td>
    <td class="n">${p.weeks_remaining}w</td>
    <td>${dmy(p.planned_uproot_date)}</td></tr>`).join("");
  $("#plantbody").innerHTML = card("Plantings on the ground",
    `${STATE.plantings.length} standing · ${fmt(STATE.totals.standing_plants)} plants ·
     ${STATE.totals.area_ha.toFixed(2)} ha`,
    `<table class="gtab"><thead><tr><th>Block</th><th>Variety</th><th>Farm</th>
      <th>Status</th><th class="n">Beds</th><th class="n">Plants</th><th class="n">ha</th>
      <th>Planted</th><th>First harvest</th><th>Harvest family</th>
      <th class="n">Lifetime stems</th><th class="n">Remaining</th><th>Uproot</th>
      </tr></thead><tbody>${rows || emptyRow(13)}</tbody></table>`);
}

function drawBlocks() {
  const t = STATE.blocks.totals;
  const rows = byStatus(STATE.blocks.blocks, "block_status").map(b => {
    const cov = b.coverage_pct || 0;
    return `<tr data-rec="b:${esc(b.name)}">
      <td><b>${link("Summer Flower Block", b.name, b.block_code)}</b></td>
      <td>${esc(b.farm)}</td>
      <td class="n">${(b.gross_area_ha || 0).toFixed(2)}</td>
      <td class="n">${fmt(b.total_beds)}</td>
      <td class="n">${fmt(b.beds_occupied)}</td>
      <td class="n">${(b.beds_free || 0) < 0
        ? `<span class="pill bad">${b.beds_free}</span>` : fmt(b.beds_free)}</td>
      <td><div style="display:flex;align-items:center;gap:8px;min-width:120px">
        <div class="bar"><i class="${cov > 100 ? "under" : ""}"
          style="width:${Math.min(100, cov)}%"></i></div><b>${pct(cov)}</b></div></td>
      <td class="n">${fmt(b.plants_standing)}</td>
      <td><em>${esc(b.current_varieties || "—")}</em></td></tr>`;
  }).join("");
  $("#blocksbody").innerHTML = card("Block register",
    `${t.blocks} blocks · ${fmt(t.occupied)} of ${fmt(t.beds)} beds · ${pct(t.coverage_pct)}`,
    `<table class="gtab"><thead><tr><th>Block</th><th>Farm</th><th class="n">ha</th>
      <th class="n">Beds</th><th class="n">Occupied</th><th class="n">Free</th>
      <th>Coverage</th><th class="n">Plants</th><th>Varieties</th>
      </tr></thead><tbody>${rows || emptyRow(9)}</tbody></table>`);
}

function drawProtocols() {
  const rows = STATE.protocols.map(p => `<tr data-rec="r:${esc(p.name)}">
    <td><b>${link("Summer Flower Protocol", p.name)}</b></td>
    <td>${esc(p.variety)}</td><td>${esc(p.farm)}</td>
    <td class="n">${fmt(p.plants_per_sqm_net)}</td>
    <td class="n">${p.weeks_to_pinch}</td>
    <td class="n">${p.flush_interval_weeks}</td>
    <td class="n">${p.total_flushes}</td>
    <td class="n">${(p.total_stems_per_plant_life || 0).toFixed(1)}</td>
    <td class="n">${p.total_weeks_in_ground}</td>
    <td class="n">${p.harvest_weeks_per_year}</td>
    <td class="n">${p.first_harvest_offset_weeks}</td>
    <td class="n">${p.establishment_weeks}</td>
    <td class="n">${p.lead_time_weeks}</td>
    <td class="n">${fmtMU(p.stems_per_ha_year)}</td>
    <td><em>${esc(p.climate_note || "")}</em></td></tr>`).join("");
  $("#protobody").innerHTML = card("Crop protocols",
    "Same variety across farms — the timings differ because the climate does",
    `<table class="gtab"><thead><tr><th>Protocol</th><th>Variety</th><th>Farm</th>
      <th class="n">Plants/m²</th><th class="n">To pinch</th><th class="n">Interval</th>
      <th class="n">Flushes</th><th class="n">Stems/plant</th><th class="n">Wks ground</th>
      <th class="n">Harvest wks/yr</th><th class="n">1st harvest</th>
      <th class="n">Establish</th><th class="n">Lead</th><th class="n">Stems/ha·yr</th>
      <th>Note</th></tr></thead><tbody>${rows || emptyRow(15)}</tbody></table>`,
    `<a class="btn btn--ghost" href="/app/summer-flower-protocol/new">New protocol</a>`);
}

/* ── Toolbar ─────────────────────────────────────────────────── */
function bindToolbar() {
  $("#q").addEventListener("input", e => { QUERY = e.target.value; SEEDED = false; drawGrid(); });
  $("#t-expand").addEventListener("click", () => { CLOSED = {}; drawGrid(); });
  $("#t-collapse").addEventListener("click", () => {
    gVisible().forEach((_, i) => { CLOSED["g" + i] = true; }); drawGrid();
  });
  const batch = f => () => {
    if (!SEL.length) return;
    const cells = SEL.map(td => ({
      demand: td.dataset.demand, year: +td.dataset.year, week: +td.dataset.week,
      before: td.dataset.val === "" ? null : Number(td.dataset.val),
      stems: f(td.dataset.val === "" ? 0 : Number(td.dataset.val)),
    }));
    saveMany(cells, "Updated");
  };
  $("#t-up").addEventListener("click", batch(v => Math.round(v * 1.1)));
  $("#t-down").addEventListener("click", batch(v => Math.round(v * 0.9)));
  $("#t-clear").addEventListener("click", batch(() => 0));
  $("#t-fill").addEventListener("click", () => {
    if (!ANCHOR) return;
    const v = ANCHOR.dataset.val === "" ? 0 : Number(ANCHOR.dataset.val);
    const cells = SEL.filter(td => td !== ANCHOR).map(td => ({
      demand: td.dataset.demand, year: +td.dataset.year, week: +td.dataset.week,
      before: td.dataset.val === "" ? null : Number(td.dataset.val), stems: v }));
    saveMany(cells, "Filled");
  });
  document.querySelectorAll("[data-dens]").forEach(b =>
    b.addEventListener("click", () => {
      DENS = b.dataset.dens;
      document.querySelectorAll("[data-dens]").forEach(x => x.classList.remove("on"));
      b.classList.add("on"); drawGrid();
    }));
  $("#t-rebuild").addEventListener("click", () => {
    const gs = gVisible().filter(g => !g.plan || g.plan_stale);
    if (!gs.length) { toast("Every plan is already in step with its demand"); return; }
    toast(`Rebuilding ${gs.length} plan(s)…`);
    gs.reduce((p, g) => p.then(() => api("grid.rebuild_plan", { demand: g.key })),
              Promise.resolve())
      .then(() => { toast(`Rebuilt ${gs.length} plan(s)`); return loadGrid(true); })
      .catch(e => toast("Could not rebuild: " + e.message));
  });
  $("#t-extend").addEventListener("click", () => {
    const gs = gVisible();
    if (!gs.length) return;
    toast("Extending the horizon…");
    gs.reduce((p, g) => p.then(() =>
        api("grid.extend_horizon", { demand: g.key, weeks: 52 })), Promise.resolve())
      .then(() => { toast("Horizon extended a year"); return loadGrid(true); })
      .catch(e => toast("Could not extend: " + e.message));
  });
  $("#t-changes").addEventListener("click", openChanges);
  $("#t-reload").addEventListener("click", () => loadGrid().then(() => toast("Reloaded")));
  $("#t-csv").addEventListener("click", exportCsv);
  $("#t-focus").addEventListener("click", () => document.body.classList.toggle("focus"));
  $("#t-print").addEventListener("click", () => print());
  $("#w-prev").addEventListener("click", () => shiftWindow(-1));
  $("#w-next").addEventListener("click", () => shiftWindow(1));
  $("#window").addEventListener("click", openRangePicker);
  addEventListener("keydown", e => {
    if (e.key === "Escape") { clearSel(); syncTools(); }
    gridKeys(e);
  });
}

function shiftWindow(by) {
  const w = GRID.weeks; if (!w.length) return;
  const jump = Math.max(1, Math.round(RANGE.count / 2));
  const anchor = by > 0 ? w[Math.min(w.length - 1, jump)] : w[0];
  RANGE.year = anchor.year;
  RANGE.week = anchor.week - (by > 0 ? 0 : jump);
  while (RANGE.week < 1) { RANGE.year -= 1; RANGE.week += 52; }
  FIRSTPAINT = false;
  loadGrid();
}

function openRangePicker() {
  const old = $("#pop"); if (old) old.remove();
  const w = GRID.weeks[0] || GRID.now;
  const pop = document.createElement("div");
  pop.className = "pop"; pop.id = "pop"; pop.style.width = "306px";
  pop.innerHTML = `<h4>Week window<small>start and length</small></h4>
    <div style="display:flex;gap:8px;margin-top:12px">
      <label class="fld"><small>Year</small><input id="p-y" type="number" value="${w.year}"></label>
      <label class="fld"><small>Week</small><input id="p-w" type="number" min="1" max="53" value="${w.week}"></label>
      <label class="fld"><small>Weeks</small><input id="p-n" type="number" min="4" max="80" value="${RANGE.count}"></label>
    </div>
    <div style="display:flex;gap:7px;margin-top:14px">
      <button class="btn" id="p-ok" style="flex:1">Apply</button>
      <button class="btn btn--ghost" id="p-now">This week</button></div>`;
  document.body.appendChild(pop);
  const b = $("#window").getBoundingClientRect();
  pop.style.top = (b.bottom + 8) + "px";
  pop.style.left = Math.max(12, Math.min(b.left, innerWidth - 320)) + "px";
  const close = () => { pop.remove(); document.removeEventListener("click", off); };
  const off = e => { if (!pop.contains(e.target) && e.target.id !== "window") close(); };
  setTimeout(() => document.addEventListener("click", off), 0);
  $("#p-ok").addEventListener("click", () => {
    RANGE.year = +$("#p-y").value; RANGE.week = +$("#p-w").value;
    RANGE.count = +$("#p-n").value; close(); FIRSTPAINT = false; loadGrid();
  });
  $("#p-now").addEventListener("click", () => {
    RANGE.year = GRID.now.year; RANGE.week = GRID.now.week;
    close(); FIRSTPAINT = true; loadGrid();
  });
}

function exportCsv() {
  const cols = GRID.weeks;
  const keys = ["demand", ...TABLES[TABLE].rows.filter(k => SHOW[k])];
  const rows = [[`${TABLES[TABLE].label} table`, "", "", ...cols.map(() => "")],
                ["Variety", "Farm", "Row", ...cols.map(c => `${c.year}-W${c.week}`)]];
  gVisible().forEach(g => keys.forEach(k => {
    const r = gRow(g, k);
    if (r) rows.push([g.name, g.sub, r.label, ...r.values.map(v => v == null ? "" : v)]);
  }));
  const csv = rows.map(r => r.map(c =>
    /[,"]/.test(String(c)) ? `"${String(c).replace(/"/g, '""')}"` : c).join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = `summer-flowers-${TABLE}.csv`; a.click(); URL.revokeObjectURL(a.href);
}

/* One handler for every table: the prefix says which record it is. */
document.addEventListener("click", e => {
  const tr = e.target.closest("tr[data-rec]");
  if (!tr || e.target.closest("a")) return;
  const [kind, ...rest] = tr.dataset.rec.split(":");
  const name = rest.join(":");
  const F = (n) => fmt(n), P = (n) => pct(n);
  if (kind === "d") {
    const d = STATE.demands.find(x => x.name === name); if (!d) return;
    openRecord("Summer Flower Market Demand", name, `${d.variety} · ${d.farm}`,
      `Demand register · ${d.weeks_covered} weeks`, [
        ["Total stems", F(d.total_demand_stems)], ["Firm", F(d.firm_demand_stems)],
        ["Peak week", F(d.peak_weekly_demand)], ["Average / week", F(d.average_weekly_demand)],
        ["Horizon", `<span class="sm">${esc(d.horizon_start || "—")} → ${
          esc(d.horizon_end || "—")}</span>`],
        ["Weeks covered", F(d.weeks_covered)], ["Weeks ahead", F(d.weeks_ahead_of_today)],
        ["Gap to target", d.horizon_gap_weeks ? `${d.horizon_gap_weeks}w` : "none",
          d.horizon_gap_weeks ? "neg" : "ok"],
        ["Target", `${d.target_years_ahead} yr`]]);
  } else if (kind === "p") {
    const x = STATE.plans.find(y => y.name === name); if (!x) return;
    openRecord("Summer Flower Production Plan", name, `${x.variety} · ${x.farm}`,
      `${name} · ${x.status}`, [
        ["Coverage", P(x.coverage_pct), x.coverage_pct < 100 ? "neg" : "ok"],
        ["Production", F(x.total_production_stems)], ["Demand", F(x.total_demand_stems)],
        ["Variance", F(x.total_variance_stems)],
        ["Deficit weeks", F(x.weeks_in_deficit), x.weeks_in_deficit ? "neg" : "ok"],
        ["Worst week", F(x.worst_weekly_deficit)],
        ["New beds", F(x.new_beds_required)], ["New plants", F(x.new_plants_required)],
        ["Peak sticking", F(x.peak_weekly_sticking)],
        ["Peak week", `<span class="sm">${esc(x.peak_sticking_week || "—")}</span>`],
        ["Window", `<span class="sm">${wk(x.from_week, x.from_year)} – ${
          wk(x.to_week, x.to_year)}</span>`],
        ["Budget", x.budget ? `<span class="sm">${esc(x.budget)}</span>` : "none"]]);
  } else if (kind === "g") {
    const x = STATE.plantings.find(y => y.name === name); if (!x) return;
    openRecord("Summer Flower Planting", name, `${x.variety} · ${x.block}`,
      `${x.farm} · ${x.planting_status}`, [
        ["Beds", F(x.beds)], ["Plants", F(x.plants)],
        ["Area", `${(x.gross_area_ha || 0).toFixed(3)} ha`],
        ["Planted", `<span class="sm">${dmy(x.planting_date)}</span>`],
        ["First harvest", wk(x.first_harvest_week, x.first_harvest_year)],
        ["Lifetime stems", F(x.lifetime_stems)],
        ["Weeks remaining", `${x.weeks_remaining}w`],
        ["Uproot", `<span class="sm">${dmy(x.planned_uproot_date)}</span>`]],
      x.harvest_week_family ? `<div style="margin-top:14px"><div style="font:700 8.5px
        var(--meta);letter-spacing:1px;text-transform:uppercase;color:var(--ink-faint);
        margin-bottom:7px">Harvest family</div>${String(x.harvest_week_family)
        .split(/[,\s]+/).filter(Boolean).map(w =>
        `<span class="wk">${esc(w)}</span>`).join("")}</div>` : "");
  } else if (kind === "b") {
    const x = STATE.blocks.blocks.find(y => y.name === name); if (!x) return;
    openRecord("Summer Flower Block", name, `Block ${x.block_code}`,
      `${x.farm} · ${x.block_status}`, [
        ["Area", `${(x.gross_area_ha || 0).toFixed(2)} ha`],
        ["Total beds", F(x.total_beds)], ["Occupied", F(x.beds_occupied)],
        ["Free", F(x.beds_free), (x.beds_free || 0) < 0 ? "neg" : "ok"],
        ["Coverage", P(x.coverage_pct)], ["Plants standing", F(x.plants_standing)],
        ["Varieties", `<span class="sm">${esc(x.current_varieties || "—")}</span>`]]);
  } else if (kind === "r") {
    const x = STATE.protocols.find(y => y.name === name); if (!x) return;
    openRecord("Summer Flower Protocol", name, `${x.variety} · ${x.farm}`,
      name, [
        ["Plants / m²", F(x.plants_per_sqm_net)], ["To pinch", `${x.weeks_to_pinch}w`],
        ["Flush interval", `${x.flush_interval_weeks}w`], ["Flushes", F(x.total_flushes)],
        ["Stems / plant", (x.total_stems_per_plant_life || 0).toFixed(1)],
        ["Weeks in ground", F(x.total_weeks_in_ground)],
        ["Harvest weeks / yr", F(x.harvest_weeks_per_year)],
        ["First harvest", `+${x.first_harvest_offset_weeks}w`],
        ["Establishment", `${x.establishment_weeks}w`],
        ["Supplier lead", `${x.lead_time_weeks}w`],
        ["Stems / ha·yr", fmtMU(x.stems_per_ha_year)]],
      x.climate_note ? `<div style="margin-top:14px;font:400 11.5px var(--sans);
        color:var(--ink-4);line-height:1.6">${esc(x.climate_note)}</div>` : "");
  }
});

/* ── Boot ────────────────────────────────────────────────────── */
document.querySelectorAll(".snav[data-view]").forEach(b =>
  b.addEventListener("click", () => {
    document.querySelectorAll(".snav[data-view]").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    VIEW = b.dataset.view;
    document.querySelectorAll(".view").forEach(v => v.classList.remove("on"));
    $("#v-" + VIEW).classList.add("on");
    // The grid path skips draw(), so it has to do draw()'s header work itself —
    // otherwise the Planner keeps the previous view's title and its filters.
    if (VIEW === "grid") {
      setTitle(); drawFilters();
      GRID ? drawGrid() : loadGrid();   // returning keeps the week you were on
    } else draw();
  }));
$("#sb-collapse").addEventListener("click", () =>
  document.body.classList.toggle("sb-collapsed"));
$("#livePill").addEventListener("click", () => {
  LIVE.on = !LIVE.on; drawLive();
  toast(LIVE.on ? "Live updates on" : "Live updates paused");
  if (LIVE.on) tick();
});


api("dashboard.bootstrap")
  .then(b => { BOOT = b; LIVE.version = b.version; })
  .catch(() => { BOOT = null; })
  .then(() => {
    const name = (BOOT && BOOT.full_name) || "You";
    $("#sb-user").textContent = name;
    $("#sb-avatar").textContent = name.slice(0, 1).toUpperCase();
    drawLive();
    return null;
  })
  .then(() => { bindToolbar();
    return VIEW === "grid" ? Promise.all([load(), loadGrid()]) : load(); })
  .then(startLive);
</script>
