  background:rgba(10,10,10,0.04);color:var(--ink-3)}
.inbox__icon svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2}
.inbox__icon.hot{background:rgba(196,48,43,0.10);color:var(--neg)}
.inbox__icon.warn{background:rgba(217,150,46,0.14);color:#96650f}
.inbox__icon.ok{background:rgba(63,143,79,0.12);color:#2e6b3a}
.inbox__icon.blue{background:rgba(42,111,143,0.12);color:var(--s-forecast)}
.inbox__name{font:600 14px var(--sans);color:var(--ink)}
.inbox__meta{font-size:12px;color:var(--ink-mute);margin-top:2px;line-height:1.5}
.inbox__age{font:500 11px var(--sans);color:var(--ink-mute);white-space:nowrap}
.inbox__age.hot{color:var(--neg);font-weight:600}
.inbox__age.warn{color:#96650f;font-weight:600}
.inbox__qty{font:600 14px var(--grid);color:var(--ink);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.inbox__qty small{font:400 10.5px var(--meta);color:var(--ink-mute);margin-left:5px}
.inbox__btn{border:0;background:var(--grad-ink);color:#fafaf6;font:600 12px var(--sans);
  padding:9px 18px;border-radius:999px;cursor:pointer;white-space:nowrap;
  transition:all .2s;box-shadow:0 2px 8px rgba(10,10,10,0.16);text-decoration:none}
.inbox__btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(10,10,10,0.24)}
.inbox__btn.ghost{background:rgba(10,10,10,0.05);color:var(--ink-3);box-shadow:none}
.inbox__btn.ghost:hover{background:var(--ink);color:#fafaf6}
.recgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:1px;background:var(--hairline);border-radius:14px;overflow:hidden}
.rec{background:var(--surface-2);padding:11px 14px;min-width:0}
.rec s{display:block;text-decoration:none;font:500 8.5px var(--meta);letter-spacing:.6px;
  text-transform:uppercase;color:var(--ink-mute);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.rec b{font:600 15px var(--grid);color:var(--ink);font-variant-numeric:tabular-nums;
  display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec b.neg{color:var(--neg)} .rec b.ok{color:var(--pos)} .rec b.sm{font-size:12.5px}
.gtab tbody tr[data-rec]{cursor:pointer}
.msstrip{display:flex;gap:2px;height:26px;border-radius:8px;overflow:hidden}
.msstrip i{flex:1;min-width:2px;border-radius:2px}
.pagefoot{flex:none;padding:7px 2px 10px;font:400 10px var(--meta);color:var(--ink-faint);
  display:flex;gap:14px;align-items:center}

/* ══ UFD MODERN GEOMETRY ═══════════════════════════════════════════
   The house style, taken from the ufd-modern set (index / taskwork /
   scouting / avocado): soft 20–24px cards, fully round pills, a big
   Poppins title, generous KPIs. Written last so it wins over the dense
   6px system the grid inherited from the rose budget sheet — the sheet
   itself stays tight, but everything around it is the house style. */

/* ── Sidebar: a floating card, rounded, with pill nav ────────────── */
.sidebar{border-radius:24px;padding:20px 14px;box-shadow:var(--shadow-card)}
.snav{border-radius:12px;padding:9px 12px;font:500 12.5px var(--sans);gap:11px}
.snav svg{width:16px;height:16px}
.snav:hover{background:rgba(10,10,10,0.04);color:var(--ink)}
.snav.on{background:var(--grad-ink);color:#fafaf6;
  box-shadow:0 4px 14px rgba(10,10,10,0.18)}
.sidebar__foot{padding-top:14px;gap:6px}
.sidebar__user{padding:7px 12px;font:500 11.5px var(--sans)}
.avatar{width:30px;height:30px;font-size:11px}
.sb-sec{font:500 9.5px var(--sans);letter-spacing:1.8px;padding:14px 12px 6px}

/* ── Page frame ──────────────────────────────────────────────────── */
.page{padding:30px 34px 0 0;gap:20px}
.pagehead{align-items:flex-end;gap:32px}
.pagehead__eyebrow{font:500 11px var(--sans);letter-spacing:2.2px;margin-bottom:9px}
.pagehead__eyebrow::before{width:18px}
.pagehead__title{font:600 40px/1.05 var(--sans);letter-spacing:-1.3px}
.pagehead__tools{gap:12px}

/* ── Cards ───────────────────────────────────────────────────────── */
.card,.dcard{border-radius:20px;box-shadow:var(--shadow-card)}
.card{overflow:hidden}
#toolcard{border-radius:18px;overflow:visible}
#gridcard{border-radius:20px;overflow:hidden}
.dcard{padding:20px 24px 22px}
.dcard__h{margin-bottom:14px}
.dcard__h h4{font:600 13.5px var(--sans);letter-spacing:-.1px}
.card__head{padding:16px 24px 12px}
.card__head h3{font:600 15px var(--sans);letter-spacing:-.25px}
.card__head .crumb{font:500 11.5px var(--sans)}
.card__head .pillgroup{margin-left:14px;padding:3px}
.card__head .pillgroup button{padding:6px 14px;font-size:11.5px}

/* ── KPIs: the set's signature block ─────────────────────────────── */
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:18px;
  margin-bottom:20px}
.kpi{border-radius:20px;padding:26px 28px;box-shadow:var(--shadow-card)}
/* no left bar — the reference set carries tone in the trend pill */
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.kpi__label{font:500 11px var(--sans);letter-spacing:1.8px;margin-bottom:14px}
.kpi__value{font:600 40px/1 var(--sans);letter-spacing:-1.4px}
.kpi__value i{font:400 15px var(--sans);margin-left:6px}
.kpi__trend{margin-top:15px;padding:6px 13px;border-radius:999px;font:500 11.5px var(--sans)}

/* ── Everything round that should be round ───────────────────────── */
.btn,.pillgroup,.pillgroup button,.datepill,.livepill,.winnav,
.exc__go,.stalebar button,.side__chip,.pill,.act__d,.mclose{border-radius:999px}
.btn{padding:11px 20px;font:600 12.5px var(--sans);
  box-shadow:0 4px 14px rgba(10,10,10,.22)}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(10,10,10,.28)}
.btn--ghost{box-shadow:var(--shadow-card)}
.btn--ghost:hover{box-shadow:var(--shadow-hover)}
.livepill{padding:9px 15px}
.tbtn{border-radius:999px}
.tbtn.on{background:var(--grad-ink);box-shadow:0 3px 10px rgba(10,10,10,.2)}
.tsearch{border-radius:999px;height:28px;padding:0 13px}
.fsel{border-radius:999px}
.toolbar{padding:9px 16px;row-gap:8px}
.page{overflow-x:hidden}
.tcount{position:sticky;right:0;background:linear-gradient(90deg,
  rgba(255,255,255,0) 0,var(--surface-2) 14px);padding-left:20px}

.legend{flex-wrap:wrap;row-gap:4px;justify-content:flex-end}
.legend>span{white-space:nowrap}
.crumb em{display:block;font-style:normal;color:var(--ink-faint);margin-top:2px}

/* ── Modals and drawers ──────────────────────────────────────────── */
.mbox{border-radius:20px}
.mstat{border-radius:14px}
.mfield input[type=number],.mfield textarea{border-radius:12px}
.mwarn{border-radius:14px}
.drawer__p{border-radius:24px 0 0 24px}
.pop{border-radius:18px}
.fld input{border-radius:12px}

/* ── Tone ────────────────────────────────────────────────────────── */
.stalebar{padding:11px 24px}
.totals{padding:11px 24px;gap:24px}
.exc{padding:13px 16px}
.empty{padding:64px 24px}
.gtab th:first-child{padding-left:24px}
.gtab td:first-child{padding-left:24px}

/* ══ SYSTEM RECONCILIATION ═════════════════════════════════════════
   A design review found the override block above was a skin, not a system:
   ufd-modern containers wrapped around budget-forecast internals, with 16
   font sizes, 9 radii, 19 off-whites and 6 accents fighting each other.
   This block collapses those to the reference scale. It is last so it wins,
   and the dense sheet interior is deliberately left alone. */

/* ── Type: nothing below the system's 10px floor ─────────────────
   Under 10px Poppins loses its counters — those are shapes, not words. */
.exc__k,.pill{font:500 10px var(--sans);letter-spacing:.5px;padding:3px 9px}
.sb-sec,.tgrp__lbl,.side__label,.fbar__l{font:500 10px var(--sans);letter-spacing:1.5px}
.tw__m,.dchart__y span,.dchart__x span,.drow span,.inbox__age,
.act__d,.act__v,.mstat s,.rec s{font:400 10px var(--meta)}
.grid tr.main .gh s{font:500 10px var(--sans);letter-spacing:.8px}
.gtab th{font:500 10px var(--meta);letter-spacing:1.4px;text-transform:uppercase;
  color:var(--ink-mute)}
.leads u,.gmeta u,.wk i,.grid thead th .yr,.grid thead th .dt{font-size:10px}
.grid thead th .dt{font-size:9.5px}

/* ── Radii: nine values become four ──────────────────────────────── */
:root{--r-chip:999px;--r-sm:12px;--r-md:20px;--r-lg:24px}
.card,.dcard,.kpi,#toolcard,#gridcard,.pop,.mbox{border-radius:var(--r-md)}
.sidebar,.drawer__p{border-radius:var(--r-lg)}
.snav,.mstat,.mwarn,.fld input,.mfield input,.mfield textarea,
.inbox__icon,.recgrid{border-radius:var(--r-sm)}
.btn,.pill,.pillgroup,.pillgroup button,.datepill,.livepill,.exc__k,.tbtn,
.side__chip,.fsel,.winnav,.inbox__btn,.exc__go,.mclose{border-radius:var(--r-chip)}

/* ── Tables were being sheared, not scrolled ─────────────────────
   Up to 29% of a table hidden with an invisible scrollbar reads as broken
   rather than scrollable. A gradient mask says "there is more". */
.card{overflow:visible}
#gridcard,#toolcard{overflow:hidden}
#toolcard{overflow:visible}
.card > .scroller{overflow-x:auto;position:relative;border-radius:0 0 var(--r-md) var(--r-md);
  scrollbar-width:thin;scrollbar-color:rgba(10,10,10,.2) transparent}
.card > .scroller::-webkit-scrollbar{height:8px}
.card > .scroller::-webkit-scrollbar-thumb{background:rgba(10,10,10,.18);
  border-radius:99px;border:2px solid transparent;background-clip:content-box}
.card > .scroller::after{content:"";position:sticky;right:0;top:0;float:right;
  width:52px;height:100%;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,0),var(--surface-2))}

/* ── KPI row: monochrome, colour means direction only ────────────── */
.kpi__trend i{display:none}
.kpi__trend{background:rgba(10,10,10,.03);color:var(--ink-4);white-space:nowrap;
  font:500 11px var(--sans)}
.kpi__trend.up{background:rgba(63,143,79,.12);color:#2e6b3a}
.kpi__trend.down{background:rgba(196,48,43,.10);color:var(--neg)}
.kpi__trend.warn{background:rgba(217,150,46,.14);color:#8f6110}
/* Unit on its own line — inline was wrapping "95.3% of / demand". */
.kpi__value i{display:block;font:400 14px var(--sans);color:var(--ink-mute);
  margin:6px 0 0;letter-spacing:0}

/* ── Coverage bars: a 100% mark, so 130% and 217% differ ─────────── */
.bar{position:relative;height:14px;border-radius:999px;background:rgba(10,10,10,.05);
  overflow:visible}
.bar::after{content:"";position:absolute;left:66.6%;top:-2px;bottom:-2px;width:1px;
  background:rgba(10,10,10,.22)}
.bar i{height:8px;margin:3px 0;border-radius:999px;
  background:linear-gradient(90deg,#2e6b3a,#3f8f4f)}
.bar i.over{background:linear-gradient(90deg,#9a5a00,#d9962e)}
.bar i.under{background:linear-gradient(90deg,#7a2218,#c4302b)}

/* ── The primary action should look primary ──────────────────────── */
.exc__go{font:600 12px var(--sans);color:#fafaf6;background:var(--grad-ink);
  padding:9px 18px;box-shadow:0 2px 8px rgba(10,10,10,.16)}
.exc__go:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(10,10,10,.24);
  color:#fafaf6}
/* A ghost button needs a ground, not a shadow, on a white card. */
.btn--ghost{background:rgba(10,10,10,.05);box-shadow:none;color:var(--ink)}
.btn--ghost:hover{background:var(--ink);color:#fafaf6;box-shadow:none}

/* ── Long prose in a list needs a measure ────────────────────────── */
.inbox__meta,.exc__t span{max-width:74ch;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden}

/* ── The sidebar was slicing its last section in half ────────────── */
.sidebar__nav{padding-bottom:12px;
  mask-image:linear-gradient(180deg,#000 calc(100% - 20px),transparent)}
.sidebar__foot{margin-top:auto}

/* ── Table headers should recede, and rows should respond ────────── */
.gtab tbody tr:hover td{background:#faf9f6}
.gtab a{color:var(--ink);font-weight:600;text-decoration:none}
.gtab a:hover{color:var(--s-forecast);text-decoration:underline}

/* ══ MODALS ════════════════════════════════════════════════════════
   These rules were missing entirely. Every modal — cell detail, chart,
   change log, record drawer, motherstock lifecycle, the lead-time
   confirmation — was being built and appended correctly and then rendered
   position:static, unstyled, below the fold of a body{overflow:hidden}
   page. So double-click, right-click and every table row click did nothing
   VISIBLE, while a DOM test could still read their contents and pass.
   That is why this looked broken no matter how many times the event
   handling was fixed: the event handling was not the problem. */
.mwrap{position:fixed;inset:0;z-index:600;display:flex;align-items:center;
  justify-content:center;background:rgba(24,23,20,.34);padding:24px;
  animation:mfade .14s ease-out}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.mbox{width:min(880px,94vw);max-height:88vh;background:var(--surface-2);
  border-radius:var(--r-md,20px);box-shadow:0 24px 64px rgba(10,10,10,.28);
  display:flex;flex-direction:column;overflow:hidden;
  animation:mrise .16s cubic-bezier(.2,.7,.3,1)}
@keyframes mrise{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.mbox__h{display:flex;align-items:flex-start;gap:14px;flex:none;
  padding:20px 24px 10px}
.mbox__h h4{margin:0;font:600 17px var(--sans);color:var(--ink);letter-spacing:-.3px}
.mbox__h .sub{margin-top:3px;font:400 12px var(--sans);color:var(--ink-mute)}
.mbox__h .sp{flex:1}
.mbox__b{flex:1;min-height:0;overflow:auto;padding:4px 24px 24px}
.mclose{border:0;background:rgba(10,10,10,.05);cursor:pointer;width:30px;height:30px;
  color:var(--ink-4);font-size:15px;line-height:1;flex:none;display:grid;
  place-items:center}
.mclose:hover{background:var(--ink);color:#fafaf6}
/* The stat strip: labels are <s>, which must not render struck through. */
.mstat s,.rec s{text-decoration:none}
.mbox__b .gtab{width:100%}

/* ── The change log ──────────────────────────────────────────────── */
.chg{display:grid;grid-template-columns:66px minmax(0,1fr) auto auto;gap:12px;
  align-items:center;padding:11px 0;border-bottom:1px solid var(--hairline)}
.chg:last-child{border-bottom:0}
.chg__w{font:600 11px var(--grid);color:var(--ink-3)}
.chg__n{font:500 11.5px var(--sans);color:var(--ink-4);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.chg__v{font:600 12.5px var(--grid);font-variant-numeric:tabular-nums;white-space:nowrap}
.chg__v s{color:var(--ink-faint);font-weight:400;margin-right:8px}
.chg__v b{color:var(--s-forecast)}
.chg__u{border:0;background:rgba(10,10,10,.05);cursor:pointer;color:var(--ink-4);
  font:500 11px var(--sans);padding:5px 12px;border-radius:999px}
.chg__u:hover{background:var(--neg);color:#fff}
/* The edit-count badge on the toolbar button. */
.chgbtn{position:relative}
.chgbtn b{position:absolute;top:-4px;right:-4px;min-width:15px;height:15px;
  border-radius:99px;background:var(--s-forecast);color:#fff;font:600 10px var(--meta);
  display:grid;place-items:center;padding:0 4px}

/* ── Cells the sheet protects, and cells you changed ─────────────── */
/* Both classes were applied by drawGrid and had no rules, so the legend
   counted 99 protected cells and drew none of them. */
.grid td.unreachable{background-image:repeating-linear-gradient(135deg,
  transparent,transparent 3px,rgba(10,10,10,.055) 3px,rgba(10,10,10,.055) 6px);
  cursor:not-allowed}
.grid td.dirty{color:var(--s-forecast);font-weight:700;position:relative}
.grid td.dirty::after{content:"";position:absolute;left:6px;right:6px;bottom:3px;
  height:2px;border-radius:2px;background:var(--s-forecast);opacity:.55}
/* This never matched: a doubled .grid descendant. */
.grid td.c.edit:hover{background:rgba(42,111,143,.14);cursor:cell}
</style></head>
