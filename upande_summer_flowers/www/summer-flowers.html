            <button class="tbtn" id="t-csv" data-tip="Download CSV"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><path d="M12 15V3"/></svg></button>
            <button class="tbtn" id="t-focus" data-tip="Focus mode"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
            <button class="tbtn" id="t-print" data-tip="Print"><svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg></button>
          </div>
          <div class="tgrp__lbl">Export</div>
        </div>
        <div class="tgrp">
          <div class="tgrp__row winnav">
            <button class="wbtn" id="w-prev" data-tip="Earlier weeks">‹</button>
            <button class="datepill" id="window">—</button>
            <button class="wbtn" id="w-next" data-tip="Later weeks">›</button>
          </div>
          <div class="tgrp__lbl">Period</div>
        </div>
        <div class="tgrp" style="flex:1;justify-content:flex-end;border:0">
          <span class="tcount" id="tcount"></span></div>
      </div>
    </div>
    <div class="card" id="gridcard"></div>
  </div>

  <div class="view" id="v-dashboard">
    <div class="kpi-grid" id="kpis"></div>
    <div id="dashbody"></div>
  </div>
  <div class="view" id="v-demand"><div id="demandbody"></div></div>
  <div class="view" id="v-plans"><div id="plansbody"></div></div>
  <div class="view" id="v-scenarios"><div id="scenbody"></div></div>
  <div class="view" id="v-motherstock"><div id="msbody"></div></div>
  <div class="view" id="v-plantings"><div id="plantbody"></div></div>
  <div class="view" id="v-blocks"><div id="blocksbody"></div></div>
  <div class="view" id="v-protocols"><div id="protobody"></div></div>

  <div class="pagefoot" id="pagefoot"></div>
</div>

<script>
const CSRF = "{{ frappe.session.csrf_token }}";
function api(fn, args) {
  return fetch("/api/method/upande_summer_flowers." + fn, {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json", "Accept": "application/json",
               "X-Frappe-CSRF-Token": CSRF },
    body: JSON.stringify(args || {}),
  }).then(r => r.json()).then(j => {
    if (j.exc || j.exception || j._server_messages) {
      // j.exc is a JSON-encoded string, so "\n" inside it is two characters
      // and splitting on a real newline never fired — users saw the whole
      // Frappe traceback. Prefer the server message the throw() actually set.
      let msg = "";
      try {
        const sm = JSON.parse(j._server_messages || "[]");
        if (sm.length) msg = (JSON.parse(sm[0]).message || sm[0]);
      } catch (_e) { /* fall through */ }
      if (!msg && j.exception) msg = String(j.exception).replace(/^\w*Error:\s*/, "");
      if (!msg) {
        const raw = String(j.exc).replace(/\\n/g, "\n");
        msg = raw.split("\n").filter(Boolean).pop() || "Something went wrong";
      }
      throw new Error(msg.replace(/<[^>]+>/g, "").trim());
    }
    return j.message;
  });
}
const $ = s => document.querySelector(s);
const fmt = n => (n === null || n === undefined) ? "—"
  : Math.round(Number(n)).toLocaleString("en-US");
const fmtMU = n => !n ? "0" : n >= 1e6 ? (n / 1e6).toFixed(2) + "M"
  : n >= 1e4 ? Math.round(n / 1e3) + "k" : Math.round(n).toLocaleString();
const pct = n => (n === null || n === undefined) ? "—" : Math.round(Number(n)) + "%";
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dmy = d => !d ? "—" : new Date(String(d).slice(0, 10) + "T00:00:00")
  .toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "2-digit" });

/* BOOT is the backend describing itself — statuses, permissions, currency,
   Desk routes. Nothing below may hardcode what it already carries. */
let BOOT = null, STATE = null, VIEW = "grid";   // the planner is the landing view
let FARM = "", VARIETY = "";
let LIVE = { version: null, on: true, failures: 0, saved: 0 };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3200);
}

/* ── Load ─────────────────────────────────────────────────────── */
function load() {
  return api("dashboard.state", { farm: FARM || null, variety: VARIETY || null })
    .then(s => { STATE = s; LIVE.version = s.version; draw(); })
    .catch(e => {
      $("#dashbody").innerHTML = `<div class="card"><div class="empty">
        <b>Could not load the dashboard</b>${esc(e.message)}</div></div>`;
    });
}

/* ── Live ─────────────────────────────────────────────────────────
   The dashboard is derived from protocols, demand, plans, plantings and
   motherstock batches. Any of them moving makes what is on screen wrong, and
   the person who moved it is usually not the person looking at this tab.

   A counter poll rather than a socket: the realtime process is optional on a
   Frappe bench, whereas two cache reads always answer. */
const POLL_MS = 15000;
let pollTimer = null;
function startLive() {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(tick, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
  addEventListener("focus", () => { if (!document.hidden) tick(); });
}
function tick() {
  if (document.hidden || !LIVE.on) return;
  return api("live.dashboard_version").then(r => {
    LIVE.failures = 0;
    if (LIVE.version === null) { LIVE.version = r.version; drawLive(); return; }
    if (r.version === LIVE.version) { drawLive(); return; }
    LIVE.version = r.version;
    const l = r.last || {};
    const mine = LIVE.saved && (Date.now() - LIVE.saved) < 6000;
    Promise.all([load()]).then(() => {
      drawLive();
      if (!mine && l.reason)
        toast(`${l.reason} changed${l.name ? " — " + l.name : ""}. Updated.`);
    });
  }).catch(() => { LIVE.failures += 1; drawLive(); });
}
function drawLive() {
  const el = $("#liveDot"); if (!el) return;
  const bad = LIVE.failures > 1;
  el.className = "livedot" + (bad ? " off" : LIVE.on ? " on" : " paused");
  el.title = bad ? "Cannot reach the server — showing the last state loaded"
    : LIVE.on ? `Live — watching protocols, demand, plans, plantings and motherstock (v${LIVE.version})`
    : "Live updates paused";
  $("#liveText").textContent = bad ? "offline" : LIVE.on ? "live" : "paused";
}

/* ── Draw ─────────────────────────────────────────────────────── */
const TITLES = {
  scenarios: ["Scenarios", "What happens when the tissue culture goes wrong"],
  grid: ["Planner", "Type the demand; the plan follows"],
  dashboard: ["Dashboard", "The programme at a glance"],
  demand: ["Registers", "What the market has asked for"],
  plans: ["Production Plans", "What will be grown, and whether it covers demand"],
  motherstock: ["Motherstock", "Cuttings, tissue culture and the dates they hinge on"],
  plantings: ["Plantings", "What is standing on the ground"],
  blocks: ["Blocks", "Bed capacity and how much of it is used"],
  protocols: ["Protocols", "The growing recipe, per variety and farm"],
};
function setTitle() {
  const [t, e] = TITLES[VIEW] || TITLES.dashboard;
  $("#pagetitle").textContent = t;
  $("#eyebrow").textContent = e;
}
function draw() {
  if (!STATE) return;
  setTitle();
  const T = STATE.totals;
  drawFilters();
  if (VIEW === "grid") { drawGrid(); drawFoot(); return; }
  ({ dashboard: drawDash, demand: drawDemand, plans: drawPlans,
     motherstock: drawMotherstock, plantings: drawPlantings,
     blocks: drawBlocks, protocols: drawProtocols,
     scenarios: drawScenarios }[VIEW] || drawDash)();
  drawFoot();
}
function drawFoot() {
  const w = STATE.week;
  $("#pagefoot").innerHTML = `<span>Week ${w.week} of ${w.year}</span><span>·</span>
    <span>${STATE.plans.length} plans · ${STATE.plantings.length} plantings ·
    ${STATE.protocols.length} protocols</span><span>·</span>
    <span>updated ${esc(String(STATE.generated).slice(11, 16))}</span>`;
}

/* Tone is inferred from the Select's own wording, so a status added in Desk
   still renders rather than vanishing into grey. */
function statusPill(status) {
  if (!status) return "";
  const s = String(status);
  const cls = /^(Active|Approved|Producing|Productive|Posted)/i.test(s) ? "ok"
    : /^(Rejected|Retired|Expired|Uprooted)/i.test(s) ? "bad"
    : /^(Draft|Planned|Fallow|Pending)/i.test(s) ? "mute" : "info";
  return `<span class="pill ${cls}">${esc(s)}</span>`;
}

function card(title, crumb, body, action) {
  return `<div class="card">
    <div class="card__head"><h3>${title}</h3>
      ${crumb ? `<span class="crumb">${crumb}</span>` : ""}
      <div class="sp"></div>${action || ""}</div>
    <div class="scroller">${body}</div></div>`;
}
const emptyRow = n => `<tr><td colspan="${n}"><em>Nothing recorded yet.</em></td></tr>`;
const link = (dt, name, label) => {
  const base = (BOOT && BOOT.routes && BOOT.routes[dt]) || "";
  return base ? `<a href="${base}/${encodeURIComponent(name)}" target="_blank">${
    esc(label || name)}</a>` : esc(label || name);
};

/* ── Dashboard ───────────────────────────────────────────────── */
function drawDash() {
  const T = STATE.totals, cur = (BOOT && BOOT.currency) || "";
  const kpis = [
    ["Demand", fmtMU(T.demand_stems), "stems", "#2a6f8f", `${fmtMU(T.firm_stems)} firm`],
    ["Coverage", pct(T.coverage_pct), "of demand",
     T.coverage_pct >= 100 ? "#3f8f4f" : "#c4302b",
     `${fmtMU(T.production_stems)} stems planned`],
    ["New beds", fmt(T.new_beds), "beds", "#d9962e",
     `${fmt(T.plantings)} plantings standing`],
    ["Tissue culture", cur + " " + fmt(T.tc_cost), "", "#c8515f",
     `${fmt(T.mother_plants)} mother plants`],
  ];
  $("#kpis").innerHTML = kpis.map(([l, v, u, acc, sub]) => `
    <div class="kpi" style="--acc:${acc}">
      <div class="kpi__label">${l}</div>
      <div class="kpi__value">${v}${u ? `<i>${u}</i>` : ""}</div>
      <div class="kpi__trend"><i></i>${sub}</div></div>`).join("");
  $("#dashbody").innerHTML = `<div class="dgrid">${excCard()}${actCard()}${monthCard()}</div>`;
}

/* Exceptions, as the taskwork inbox: a tinted icon square carries the
   severity, the action is a pill on the right. */
const EXC_ICON = {
  blocker: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
  warn: '<circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/>',
};
const EXC_TONE = { blocker: "hot", warn: "warn", info: "blue" };

function excCard() {
  const all = STATE.exceptions || [];
  const n = all.filter(a => a.level === "blocker").length;
  const body = all.length ? all.map(a => `<div class="inbox__row">
      <div class="inbox__icon ${EXC_TONE[a.level] || ""}">
        <svg viewBox="0 0 24 24">${EXC_ICON[a.level] || EXC_ICON.info}</svg></div>
      <div><div class="inbox__name">${esc(a.title)}</div>
        <div class="inbox__meta">${esc(a.text)}</div></div>
      <div class="inbox__age ${a.level === "blocker" ? "hot" : ""}">${
        a.level === "blocker" ? "Blocking" : a.level === "warn" ? "Review" : "Note"}</div>
      ${a.href ? `<a class="inbox__btn ghost" href="${esc(a.href)}" target="_blank">Open</a>`
        : `<span></span>`}</div>`).join("")
    : `<div class="inbox__row"><div class="inbox__icon ok">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
       <div><div class="inbox__name">Nothing blocking</div>
       <div class="inbox__meta">Every plan is approved and supplied, every protocol
       complete, and no tissue-culture date has slipped.</div></div>
       <div class="inbox__age"></div><span></span></div>`;
  return `<div class="dcard dcard--wide">
    <div class="dcard__h"><h4>Exceptions</h4><span class="grow"></span>
      ${n ? `<span class="pill bad">${n} blocking</span>` : ""}
      <span class="dcard__n">${all.length} to review</span></div>
    <div class="inbox" style="margin:0 -14px -8px">${body}</div></div>`;
}

/* What has to happen next, same component. */
const ACT_ICON = {
  "Order TC": '<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>',
  "TC arrives": '<path d="M21 16V8a2 2 0 0 0-1-1.7l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.7l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/>',
  "Mothers ready": '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  "Renew TC": '<path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>',
  Stick: '<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9V6a5 5 0 0 1 10 0v3"/>',
  Plant: '<path d="M12 22V9"/><path d="M12 9C12 5 9 2 5 2c0 4 3 7 7 7Z"/><path d="M12 9c0-4 3-7 7-7 0 4-3 7-7 7Z"/>',
  Pinch: '<path d="M8 6 20 18"/><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8 18 20 6"/>',
  Uproot: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>',
};

function actCard() {
  const acts = STATE.actions || [];
  const late = acts.filter(a => a.overdue);
  const rows = acts.slice(0, 14).map(a => {
    const tone = a.overdue ? "hot" : a.days <= 14 ? "warn" : "";
    const when = a.overdue ? `${-a.days}d late`
      : a.days <= 7 ? "this week" : `in ${Math.round(a.days / 7)}w`;
    return `<a class="inbox__row" href="${esc(a.href)}" target="_blank">
      <div class="inbox__icon ${tone}"><svg viewBox="0 0 24 24">${
        ACT_ICON[a.action] || ACT_ICON.Plant}</svg></div>
      <div><div class="inbox__name">${esc(a.action)} · ${esc(a.subject)}</div>
        <div class="inbox__meta">W${a.week}/${String(a.year).slice(-2)} — ${
        esc(a.what)}</div></div>
      <div class="inbox__qty">${a.qty ? fmt(a.qty) : ""}${
        a.qty ? `<small>${esc(a.unit || "")}</small>` : ""}</div>
      <div class="inbox__age ${tone}">${when}</div></a>`;
  }).join("");
  return `<div class="dcard dcard--wide">
    <div class="dcard__h"><h4>Act by</h4><span class="grow"></span>
      ${late.length ? `<span class="pill bad">${late.length} overdue</span>` : ""}
      <span class="dcard__n">next 16 weeks${acts.length > 14
        ? ` · showing 14 of ${acts.length}` : ""}</span></div>
    <div class="inbox" style="margin:0 -14px -8px">${rows ||
      `<div class="inbox__row"><div class="inbox__icon ok">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
       <div><div class="inbox__name">Nothing due</div><div class="inbox__meta">
       No planting, sticking or ordering falls in the next 16 weeks.</div></div>
       <div></div><span></span></div>`}</div></div>`;
}

function monthCard() {
  const m = (STATE.months && STATE.months.months) || [];
  if (!m.length) return "";
  const hi = Math.max(1, ...m.map(x => Math.max(x.production, x.demand)));
  const W = 100, H = 132;
  const line = key => m.map((x, i) =>
    `${(m.length < 2 ? 0 : i / (m.length - 1) * W).toFixed(2)},${
      (H - x[key] / hi * (H - 6)).toFixed(1)}`).join(" ");
  const every = Math.max(1, Math.round(m.length / 12));
  return `<div class="dcard dcard--wide">
    <div class="dcard__h"><h4>Production against demand</h4><span class="grow"></span>
      <span class="dlg"><i style="background:#2a6f8f"></i>Production</span>
      <span class="dlg"><i style="background:#8a8780"></i>Demand</span>
      <span class="dcard__n">${esc(STATE.months.plan || "")}</span></div>
    <div class="dchart" style="padding-left:0">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polygon points="0,${H} ${line("production")} ${W},${H}" fill="#2a6f8f" opacity=".12"/>
      <polyline points="${line("production")}" fill="none" stroke="#2a6f8f"
        stroke-width="1.4" vector-effect="non-scaling-stroke"/>
      <polyline points="${line("demand")}" fill="none" stroke="#8a8780"
        stroke-width="1.4" stroke-dasharray="3 2" vector-effect="non-scaling-stroke"/>
    </svg><div class="dchart__x">${m.map((x, i) => i % every ? "" :
      `<span>${esc(x.label)}</span>`).join("")}</div></div></div>`;
}

/* ══ The spreadsheet ═══════════════════════════════════════════════
   One week per column, the Demand row typed into directly. Everything else
   is derived from the Production Plan and read-only — the grid never invents
   a number the documents do not already hold. */
let GRID = null, RANGE = { year: null, week: null, count: 32 };
let CLOSED = {}, SEEDED = false, DENS = "normal", QUERY = "";
let SEL = [], ANCHOR = null, SCROLL = 0, FIRSTPAINT = true;
/* Every edit this session: key -> {before, after, ...}. Kept client-side so
   the sheet can show what moved without a second round trip, and so a wrong
   number can be put back without hunting through document history. */
const EDITS = new Map();
const ekey = (d, y, w) => d + "|" + y + "|" + w;
/* Three tables, one week axis. Splitting them into separate sheets would
   lose the column alignment that makes the offsets readable, so they share
   the axis and you switch which one is on screen. */
let TABLE = "demand";
const TABLES = {
  demand:  { label: "Demand",  rows: ["stick", "plant"],
             note: "what the market asked for, and the work it creates" },
  planned: { label: "Planned", rows: ["production", "variance", "cumulative", "area"],
             note: "what the approved plan will cut" },
  actual:  { label: "Actual",  rows: ["actual", "actual_var", "production"],
             note: "what was really cut, against the plan" },
};
let SHOW = { production: true, variance: true, cumulative: false,
             stick: true, plant: true, area: false,
             actual: true, actual_var: true };
const DETAIL_ICON = {
  actual: '<path d="M4 19h16"/><rect x="6" y="9" width="4" height="8"/><rect x="14" y="5" width="4" height="12"/>',
  actual_var: '<path d="M4 12h16"/><path d="M8 8l-4 4 4 4"/><path d="M16 8l4 4-4 4"/>',
  production: '<polyline points="20 6 9 17 4 12"/>',
  variance: '<path d="M12 2v20M2 12h20"/>',
  cumulative: '<path d="M3 3v18h18"/><polyline points="7 14 11 10 15 13 21 6"/>',
  stick: '<rect x="3" y="9" width="18" height="12" rx="2"/><path d="M7 9V6a5 5 0 0 1 10 0v3"/>',
  plant: '<path d="M12 22V9"/><path d="M12 9C12 5 9 2 5 2c0 4 3 7 7 7Z"/><path d="M12 9c0-4 3-7 7-7 0 4-3 7-7 7Z"/>',
  area: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/>',
};
const DETAIL_TIP = {
  actual: "Actual — stems really cut",
  actual_var: "Actual vs plan — over or under", production: "Planned harvest", variance: "Variance",
  cumulative: "Cumulative variance", stick: "Cuttings to stick",
  plant: "Beds to plant", area: "Area standing" };

function loadGrid(quiet) {
  return api("grid.week_grid", {
    year: RANGE.year, week: RANGE.week, weeks: RANGE.count,
    farm: FARM || null, variety: VARIETY || null,
  }).then(g => {
    GRID = g;
    RANGE.year = g.start.year; RANGE.week = g.start.week; RANGE.count = g.count;
    if (quiet) FIRSTPAINT = false;
    if (VIEW === "grid") drawGrid();
  }).catch(e => {
    $("#gridcard").innerHTML = `<div class="empty"><b>Could not load the planner</b>${
      esc(e.message)}</div>`;
  });
}

const gRow = (g, k) => (g.rows || []).find(r => r.key === k);
/* A week no new planting can reach. The server decides the same thing on
   save; this is only so the sheet can say so before you type. */
function unreachable(g, col) {
  if (!g.lead_weeks) return false;
  // The axis is consecutive weeks, so the gap between two column indices is
  // the number of weeks between them — no 52/53 arithmetic to get wrong.
  const idxNow = GRID.weeks.findIndex(
    c => c.year === GRID.now.year && c.week === GRID.now.week);
  const idx = GRID.weeks.indexOf(col);
  if (idxNow < 0 || idx < 0) return false;
  const prod = gRow(g, "production");
  if (prod && prod.values[idx]) return false;     // already growing into it
  const out = idx - idxNow;
  return out >= 0 && out < g.lead_weeks;
}
function gVisible() {
  let gs = (GRID.groups || []);
  if (QUERY) {
    const q = QUERY.toLowerCase();
    gs = gs.filter(g => (g.name + " " + g.sub).toLowerCase().includes(q));
  }
  return gs;
}
function fmtCell(v, kind) {
  if (v == null || v === 0) return kind === "int" && v === 0 ? "0" : "";
  if (kind === "area") return Number(v).toFixed(2);
  if (kind === "bed") return String(Math.round(v));
  return Math.round(v).toLocaleString("en-US");
}

function drawDetailButtons() {
  const keys = TABLES[TABLE].rows;
  $("#detailrow").innerHTML = keys.map(k =>
    `<button class="tbtn${SHOW[k] ? " on" : ""}" data-show="${k}" data-tip="${
      esc(DETAIL_TIP[k])}"><svg viewBox="0 0 24 24">${DETAIL_ICON[k]}</svg></button>`).join("");
  $("#detailrow").querySelectorAll("[data-show]").forEach(b =>
    b.addEventListener("click", () => { SHOW[b.dataset.show] = !SHOW[b.dataset.show]; drawGrid(); }));
}

function sparkline(planRaw, otherRaw, idxNow) {
  // A gap in a demand series is a zero, not a missing reading. Treating it as
  // missing left a stub floating at one edge.
  const plan = (planRaw || []).map(v => v || 0);
  const other = (otherRaw || []).map(v => v || 0);
  const n = plan.length;
  if (n < 2) return "";
  const all = plan.concat(other);
  if (!all.some(v => v)) return "";
  const hi = Math.max(...all), lo = Math.min(...all, 0), rng = hi - lo || 1;
  const W = 100, H = 26, PAD = 2;
  const x = i => (i / (n - 1) * (W - 2 * PAD) + PAD).toFixed(1);
  const y = v => (H - PAD - (v - lo) / rng * (H - 2 * PAD - 1)).toFixed(1);
  const runs = vals => [vals.map((v, i) => [i, v])];
  const uid = "sp" + (sparkline.n = (sparkline.n || 0) + 1);
  let s = `<defs><linearGradient id="${uid}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="var(--s-forecast)" stop-opacity=".26"/>
    <stop offset="100%" stop-color="var(--s-forecast)" stop-opacity="0"/></linearGradient></defs>`;
  runs(plan).forEach(seg => {
    const d = seg.map(([i, v], k) => `${k ? "L" : "M"}${x(i)} ${y(v)}`).join("");
    if (seg.length > 1) s += `<path d="${d}L${x(seg[seg.length - 1][0])} ${H - PAD}L${
      x(seg[0][0])} ${H - PAD}Z" fill="url(#${uid})" stroke="none"/>`;
    s += `<path d="${d}" fill="none" stroke="var(--s-forecast)" stroke-width="1.3"
      stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  runs(other).forEach(seg => {
    const d = seg.map(([i, v], k) => `${k ? "L" : "M"}${x(i)} ${y(v)}`).join("");
    s += `<path d="${d}" fill="none" stroke="var(--s-actual)" stroke-width="1.4"
      stroke-linejoin="round" stroke-linecap="round" opacity=".8"/>`;
  });
  if (idxNow > 0 && idxNow < n) s += `<line x1="${x(idxNow)}" y1="1" x2="${x(idxNow)}"
    y2="${H - 1}" stroke="var(--signal)" stroke-width=".9" stroke-dasharray="1.5 1.5"
    opacity=".55"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${s}</svg>`;
}

function drawGrid() {
  if (!GRID) return;
  drawDetailButtons();
  const cols = GRID.weeks, groups = gVisible();
  const w0 = cols[0], w1 = cols[cols.length - 1];
  $("#window").textContent = `W${w0.week}/${String(w0.year).slice(-2)} — ${GRID.count} weeks`;
  $("#tcount").textContent = `${groups.length} registers · ${cols.length} weeks`;
  if (!groups.length) {
    $("#gridcard").innerHTML = `<div class="empty"><b>No demand registers</b>
      Create a Summer Flower Market Demand for a variety and farm to start planning.</div>`;
    return;
  }
  if (!SEEDED) { groups.forEach((_, i) => { CLOSED["g" + i] = false; }); SEEDED = true; }

  const nowKey = GRID.now.year * 100 + GRID.now.week;
  const idxNow = cols.findIndex(c => c.year === GRID.now.year && c.week === GRID.now.week);
  const isPast = i => cols[i].year * 100 + cols[i].week < nowKey;
  const cellCls = i => i === idxNow ? "nowcol" : isPast(i) ? "past" : "";

  // Months give the time axis a rhythm: a band you can count across instead of
  // 32 interchangeable columns. Every cell below carries the same two classes.
  const months = [];
  cols.forEach((c, i) => {
    const key = c.year + "-" + c.month;
    const last = months[months.length - 1];
    if (last && last.key === key) { last.span += 1; last.cols.push(i); }
    else months.push({ key, label: c.month, year: c.year, span: 1, cols: [i] });
  });
  const band = {}, mstart = {};
  months.forEach((m, mi) => {
    m.cols.forEach(i => { if (mi % 2) band[i] = true; });
    mstart[m.cols[0]] = true;
  });
  const colCls = i => (band[i] ? " mb" : "") + (mstart[i] ? " ms" : "");

  const head = `<thead>
    <tr class="morow">
      <th class="idx mo"></th><th class="gh mo"></th><th class="lbl mo"></th>
      <th class="spk mo"></th><th class="grd mo"></th>
      ${months.map((m, mi) => `<th class="mo${mi % 2 ? " mb" : ""}${
        m.cols.includes(idxNow) ? " now" : ""}" colspan="${m.span}">${esc(m.label)}${
        m.span > 2 ? ` <span style="opacity:.55">${String(m.year).slice(-2)}</span>` : ""
      }</th>`).join("")}
    </tr>
    <tr>
      <th class="idx"></th><th class="gh">Variety</th><th class="lbl">Row</th>
      <th class="spk">Trend</th><th class="grd"></th>
      ${cols.map((c, i) => `<th class="c${i === idxNow ? " now" : ""}${colCls(i)}"
        title="Week ${c.week}, ${c.year} · ${esc(c.span)}">${c.week}<i class="yr">${
        String(c.year).slice(-2)}</i><i class="dt">${esc(c.start_label)}</i></th>`).join("")}
    </tr></thead>`;
  const blank = () => `<tr class="fill"><td class="idx"></td><td class="gh"></td>
    <td class="lbl"></td><td class="spk"></td><td class="grd"></td>${
    cols.map((_c, i) => `<td class="${colCls(i).trim()}"></td>`).join("")}</tr>`;

  const body = groups.map((g, gi) => {
    const gid = "g" + gi, open = !CLOSED[gid];
    const dem = gRow(g, "demand");
    const prod = gRow(g, "production");
    const cells = (row, editable) => row.values.map((v, i) => {
      const can = editable && GRID.can_edit;
      // Coordinates on every cell so any of them can be opened; only the
      // editable row also gets the .edit class that lets you type.
      const attr = ` data-demand="${esc(g.key)}" data-week="${cols[i].week}"` +
        ` data-year="${cols[i].year}" data-val="${v == null ? "" : v}"` +
        (can ? "" : ` data-cell="${esc(row.key)}"`);
      // Hue is spent on one thing only: being short. A positive variance is
      // information, not an alarm, so it recedes instead of going green.
      let tone = "";
      if (row.tone === "signed" && v) tone = v < 0 ? " short" : " over";
      const firm = row.firm && row.firm[i] ? " firm" : "";
      const ed = can ? EDITS.get(ekey(g.key, cols[i].year, cols[i].week)) : null;
      const dirty = ed ? " dirty" : "";
      const tip = ed ? ` title="was ${ed.before == null ? "empty" : fmt(ed.before)}"` : "";
      // Inside the lead time with nothing already growing into it: no planting
      // can reach this week, so hatch it rather than let someone type into a
      // number that can never be delivered.
      const reach = can && unreachable(g, cols[i]) ? " unreachable" : "";
      return `<td class="c ${cellCls(i)}${colCls(i)}${tone}${firm}${dirty}${reach}${
        can ? " edit" : ""}"${attr}${tip}>${fmtCell(v, row.fmt)}</td>`;
    }).join("");



    // A gutter row rather than another hairline: four varieties should read as
    // four blocks, not one twenty-row wall.
    const gap = gi ? `<tr class="gap"><td class="idx"></td><td class="gh"></td>
      <td class="lbl"></td><td class="spk"></td><td class="grd"></td>${
      cols.map(() => "<td></td>").join("")}</tr>` : "";
    const main = gap + `<tr class="main t1${gi ? " gtop" : ""}" data-gid="${gid}">
      <td class="idx">${gi + 1}</td>
      <td class="gh" title="${esc(g.sub)} · ${esc(g.protocol || "")}">
        <span class="tw-caret"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${open
          ? '<polyline points="6 9 12 15 18 9"/>' : '<polyline points="9 6 15 12 9 18"/>'
        }</svg></span>${esc(g.name)}<s>${esc(g.sub)}</s></td>
      <td class="lbl" title="${esc(dem.help || "")}">${esc(dem.label)}</td>
      <td class="spk" data-g="${esc(g.key)}"
        title="Right-click (or double-tap) for demand against production">${
        sparkline(dem.values, prod && prod.values, idxNow)}</td>
      <td class="grd"></td>${cells(dem, dem.editable)}</tr>`;
    if (!open) return main;

    const detail = TABLES[TABLE].rows.filter(k => SHOW[k] !== false).map(k => {
        const r = gRow(g, k);
        if (!r) return "";
        // Production and variance answer the question; the rest is workings.
        const tier = ["production", "variance", "actual", "actual_var"].includes(k)
          ? "t2" : "t3";
        return `<tr class="ref ${tier} r-${k}" data-kid="${gid}">
          <td class="idx"></td><td class="gh"></td>
          <td class="lbl" title="${esc(r.help || "")}">${esc(r.label)}<em>${
            esc(r.meta || "")}</em></td>
          <td class="spk"></td><td class="grd"></td>${cells(r, false)}</tr>`;
      }).join("");
    return main + detail;
  }).join("");

  // Rebuild lives in exactly one place, and only appears when something is
  // actually out of date. Per-row buttons meant four of them competing with
  // the numbers for the same few pixels.
  const stale = groups.filter(g => !g.plan || g.plan_stale);
  const bar = stale.length ? `<div class="stalebar">
      <b>${stale.length} plan${stale.length > 1 ? "s" : ""} out of date</b>
      <span>— the demand changed since ${stale.length > 1 ? "they were" : "it was"} built</span>
      <span class="sp"></span>
      <button id="stale-go">Rebuild ${stale.length > 1 ? "all" : ""}</button>
    </div>` : "";

  const hatched = groups.reduce((t, g) =>
    t + cols.filter(c => unreachable(g, c)).length, 0);
  $("#gridcard").innerHTML = `
    <div class="card__head"><h3>Planner</h3>
      <div class="pillgroup" id="tablepick">${Object.entries(TABLES).map(([k, t]) =>
        `<button data-table="${k}" class="${TABLE === k ? "on" : ""}">${t.label}</button>`
      ).join("")}</div>
      <span class="crumb">W${w0.week}/${String(w0.year).slice(-2)} – W${w1.week}/${
        String(w1.year).slice(-2)} · ${esc(w0.start_label)} – ${esc(w1.end_label)}
        <em>${esc(TABLES[TABLE].note)}</em></span>
      <div class="sp"></div>
      <div class="legend">
        ${hatched ? `<span title="A cutting stuck today first harvests weeks from now, so
          these weeks can only be served by something already in the ground."
          ><i style="background:repeating-linear-gradient(135deg,transparent,transparent 2px,
          rgba(10,10,10,.35) 2px,rgba(10,10,10,.35) 4px)"></i>${hatched} cells outside the lead time</span>` : ""}
        <span><i style="background:var(--s-forecast)"></i>Demand — type here</span>
        <span><i style="background:var(--s-actual)"></i>Production</span>
        <span><i style="background:var(--warn)"></i>Plant</span></div>
    </div>
    ${bar}
    <div class="scroller" id="gridScroll"><table class="grid nogrd d-${DENS}">${head}<tbody>${
      body}${Array.from({length: 16}, blank).join("")}</tbody></table></div>
    <div class="totals" id="totals"></div>`;
  document.querySelectorAll("[data-table]").forEach(b =>
    b.addEventListener("click", () => {
      // The toggles belong to the table, so they have to be rebuilt with it.
      TABLE = b.dataset.table; drawDetailButtons(); drawGrid();
    }));
  drawGridTotals();
  const cb = $("#t-changes");
  if (cb) cb.innerHTML = cb.innerHTML.replace(/<b>.*?<\/b>/, "")
    + (EDITS.size ? `<b>${EDITS.size}</b>` : "");
  restoreScroll(idxNow);
  bindGrid();
}

function drawGridTotals() {
  const t = GRID.totals || {}, sum = a => (a || []).reduce((x, v) => x + (v || 0), 0);
  $("#totals").innerHTML = [
    ["Demand in window", fmtMU(sum(t.demand)) + " stems"],
    ["Production", fmtMU(sum(t.production)) + " stems"],
    ["Cuttings to stick", fmtMU(sum(t.stick))],
    ["Beds to plant", fmt(sum(t.plant))],
  ].map(([k, v]) => `<div><small>${k}</small><b>${v}</b></div>`).join("");
}

/* Open on the first week that says anything, not on a run of empty columns. */
function restoreScroll(idxNow) {
  const e = $("#gridScroll"); if (!e) return;
  if (!FIRSTPAINT) { e.scrollLeft = SCROLL; return; }
  FIRSTPAINT = false;
  let first = -1;
  if (idxNow < 0) {           // today is off the horizon: fall back to the data
    gVisible().forEach(g => {
      const r = gRow(g, "demand");
      (r ? r.values : []).forEach((v, i) => { if (v && (first < 0 || i < first)) first = i; });
    });
  }
  const cw = parseFloat(getComputedStyle(document.documentElement)
    .getPropertyValue("--cell")) || 74;
  e.scrollLeft = SCROLL = Math.max(0, ((first >= 0 ? first : Math.max(0, idxNow)) - 1) * cw);
}

function bindGrid() {
  // drawGrid() replaces the whole card, so anything SEL/ANCHOR were holding is
  // now detached: the toolbar stayed enabled and would fire another write at
  // invisible cells using their pre-edit values.
  clearSel();
  const sc = $("#gridScroll");
  if (sc) {
    const seam = () => sc.classList.toggle("scrolled", sc.scrollLeft > 0);
    sc.addEventListener("scroll", () => { SCROLL = sc.scrollLeft; seam(); });
    seam();
  }
  document.querySelectorAll("tr.main .gh").forEach(td =>
    td.addEventListener("click", () => {
      const gid = td.closest("tr").dataset.gid;
      CLOSED[gid] = !CLOSED[gid]; drawGrid();
    }));
  const go = $("#stale-go");
  if (go) go.addEventListener("click", () => $("#t-rebuild").click());
  // One tap types. Two taps opens the cell in full. Shift-click still picks a
  // range for the toolbar's fill and nudge actions.
  syncTools();
}
function clearSel() {
  document.querySelectorAll("td.sel,td.anchor").forEach(t =>
    t.classList.remove("sel", "anchor"));
  SEL = []; ANCHOR = null;
}
function selectRange(a, b) {
  const row = a.closest("tr");
  if (b.closest("tr") !== row) return;
  const tds = [...row.querySelectorAll("td.edit")];
  const i = tds.indexOf(a), j = tds.indexOf(b);
  if (i < 0 || j < 0) return;
  document.querySelectorAll("td.sel").forEach(t => t.classList.remove("sel"));
  SEL = tds.slice(Math.min(i, j), Math.max(i, j) + 1);
  SEL.forEach(t => t.classList.add("sel"));
}
function syncTools() {
  const on = SEL.length > 0;
  ["t-fill", "t-up", "t-down", "t-clear"].forEach(id => {
    const el = $("#" + id); if (el) el.disabled = !on;
  });
}

function inlineEdit(td) {
  clearTimeout(TAP);
  if (td.querySelector("input")) return;
  const old = td.dataset.val === "" ? null : Number(td.dataset.val);
  td.classList.add("editing");
  td.innerHTML = `<input class="cellin" value="${old == null ? "" : old}">`;
  const inp = td.querySelector("input");
  inp.focus(); inp.select();
  let done = false;
  const finish = save => {
    if (done) return;
    done = true;
    td.classList.remove("editing");
    const raw = inp.value.trim();
    const v = raw === "" ? null : parseInt(raw.replace(/[^\d-]/g, ""), 10);
    td.innerHTML = "";
    if (save && (raw === "" ? old != null : v !== old && !isNaN(v))) {
      td.dataset.val = v == null ? "" : v;
      td.textContent = fmtCell(v, "int");
      saveCell(td, v, old);
    } else {
      td.textContent = fmtCell(old, "int");
    }
  };
  inp.addEventListener("blur", () => finish(!inp.dataset.abort));
  inp.addEventListener("keydown", e => {
    if (["Tab", "Enter", "ArrowUp", "ArrowDown"].includes(e.key)) inp.dataset.commit = "1";
  });
  inp.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); inp.blur(); }
    if (e.key === "Escape") { e.preventDefault(); finish(false); }
  });
}

function saveCell(td, v, before, force) {
  LIVE.saved = Date.now();
  const d = td.dataset.demand, y = +td.dataset.year, w = +td.dataset.week;
  return api("grid.set_demand_week", {
    demand: d, year: y, week: w, stems: v, force: force ? 1 : 0,
  }).then(() => {
    const k = ekey(d, y, w);
    const prior = EDITS.get(k);
    // Keep the ORIGINAL value across repeated edits of the same cell, and drop
    // the record entirely if it has been put back where it started.
    const origin = prior ? prior.before : (before === undefined ? null : before);
    if (origin === v) EDITS.delete(k);
    else EDITS.set(k, { demand: d, year: y, week: w, before: origin, after: v,
                        name: groupName(d) });
    toast("Saved");
    return loadGrid(true);
  }).catch(e => {
    // The server refuses a week no planting can reach. Explain, then let the
    // planner overrule it — they may know about stock the plan does not.
    if (/lead time/i.test(e.message)) return confirmForce(td, v, before, e.message);
    toast("Not saved: " + e.message);
    return loadGrid(true);
  });
}
const groupName = d => {
  const g = (GRID.groups || []).find(x => x.key === d);
  return g ? g.name + " · " + g.sub : d;
};

function confirmForce(td, v, before, why) {
  modal({
    title: "Not deliverable",
    sub: `Week ${td.dataset.week}/${td.dataset.year}`,
    body: `<div class="mwarn">${esc(why)}</div>
      <p style="font:400 11.5px var(--sans);color:var(--ink-4);line-height:1.6">
      Enter it anyway if this will be covered by stock, a bought-in crop, or a
      planting the register does not know about.</p>`,
    actions: `<button class="btn btn--ghost" data-act="cancel">Cancel</button>
      <button class="btn" data-act="force">Enter anyway</button>`,
    on: (act, close) => {
      close();
      if (act === "force") saveCell(td, v, before, true);
      else loadGrid(true);
    },
  });
}

function saveMany(cells, label) {
  if (!cells.length) return;
  LIVE.saved = Date.now();
  // Group by register: a selection can span varieties, and sending them all
  // under cells[0].demand wrote every one of them to the wrong document.
  const byDemand = {};
  cells.forEach(c => (byDemand[c.demand] = byDemand[c.demand] || []).push(c));
  return Object.entries(byDemand).reduce((chain, [demand, group]) =>
    chain.then(() => api("grid.fill_demand", { demand, cells: JSON.stringify(group) })
      .then(() => {
        // Record each one so it shows in the change log and can be undone.
        group.forEach(c => {
          const k = ekey(demand, c.year, c.week);
          const prior = EDITS.get(k);
          const origin = prior ? prior.before : c.before;
          if (origin === c.stems) EDITS.delete(k);
          else EDITS.set(k, { demand, year: c.year, week: c.week,
                              before: origin, after: c.stems, name: groupName(demand) });
        });
      })), Promise.resolve())
    .then(() => { toast(`${label} ${cells.length} weeks`); return loadGrid(true); })
    .catch(e => { toast("Not saved: " + e.message); return loadGrid(true); });
}

function rebuild(demand) {
  toast("Rebuilding the plan…");
  return api("grid.rebuild_plan", { demand })
    .then(r => {
      toast(`${r.created ? "Built" : "Rebuilt"} ${r.plan} — coverage ${
        Math.round(r.coverage_pct || 0)}%, ${r.new_beds || 0} new beds`);
      return loadGrid(true);
    })
    .catch(e => toast("Could not rebuild: " + e.message));
}



/* ── Keyboard ────────────────────────────────────────────────────
   A sheet you cannot type down is not a sheet. Tab and the arrows move
   between editable cells, Enter commits and drops a row, Escape backs out,
   and Ctrl+Z reverses the last edit. */
function cellAt(row, col) {
  const rows = [...document.querySelectorAll("tr.t1")];
  const r = rows[row];
  if (!r) return null;
  const cells = [...r.querySelectorAll("td.edit")];
  return cells[col] || null;
}
function cellPos(td) {
  const rows = [...document.querySelectorAll("tr.t1")];
  const row = rows.indexOf(td.closest("tr"));
  const col = [...td.closest("tr").querySelectorAll("td.edit")].indexOf(td);
  return { row, col };
}
function moveCell(td, dr, dc) {
  clearTimeout(TAP);
  const { row, col } = cellPos(td);
  const next = cellAt(row + dr, col + dc);
  if (!next) return false;
  clearSel(); ANCHOR = next; next.classList.add("anchor", "sel"); SEL = [next];
  next.scrollIntoView({ block: "nearest", inline: "nearest" });
  inlineEdit(next);
  return true;
}
function gridKeys(e) {
  if (VIEW !== "grid") return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
    e.preventDefault(); undoLast(); return;
  }
  const td = ANCHOR;
  if (!td) return;
  const inp = td.querySelector("input");
  const nav = { ArrowRight: [0, 1], ArrowLeft: [0, -1], ArrowUp: [-1, 0],
                ArrowDown: [1, 0], Enter: [1, 0] };
  if (e.key === "Tab") {
    e.preventDefault();
    if (inp) { inp.dataset.commit = "1"; inp.blur(); }
    moveCell(td, 0, e.shiftKey ? -1 : 1);
    return;
  }
  if (nav[e.key]) {
    // Inside an open editor the arrows belong to the text caret; Enter and the
    // vertical arrows still move, because that is what a sheet does.
    if (inp && (e.key === "ArrowLeft" || e.key === "ArrowRight")) return;
    e.preventDefault();
    if (inp) { inp.dataset.commit = "1"; inp.blur(); }
    const [dr, dc] = nav[e.key];
    moveCell(td, dr, dc);
  }
}
function undoLast() {
  const list = [...EDITS.values()];
  const e = list[list.length - 1];
  if (!e) { toast("Nothing to undo"); return; }
  LIVE.saved = Date.now();
  api("grid.set_demand_week", { demand: e.demand, year: e.year, week: e.week,
                                stems: e.before, force: 1 })
    .then(() => { EDITS.delete(ekey(e.demand, e.year, e.week));
      toast(`Undone — W${e.week} back to ${e.before == null ? "empty" : fmt(e.before)}`);
      loadGrid(true); })
    .catch(err => toast("Could not undo: " + err.message));
}


/* ── Tap, double-tap ─────────────────────────────────────────────
   Taken from the rose budget sheet, which has always had this right for a
   reason I kept missing: the listeners live on `document`, and the editor
   does not open for 200ms.

   Both halves matter. Opening the editor on the first click replaces the
   cell's contents, and Chromium restarts its click counter when the target
   changes — so the second click arrives as detail:1 and no dblclick is ever
   fired. Waiting 200ms leaves the DOM untouched while the second click
   lands, so the browser counts it properly. Delegating to `document` means
   the handler survives every re-render, instead of being re-bound per cell.
   Right-click is kept as the guaranteed way in. */
let TAP = null;

document.addEventListener("click", e => {
  const td = e.target.closest("td.edit");
  if (!td) return;
  if (e.detail > 1) return;                 // the dblclick handler owns this
  if (e.shiftKey && ANCHOR) {
    clearTimeout(TAP); selectRange(ANCHOR, td); syncTools(); return;
  }
  clearSel(); ANCHOR = td; td.classList.add("anchor", "sel"); SEL = [td];
  syncTools();
  clearTimeout(TAP);
  TAP = setTimeout(() => inlineEdit(td), 200);
});

const openCellFrom = e => {
  // Any cell, not just the editable row. Binding this to td.edit meant a
  // double-click on Production, Variance, Stick, Plant or Actual did nothing
  // at all — which is most of the sheet.
  const td = e.target.closest("td.c[data-demand], td.c[data-cell]");
  if (!td) return;
  e.preventDefault();
  clearTimeout(TAP);
  const inp = td.querySelector("input");
  if (inp) { inp.dataset.abort = "1"; inp.blur(); }
  openCell(td);
};
document.addEventListener("dblclick", openCellFrom);
document.addEventListener("contextmenu", openCellFrom);

const openChartFrom = e => {
  const cell = e.target.closest("td.spk[data-g]");
  if (!cell) return;
  e.preventDefault();
  openChart(cell.dataset.g);
};
document.addEventListener("dblclick", openChartFrom);
document.addEventListener("contextmenu", openChartFrom);


/* ── Recording a cut ─────────────────────────────────────────────
   Production is projected per flush on each planting, so an actual harvest
   is booked against those same rows rather than into a parallel table. Give
   a total and it splits across the flushes due that week in proportion to
   what each was projected to yield. */
function openHarvest(demandName, year, week) {
  const g = (GRID.groups || []).find(x => x.key === demandName);
  if (!g) return;
  api("grid.harvest_rows", { variety: g.variety, farm: g.sub, year, week })
    .then(r => {
      const rows = r.rows || [];
      const body = rows.length ? `
        <div class="mstat">
          <div><s>Projected</s><b>${fmt(r.projected)}</b></div>
          <div><s>Recorded</s><b>${fmt(r.actual)}</b></div>
          <div><s>Flushes due</s><b>${rows.length}</b></div>
          <div><s>Difference</s><b class="${r.actual && r.actual < r.projected
            ? "neg" : ""}">${r.actual ? fmt(r.actual - r.projected) : "—"}</b></div>
        </div>
        <div class="mfield"><label>Stems cut</label>
          <input type="number" id="h-stems" value="${r.actual || ""}"
            placeholder="total for the week"></div>
        <p style="font:400 11px var(--sans);color:var(--ink-faint);line-height:1.6;
          margin:0 0 14px">Split across the ${rows.length} flush${
          rows.length > 1 ? "es" : ""} due this week, in proportion to what each
          was projected to yield.</p>
        <table class="gtab"><thead><tr><th>Block</th><th class="n">Flush</th>
          <th class="n">Beds</th><th class="n">Projected</th>
          <th class="n">Recorded</th></tr></thead><tbody>${rows.map(x => `<tr>
          <td><b>${esc(x.block || "—")}</b></td><td class="n">F${x.flush_number}</td>
          <td class="n">${fmt(x.beds)}</td><td class="n">${fmt(x.projected_stems)}</td>
          <td class="n">${x.is_harvested ? fmt(x.actual_stems)
            : '<em style="color:var(--ink-faint)">not booked</em>'}</td></tr>`).join("")}
        </tbody></table>`
        : `<p style="font:400 12px var(--sans);color:var(--ink-4);line-height:1.6">
           Nothing is due to flush in this week for ${esc(g.name)}, so there is
           nothing to book a cut against. Check the Planned table for the weeks
           this variety actually harvests in.</p>`;

      modal({
        title: `Record harvest · ${g.name}`,
        sub: `${g.sub} · week ${week}/${year}`,
        body,
        actions: rows.length && r.can_write
          ? `<button class="inbox__btn" data-act="save">Book it</button>` : "",
        on: (act, close) => {
          if (act !== "save") return close();
          const v = parseInt(document.getElementById("h-stems").value, 10);
          if (isNaN(v) || v < 0) { toast("Enter the number of stems cut"); return; }
          close();
          LIVE.saved = Date.now();
          api("grid.record_harvest", { variety: g.variety, farm: g.sub,
                                       year, week, stems: v })
            .then(res => { toast(`Booked ${fmt(res.recorded)} stems across ${
              res.plantings} planting${res.plantings > 1 ? "s" : ""}`);
              loadGrid(true); })
            .catch(e => toast("Not saved: " + e.message));
        },
      });
      setTimeout(() => { const i = document.getElementById("h-stems"); if (i) i.select(); }, 40);
    }).catch(e => toast(e.message));
}

/* ── Modal ───────────────────────────────────────────────────── */
function modal({ title, sub, body, actions, on, wide }) {
  const el = document.createElement("div");
  el.className = "mwrap"; el.id = "mwrap";
  el.innerHTML = `<div class="mbox"${wide ? ' style="width:min(1040px,96vw)"' : ""}>
    <div class="mbox__h"><div><h4>${esc(title)}</h4>${
      sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>
      <div class="sp"></div>
      ${actions || ""}
      <button class="mclose" data-act="close">✕</button></div>
    <div class="mbox__b">${body}</div></div>`;
  document.body.appendChild(el);
  const born = Date.now();
  const close = () => { el.remove(); document.removeEventListener("keydown", esckey); };
  const esckey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", esckey);
  el.addEventListener("click", e => {
    // Ignore the trailing half of the double-tap that opened this.
    if (Date.now() - born < 400) return;
    if (e.target === el) return close();
    const a = e.target.closest("[data-act]");
    if (!a) return;
    if (a.dataset.act === "close") return close();
    if (on) on(a.dataset.act, close);
  });
  return { el, close };
}

/* Two taps on a cell: the week in full, with somewhere to type. */
function openCell(td) {
  const d = td.dataset.demand, y = +td.dataset.year, w = +td.dataset.week;
  // The Actual row is a different job: you are booking a cut, not forecasting.
  if (td.dataset.cell === "actual" || td.dataset.cell === "actual_var")
    return openHarvest(d, y, w);
  api("grid.cell_detail", { demand: d, year: y, week: w }).then(r => {
    const pw = r.plan_week || {};
    const ed = EDITS.get(ekey(d, y, w));
    const m = modal({
      title: groupName(d),
      sub: `Week ${w}/${y} · ${r.week.span}`,
      body: `
        <div class="mstat">
          <div><s>Demand</s><b>${fmt(r.demand.stems)}</b></div>
          <div><s>Production</s><b>${fmt(pw.production)}</b></div>
          <div><s>Variance</s><b class="${(pw.variance || 0) < 0 ? "neg" : ""}">${
            pw.variance == null ? "—" : (pw.variance > 0 ? "+" : "") + fmt(pw.variance)
          }</b></div>
          <div><s>Area</s><b>${pw.area_ha == null ? "—" : pw.area_ha.toFixed(2)} ha</b></div>
        </div>
        ${ed ? `<div class="mwarn">Changed this session — was <b>${
          ed.before == null ? "empty" : fmt(ed.before)}</b>.</div>` : ""}
        <div class="mfield"><label>Demand</label>
          <input type="number" id="m-stems" value="${r.demand.stems == null ? "" : r.demand.stems}"></div>
        <div class="mfield"><label>Firm</label>
          <input type="checkbox" id="m-firm" ${r.demand.is_firm ? "checked" : ""}>
          <span style="font:400 11px var(--sans);color:var(--ink-faint)">
            a committed order rather than a forecast</span></div>
        <div class="mfield" style="align-items:flex-start"><label>Note</label>
          <textarea id="m-note" rows="2" style="flex:1;border:1px solid var(--hairline);
            border-radius:6px;padding:9px 11px;font:400 11.5px var(--sans);outline:none"
            >${esc(r.demand.notes || "")}</textarea></div>
        ${pw.contributing ? `<div style="font:400 10.5px var(--sans);color:var(--ink-faint);
          margin-top:10px">Producing into this week: ${esc(pw.contributing)}</div>` : ""}
        ${(r.plantings || []).length ? `<div style="font:400 10.5px var(--sans);
          color:var(--ink-faint);margin-top:6px">Planted this week: ${
          r.plantings.map(b => `${esc(b.block || "unallocated")} (${b.beds} beds)`)
            .join(", ")}</div>` : ""}`,
      actions: `<button class="btn" data-act="save">Save</button>`,
      on: (act, close) => {
        if (act !== "save") return close();
        const raw = document.getElementById("m-stems").value.trim();
        const v = raw === "" ? null : parseInt(raw, 10);
        const firm = document.getElementById("m-firm").checked ? 1 : 0;
        const note = document.getElementById("m-note").value;
        close();
        LIVE.saved = Date.now();
        api("grid.set_demand_week", { demand: d, year: y, week: w, stems: v,
                                      is_firm: firm, notes: note })
          .then(() => {
            const k = ekey(d, y, w), prior = EDITS.get(k);
            const origin = prior ? prior.before : r.demand.stems;
            if (origin === v) EDITS.delete(k);
            else EDITS.set(k, { demand: d, year: y, week: w, before: origin,
                                after: v, name: groupName(d) });
            toast("Saved"); loadGrid(true);
          })
          .catch(e => toast("Not saved: " + e.message));
      },
    });
    setTimeout(() => { const i = document.getElementById("m-stems"); if (i) i.select(); }, 40);
  }).catch(e => toast(e.message));
}

/* The trend column, opened up. */
function openChart(key) {
  const g = (GRID.groups || []).find(x => x.key === key);
  if (!g) return;
  const cols = GRID.weeks;
  const series = [["demand", "Demand", "#2a6f8f"], ["production", "Production", "#3f8f4f"]]
    .map(([k, label, colour]) => {
      const r = gRow(g, k);
      return { k, label, colour, values: r ? r.values : cols.map(() => null) };
    });
  const all = series.flatMap(x => x.values).filter(v => v != null);
  const hi = Math.max(1, ...all);
  const W = 1000, H = 340, L = 56, R = 16, T = 16, B = 34, n = cols.length;
  const x = i => L + (n < 2 ? 0 : i / (n - 1) * (W - L - R));
  const y = v => H - B - (v || 0) / hi * (H - T - B);
  const step = Math.pow(10, Math.floor(Math.log10(hi / 4))) *
    (hi / 4 / Math.pow(10, Math.floor(Math.log10(hi / 4))) <= 2 ? 2 : 5);
  let gl = "", ax = "";
  for (let v = 0; v <= hi; v += step) {
    gl += `<line x1="${L}" y1="${y(v).toFixed(1)}" x2="${W - R}" y2="${y(v).toFixed(1)}"
      stroke="#f1efeb"/>`;
    ax += `<text x="${L - 8}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end"
      font-size="9" fill="#b5b2a9">${fmtMU(v)}</text>`;
  }
  const every = Math.max(1, Math.round(n / 20));
  cols.forEach((c, i) => {
    if (i % every) return;
    ax += `<text x="${x(i).toFixed(1)}" y="${H - 12}" text-anchor="middle"
      font-size="9" fill="#b5b2a9">${c.week}</text>`;
  });
  const paths = series.map(sr => {
    const pts = sr.values.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    const area = sr.k === "demand"
      ? `<polygon points="${L},${y(0)} ${pts} ${x(n - 1).toFixed(1)},${y(0)}"
         fill="${sr.colour}" opacity=".10"/>` : "";
    return area + `<polyline points="${pts}" fill="none" stroke="${sr.colour}"
      stroke-width="2" stroke-linejoin="round"/>`;
  }).join("");
  const idxNow = cols.findIndex(c => c.year === GRID.now.year && c.week === GRID.now.week);
  const now = idxNow >= 0 ? `<line x1="${x(idxNow).toFixed(1)}" y1="${T}"
    x2="${x(idxNow).toFixed(1)}" y2="${H - B}" stroke="#c8515f" stroke-width="1"
    opacity=".4"/>` : "";
  const sum = k => (gRow(g, k) || { values: [] }).values.reduce((t, v) => t + (v || 0), 0);
  modal({
    title: g.name, sub: g.sub + " · demand against production", wide: true,
    body: `<div class="mstat">
        <div><s>Demand</s><b>${fmtMU(sum("demand"))}</b></div>
        <div><s>Production</s><b>${fmtMU(sum("production"))}</b></div>
        <div><s>Coverage</s><b>${g.coverage_pct == null ? "—"
          : Math.round(g.coverage_pct) + "%"}</b></div>
        <div><s>New beds</s><b>${fmt(g.new_beds)}</b></div>
      </div>
      <div style="display:flex;gap:16px;margin-bottom:8px">${series.map(sr =>
        `<span style="display:inline-flex;align-items:center;gap:6px;
          font:500 10.5px var(--sans);color:var(--ink-4)"><i style="width:14px;height:3px;
          border-radius:2px;background:${sr.colour}"></i>${sr.label}</span>`).join("")}</div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${
        now}${gl}${paths}${ax}</svg>`,
  });
}

/* ── What changed ────────────────────────────────────────────── */
function openChanges() {
  const list = [...EDITS.values()];
  const rows = list.length ? list.map(e => `<div class="chg">
      <div class="chg__w">W${e.week}<span style="font-size:8px;color:var(--ink-faint)">/${
        String(e.year).slice(-2)}</span></div>
      <div class="chg__n">${esc(e.name)}</div>
      <div class="chg__v"><s>${e.before == null ? "empty" : fmt(e.before)}</s><b>${
        e.after == null ? "cleared" : fmt(e.after)}</b></div>
      <button class="chg__u" data-act="undo:${esc(e.demand)}|${e.year}|${e.week}"
        title="Put it back">undo</button></div>`).join("")
    : `<p style="font:400 11.5px var(--sans);color:var(--ink-faint);padding:14px 0">
       Nothing changed this session.</p>`;
  modal({
    title: "Changes this session",
    sub: list.length ? `${list.length} cell${list.length > 1 ? "s" : ""} edited`
                     : "the sheet matches the register",
    body: rows,
    actions: list.length
      ? `<button class="btn btn--ghost" data-act="undoall">Undo all</button>` : "",
    on: (act, close) => {
      if (act === "undoall") {
        close();
        const all = [...EDITS.values()];
        all.reduce((p, e) => p.then(() => api("grid.set_demand_week", {
          demand: e.demand, year: e.year, week: e.week, stems: e.before, force: 1,
        })), Promise.resolve()).then(() => {
          EDITS.clear(); toast(`Reverted ${all.length} cells`); loadGrid(true);
        });
      } else if (act.startsWith("undo:")) {
        const [d, y, w] = act.slice(5).split("|");
        const e = EDITS.get(ekey(d, +y, +w));
        close();
        api("grid.set_demand_week", { demand: d, year: +y, week: +w,
                                      stems: e.before, force: 1 })
          .then(() => { EDITS.delete(ekey(d, +y, +w)); toast("Reverted"); loadGrid(true); });
      }
    },
  });
}


/* ══ Scenarios ═════════════════════════════════════════════════════
   Ported from the standalone TC Scenarios / TC Planner pages, which ran on
   the older Market Demand Plan doctypes. Same questions, this model. */
let SCEN = { demand: null, kind: "baseline", delay: 4, qty: 100,
             weeks: null, data: null, busy: false };

function drawScenarios() {
  const body = $("#scenbody");
  if (!SCEN.demand) {
    body.innerHTML = `<div class="card"><div class="empty">Loading registers…</div></div>`;
    api("scenarios.registers").then(r => {
      let list = r.registers || [];
      if (FARM) list = list.filter(x => x.farm === FARM);
      if (VARIETY) list = list.filter(x => x.variety === VARIETY);
      if (!list.length) {
        body.innerHTML = `<div class="card"><div class="empty"><b>No demand registers</b>
          Create one to run scenarios against it.</div></div>`;
        return;
      }
      SCEN.demand = list[0].name; SCEN.list = list; runScenario();
    }).catch(e => { body.innerHTML = `<div class="card"><div class="empty">${
      esc(e.message)}</div></div>`; });
    return;
  }
  paintScenarios();
}

function runScenario() {
  SCEN.busy = true; paintScenarios();
  api("scenarios.run", {
    demand: SCEN.demand, scenario: SCEN.kind,
    qty_pct: SCEN.qty, delay_weeks: SCEN.delay,
    field_weeks: SCEN.weeks ? JSON.stringify(SCEN.weeks) : null,
  }).then(r => { SCEN.data = r; SCEN.busy = false; paintScenarios(); })
    .catch(e => { SCEN.busy = false; toast(e.message); paintScenarios(); });
}

const SKINDS = [
  ["baseline", "Baseline", "the order lands on time, sized to cover the year"],
  ["late", "Late TC", "the order slips — the whole chain shifts right"],
  ["quantity", "Wrong quantity", "too few plantlets, or too many"],
  ["schedule", "Cutting schedule", "cuttings are not taken every week"],
];

function paintScenarios() {
  const d = SCEN.data, R = d && d.result;
  const cur = (SCEN.list || []).find(x => x.name === SCEN.demand) || {};
  if (SCEN.list && SCEN.list.length && !cur.name) {
    SCEN.demand = SCEN.list[0].name; SCEN.data = null; runScenario(); return;
  }
  let h = `<div class="card" style="padding:14px 18px;margin-bottom:14px">
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <div class="fsel" style="box-shadow:none;background:var(--bg)">
        <small>Register</small>
        <select id="sc-reg">${(SCEN.list || []).map(x =>
          `<option value="${esc(x.name)}"${x.name === SCEN.demand ? " selected" : ""}>${
            esc(x.variety)} · ${esc(x.farm)}</option>`).join("")}</select></div>
      <div style="flex:1"></div>
      <div class="pillgroup">${SKINDS.map(([k, label]) =>
        `<button data-sc="${k}" class="${SCEN.kind === k ? "on" : ""}">${label}</button>`
      ).join("")}</div>
    </div>
    <div style="font:400 11px var(--sans);color:var(--ink-faint);margin-top:9px">${
      esc((SKINDS.find(x => x[0] === SCEN.kind) || [])[2] || "")}</div>`;

  if (SCEN.kind === "late") h += `<div style="margin-top:12px;display:flex;
    align-items:center;gap:14px"><label style="font:500 10px var(--meta);
    letter-spacing:.5px;text-transform:uppercase;color:var(--ink-mute)">Weeks late</label>
    <input type="range" id="sc-delay" min="0" max="26" value="${SCEN.delay}"
      style="flex:1;max-width:340px;accent-color:var(--s-forecast)">
    <b style="font:600 15px var(--grid);color:var(--ink);width:52px">+${SCEN.delay}w</b></div>`;
  if (SCEN.kind === "quantity") h += `<div style="margin-top:12px;display:flex;
    align-items:center;gap:14px"><label style="font:500 10px var(--meta);
    letter-spacing:.5px;text-transform:uppercase;color:var(--ink-mute)">% of baseline</label>
    <input type="range" id="sc-qty" min="25" max="200" step="5" value="${SCEN.qty}"
      style="flex:1;max-width:340px;accent-color:var(--s-forecast)">
    <b style="font:600 15px var(--grid);color:var(--ink);width:52px">${SCEN.qty}%</b></div>`;
  if (SCEN.kind === "schedule") {
    const on = SCEN.weeks || Array.from({ length: 52 }, (_x, i) => i + 1);
    h += `<div style="margin-top:12px"><div style="font:500 10px var(--meta);
      letter-spacing:.5px;text-transform:uppercase;color:var(--ink-mute);margin-bottom:7px">
      Weeks cuttings are taken — click to toggle</div>
      <div style="display:grid;grid-template-columns:repeat(26,1fr);gap:2px">${
      Array.from({ length: 52 }, (_x, i) => i + 1).map(w =>
        `<button class="scwk${on.includes(w) ? " on" : ""}" data-w="${w}">${w}</button>`
      ).join("")}</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn btn--ghost" data-preset="all" style="padding:5px 11px;font-size:11px">All</button>
        <button class="btn btn--ghost" data-preset="h1" style="padding:5px 11px;font-size:11px">Weeks 1–26</button>
        <button class="btn btn--ghost" data-preset="alt" style="padding:5px 11px;font-size:11px">Every other</button>
      </div></div>`;
  }
  h += `</div>`;

  if (SCEN.busy || !R) {
    h += `<div class="card"><div class="empty">Simulating…</div></div>`;
    $("#scenbody").innerHTML = h; bindScen(); return;
  }

  const cov = R.coverage_pct;
  // The committed plan is the authority. If this simulation disagrees with it,
  // say so on screen rather than presenting a second number as fact.
  const pl = d.plan;
  const gap = pl && pl.coverage_pct != null
    ? Math.abs((pl.coverage_pct || 0) - cov) : 0;
  if (pl && gap > 10) h += `<div class="mwarn" style="margin-bottom:14px">
    <b>This is a simulation, not the plan.</b> Plan ${esc(pl.name)} reports
    ${Math.round(pl.coverage_pct)}% coverage and ${fmt(pl.new_beds_required)} new beds
    for the same register; the figures below say ${cov}%. The plan sizes each
    planting week by week and keeps it; this runs one motherstock at a steady
    rate. Use these numbers to compare scenarios against each other — not as a
    replacement for the plan.</div>`;
  h += `<div class="kpi-grid">
    ${kpi("Coverage", cov + "%", "of demand", cov >= 95 ? "#3f8f4f" : cov >= 80 ? "#d9962e" : "#c4302b",
          fmtMU(R.total_met) + " of " + fmtMU(R.total_demand) + " stems")}
    ${kpi("Tissue culture", fmt(R.tc_qty), "plantlets", "#2a6f8f",
          "baseline " + fmt(d.baseline_qty))}
    ${kpi("Short weeks", fmt(R.shortfall_weeks), "weeks", R.shortfall_weeks ? "#c4302b" : "#3f8f4f",
          fmtMU(R.unmet_stems) + " stems unmet")}
    ${kpi("Order by", "W" + R.order_by.week + "/" + String(R.order_by.year).slice(-2), "",
          "#c8515f", R.lead.total + " weeks total lead")}
  </div>`;

  // Pipeline: order → arrive → mothers ready → first harvest
  const stage = (label, wk, sub) => `<div style="flex:1;min-width:120px">
    <div style="font:700 8px var(--meta);letter-spacing:1px;text-transform:uppercase;
      color:var(--ink-faint)">${label}</div>
    <div style="font:600 15px var(--grid);color:var(--ink);margin-top:2px">${wk}</div>
    <div style="font:400 9.5px var(--meta);color:var(--ink-faint)">${sub}</div></div>`;
  const wl = o => o ? "W" + o.week + "/" + String(o.year).slice(-2) : "—";
  h += `<div class="dcard dcard--wide" style="margin-bottom:14px">
    <div class="dcard__h"><h4>Pipeline</h4><span class="grow"></span>
      <span class="dcard__n">${R.lead.total} weeks from order to first stem</span></div>
    <div style="display:flex;gap:10px;align-items:flex-start">
      ${stage("Order TC", wl(R.order_by), R.lead.supplier + "w supplier lead")}
      ${stage("TC arrives", wl(R.arrival), R.lead.establish + "w to establish")}
      ${stage("Mothers ready", wl(R.ms_ready), R.lead.cut_to_harvest + "w cut to harvest")}
      ${stage("First harvest", wl(R.first_harvest),
              fmt(R.beds_cut_total) + " beds stuck over the run")}
    </div></div>`;

  // Demand vs production
  const W = 1000, H = 240, L = 54, Rp = 14, T = 12, B = 28;
  const n = R.weeks.length;
  const hi = Math.max(1, ...R.weeks.map(w => Math.max(w.demand, w.production)));
  const x = i => L + (n < 2 ? 0 : i / (n - 1) * (W - L - Rp));
  const y = v => H - B - v / hi * (H - T - B);
  const dem = R.weeks.map((w, i) => `${x(i).toFixed(1)},${y(w.demand).toFixed(1)}`).join(" ");
  const pro = R.weeks.map((w, i) => `${x(i).toFixed(1)},${y(w.production).toFixed(1)}`).join(" ");
  let shade = "";
  R.weeks.forEach((w, i) => {
    if (w.production >= w.demand || i === n - 1) return;
    shade += `<rect x="${x(i).toFixed(1)}" y="${y(w.demand).toFixed(1)}"
      width="${(x(i + 1) - x(i)).toFixed(1)}"
      height="${(y(w.production) - y(w.demand)).toFixed(1)}"
      fill="#c4302b" opacity=".14"/>`;
  });
  const every = Math.max(1, Math.round(n / 16));
  const xl = R.weeks.map((w, i) => i % every ? "" :
    `<text x="${x(i).toFixed(1)}" y="${H - 9}" text-anchor="middle" font-size="9"
      fill="#b5b2a9">${esc(w.label)}</text>`).join("");
  h += `<div class="dcard dcard--wide" style="margin-bottom:14px">
    <div class="dcard__h"><h4>Demand against production</h4><span class="grow"></span>
      <span class="dlg"><i style="background:#2a6f8f"></i>Demand</span>
      <span class="dlg"><i style="background:#3f8f4f"></i>Production</span>
      <span class="dlg"><i style="background:#c4302b;opacity:.35"></i>Short</span></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
      ${shade}
      <polyline points="${pro}" fill="none" stroke="#3f8f4f" stroke-width="2"/>
      <polyline points="${dem}" fill="none" stroke="#2a6f8f" stroke-width="2"/>
      ${xl}</svg></div>`;

  // Side by side, so a change can be judged against something
  h += `<div class="card"><div class="card__head"><h3>Against the alternatives</h3>
    <span class="crumb">same register, same protocol</span></div>
    <div class="scroller"><table class="gtab"><thead><tr>
      <th>Scenario</th><th class="n">TC plantlets</th><th class="n">Cut weeks</th>
      <th class="n">Coverage</th><th class="n">Short weeks</th>
      <th class="n">Unmet stems</th><th>First harvest</th></tr></thead><tbody>${
      (d.compare || []).map(c => `<tr>
        <td><b>${esc(c.label)}</b></td>
        <td class="n">${fmt(c.tc_qty)}</td>
        <td class="n">${c.field_weeks}</td>
        <td class="n"><b style="color:${c.coverage_pct >= 95 ? "#2f7a3d"
          : c.coverage_pct >= 80 ? "#8f6110" : "var(--neg)"}">${c.coverage_pct}%</b></td>
        <td class="n">${c.shortfall_weeks}</td>
        <td class="n">${fmt(c.unmet_stems)}</td>
        <td>${wl(c.first_harvest)}</td></tr>`).join("")}</tbody></table></div></div>`;

  $("#scenbody").innerHTML = h;
  bindScen();
}

const kpi = (label, val, unit, acc, sub) => `<div class="kpi" style="--acc:${acc}">
  <div class="kpi__label">${label}</div>
  <div class="kpi__value">${val}${unit ? `<i>${unit}</i>` : ""}</div>
  <div class="kpi__trend"><i></i>${sub}</div></div>`;

function bindScen() {
  const reg = $("#sc-reg");
  if (reg) reg.addEventListener("change", e => {
    SCEN.demand = e.target.value; SCEN.data = null; runScenario();
  });
  document.querySelectorAll("[data-sc]").forEach(b =>
    b.addEventListener("click", () => { SCEN.kind = b.dataset.sc; runScenario(); }));
  const dl = $("#sc-delay");
  if (dl) dl.addEventListener("change", e => { SCEN.delay = +e.target.value; runScenario(); });
  const q = $("#sc-qty");
  if (q) q.addEventListener("change", e => { SCEN.qty = +e.target.value; runScenario(); });
  document.querySelectorAll(".scwk").forEach(b =>
    b.addEventListener("click", () => {
      const w = +b.dataset.w;
      const on = SCEN.weeks || Array.from({ length: 52 }, (_x, i) => i + 1);
      SCEN.weeks = on.includes(w) ? on.filter(v => v !== w) : on.concat(w).sort((a, c) => a - c);
      runScenario();
    }));
  document.querySelectorAll("[data-preset]").forEach(b =>
    b.addEventListener("click", () => {
      const k = b.dataset.preset;
      SCEN.weeks = k === "all" ? Array.from({ length: 52 }, (_x, i) => i + 1)
        : k === "h1" ? Array.from({ length: 26 }, (_x, i) => i + 1)
        : Array.from({ length: 26 }, (_x, i) => i * 2 + 1);
      runScenario();
    }));
}


/* ── Sidebar filters ─────────────────────────────────────────────
   Every view gets them, and they carry counts so a filter tells you what is
   behind it before you click. Farm and variety apply everywhere; the third
   group is whatever the view on screen can usefully be narrowed by. */
let SFILTER = { status: null };

function drawFilters() {
  const el = $("#sidefilters");
  if (!el || !STATE) return;
  const T = STATE.totals;
  const farms = {}, vars = {};
  (STATE.plans || []).concat(STATE.demands || []).forEach(r => {
    if (r.farm) farms[r.farm] = (farms[r.farm] || 0) + 1;
    if (r.variety) vars[r.variety] = (vars[r.variety] || 0) + 1;
  });

  const chip = (label, count, on, attr, tone) =>
    `<button class="side__chip${on ? " on" : ""}" ${attr} title="${esc(label)}">${
      esc(label)}${count == null ? "" : `<b class="${tone || ""}">${count}</b>`}</button>`;

  // Dropdowns, not chips: a farm list grows and a row of pills does not.
  const sel = (label, id, opts, value) => `<label class="fsel">
    <small>${label}</small>
    <select id="${id}">${opts.map(o =>
      `<option value="${esc(o.v)}"${o.v === value ? " selected" : ""}>${esc(o.t)}</option>`
    ).join("")}</select></label>`;

  const farmOpts = [{ v: "", t: `All farms (${Object.keys(farms).length})` }]
    .concat(Object.keys(farms).sort().map(f => ({ v: f, t: `${f} · ${farms[f]}` })));
  const varOpts = [{ v: "", t: `All varieties (${Object.keys(vars).length})` }]
    .concat(Object.keys(vars).sort().map(v => ({ v, t: `${v} · ${vars[v]}` })));

  let h = sel("Farm", "f-farm", farmOpts, FARM)
        + sel("Variety", "f-variety", varOpts, VARIETY);

  const st = viewStatuses();
  if (st.length) h += sel(st.label, "f-status",
    [{ v: "", t: "Any status" }].concat(st.map(o =>
      ({ v: o.value, t: `${o.label} · ${o.count}` }))), SFILTER.status || "");

  if (FARM || VARIETY || SFILTER.status)
    h += `<button class="fbar__clear" data-clear>Clear</button>`;

  // The rail keeps what you read rather than what you set.
  const blockers = (STATE.exceptions || []).filter(a => a.level === "blocker").length;
  const late = (STATE.actions || []).filter(a => a.overdue).length;
  const rail = `<div class="side__label">Programme</div>
    <div class="side__stat"><small>Coverage</small><b>${pct(T.coverage_pct)}</b></div>
    <div class="side__stat"><small>Demand</small><b>${fmtMU(T.demand_stems)}</b></div>
    <div class="side__stat"><small>New beds</small><b>${fmt(T.new_beds)}</b></div>
    <div class="side__stat"><small>Plantings</small><b>${fmt(T.plantings)}</b></div>
    <div class="side__label">Needs you</div>
    <div class="side__stat"><small>Blocking</small><b style="color:${
      blockers ? "var(--neg)" : "var(--pos)"}">${blockers}</b></div>
    <div class="side__stat"><small>Overdue</small><b style="color:${
      late ? "var(--warn)" : "var(--pos)"}">${late}</b></div>
    <div class="side__label">Legend</div><div class="side__legend">
      <span><i style="background:var(--s-forecast)"></i>Demand — you type it</span>
      <span><i style="background:var(--s-actual)"></i>Production — planned</span>
      <span><i style="background:var(--neg)"></i>Short of demand</span>
      <span><i style="background:rgba(10,10,10,.08)"></i>Outside the lead time</span>
    </div>`;

  el.innerHTML = rail;
  const bar = $("#filterbar");
  if (bar) bar.innerHTML = h;
  const wire = root => {
    if (!root) return;
  const on = (id, fn) => { const e = root.querySelector("#" + id);
    if (e) e.addEventListener("change", ev => fn(ev.target.value)); };
  const refilter = () => {
    SEEDED = false; MS = null; SCEN.demand = null; SCEN.data = null;
    load(); if (VIEW === "grid") loadGrid();
    if (VIEW === "scenarios") drawScenarios();
  };
  on("f-farm", v => { FARM = v; refilter(); });
  on("f-variety", v => { VARIETY = v; refilter(); });
  on("f-status", v => { SFILTER.status = v || null; draw(); });
  root.querySelectorAll("[data-clear]").forEach(b => b.addEventListener("click", () => {
    FARM = ""; VARIETY = ""; SFILTER.status = null; SEEDED = false;
    load(); loadGrid(); }));
  };
  wire(bar);
}

/* The third filter group depends on what is on screen. */
function viewStatuses() {
  const count = (rows, field, v) => rows.filter(r => r[field] === v).length;
  const tone = v => /Rejected|Uprooted|Retired|Expired/i.test(v) ? "hot"
    : /Draft|Pending|Planned|Fallow/i.test(v) ? "mod" : "";
  const mk = (label, rows, field) => {
    const seen = [...new Set(rows.map(r => r[field]).filter(Boolean))].sort();
    const out = seen.map(v => ({ label: v, value: v, count: count(rows, field, v),
                                 tone: tone(v) }));
    out.label = label;
    return out;
  };
  if (VIEW === "plantings") return mk("Planting status", STATE.plantings, "planting_status");
  if (VIEW === "plans") return mk("Plan status", STATE.plans, "status");
  if (VIEW === "blocks") return mk("Block status", STATE.blocks.blocks, "block_status");
  if (VIEW === "motherstock") return mk("Batch status", STATE.motherstock, "batch_status");
  const none = []; none.label = ""; return none;
}

/* Rows the status filter lets through. */
const byStatus = (rows, field) => !SFILTER.status ? rows
  : rows.filter(r => r[field] === SFILTER.status);


/* ── Row detail ──────────────────────────────────────────────────
   Every table row opens. A read-only table whose rows do nothing is a
   dead end, and the whole point of the page is not sending people to Desk
   to read a number. */
function openRecord(doctype, name, title, sub, fields, extra) {
  const rows = fields.filter(f => f[1] !== undefined && f[1] !== null && f[1] !== "")
    .map(([label, value, tone]) => `<div class="rec">
      <s>${esc(label)}</s><b class="${tone || ""}">${value}</b></div>`).join("");
  modal({
    title, sub, wide: fields.length > 12,
    body: `<div class="recgrid">${rows}</div>${extra || ""}`,
    actions: `<a class="inbox__btn ghost" href="${
      ((BOOT && BOOT.routes) || {})[doctype]}/${encodeURIComponent(name)}"
      target="_blank">Open record</a>`,
  });
}
const wk = (w, y) => w ? `W${w}/${String(y).slice(-2)}` : "—";

/* ── Tables ──────────────────────────────────────────────────── */
